name: R37 Crash Containment Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r37-crash-containment-preflight-once.yml'

permissions:
  contents: read

concurrency:
  group: netpilot-r37-crash-containment-preflight-once
  cancel-in-progress: false

env:
  NETPILOT_R37_SHA: 4bec7f9333419f6275301d5a24b9afd3a4dee54b

jobs:
  linux-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R37_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkpoint
        run: test "$(git rev-parse HEAD)" = "$NETPILOT_R37_SHA"
      - name: Security gates
        run: |
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh
          bash scripts/security/r35-service-integration-boundary-check.sh
          bash scripts/security/r36-localsystem-lab-boundary-check.sh
          bash scripts/security/r37-crash-containment-boundary-check.sh
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build solution
        run: |
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore
      - name: Core tests
        run: dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build

  windows-containment:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R37_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkpoint
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R37_SHA) { throw 'R37 checkpoint drift.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore Windows tests and lab projects
        shell: pwsh
        run: |
          dotnet restore tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows tests
        run: dotnet build tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-restore
      - name: Build R36 lab service on hardened launcher
        run: dotnet build tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release --no-restore
      - name: Build R36 IPC client
        run: dotnet build tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release --no-restore
      - name: Windows tests including kill-on-close Job Object
        run: dotnet test tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-build
      - name: Evidence boundary
        shell: pwsh
        run: |
          Write-Host 'R37 preflight performs no ByeDPI native execution and registers no Windows service.'
          Write-Host 'Production admission remains BLOCK.'
