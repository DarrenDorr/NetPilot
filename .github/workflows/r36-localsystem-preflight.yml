name: R36 LocalSystem Lab Preflight

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r36-localsystem-preflight.yml'

permissions:
  contents: read

concurrency:
  group: netpilot-r36-localsystem-preflight
  cancel-in-progress: false

env:
  NETPILOT_R36_SHA: aa2711ae1bce1425306aad3cd606295c7b750c90

jobs:
  linux-boundary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R36_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkpoint
        run: test "$(git rev-parse HEAD)" = "$NETPILOT_R36_SHA"
      - name: Security gates
        run: |
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh
          bash scripts/security/r35-service-integration-boundary-check.sh
          bash scripts/security/r36-localsystem-lab-boundary-check.sh
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build solution
        run: |
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore

  windows-lab-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R36_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkpoint
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R36_SHA) { throw 'R36 checkpoint drift.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore lab projects and Windows tests
        shell: pwsh
        run: |
          dotnet restore tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build lab service
        run: dotnet build tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release --no-restore
      - name: Build lab client
        run: dotnet build tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release --no-restore
      - name: Windows tests
        run: dotnet test tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-restore
      - name: Evidence boundary
        shell: pwsh
        run: |
          Write-Host 'R36 preflight performs NO native execution and registers NO Windows service.'
          Write-Host 'Production admission remains BLOCK.'
