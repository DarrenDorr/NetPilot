name: R42 Package Lifecycle Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r42-package-lifecycle-preflight-once.yml'

permissions:
  contents: read

env:
  NETPILOT_R42_SHA: 1bffd091f9ac49a59e7145d48e8658df7d6eb608

jobs:
  package-lifecycle-policy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R42 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R42_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkpoint and fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NETPILOT_R42_SHA"
          bash scripts/security/r42-byedpi-package-lifecycle-check.sh
          bash scripts/security/r41-1-release-metadata-hygiene-check.sh
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Run Core tests including R42 lifecycle policy
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build
          echo 'R42_CORE_TESTS=PASS'
          echo 'R42_NATIVE_EXECUTION_TESTED=False'
          echo 'R42_PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R42_PACKAGE_LIFECYCLE_PREFLIGHT_PASS_BLOCK'
