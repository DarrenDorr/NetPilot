name: Windows UAC Security Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  uac-installer-security:
    # Отдельная изолированная Windows VM. Runner должен быть запущен ИНТЕРАКТИВНО
    # от обычного пользователя, а не как служба и не от администратора.
    runs-on: [self-hosted, windows, netpilot-uac-lab]
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Verify isolated standard-user UAC lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          $isAdmin = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $sessionId = (Get-Process -Id $PID).SessionId
          $uac = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System' -Name EnableLUA -ErrorAction Stop

          Write-Host "Identity: $($identity.Name)"
          Write-Host "SID: $($identity.User.Value)"
          Write-Host "Session ID: $sessionId"
          Write-Host "Elevated/Admin token: $isAdmin"
          Write-Host "EnableLUA: $($uac.EnableLUA)"

          if ($identity.IsSystem) { throw 'Runner must not execute as LocalSystem.' }
          if ($sessionId -eq 0) { throw 'Runner must execute in an interactive desktop session, not Session 0.' }
          if ($isAdmin) { throw 'Runner must start from a standard-user token. UAC elevation must happen only inside Inno Setup.' }
          if ($uac.EnableLUA -ne 1) { throw 'Windows UAC (EnableLUA) must be enabled.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows security tests
        shell: pwsh
        run: |
          dotnet restore tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj
          dotnet build tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-restore

      - name: IPC identity and per-SID profile tests in standard-user session
        shell: pwsh
        run: dotnet test tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-build

      - name: Publish isolated live IPC lab client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $labDir = Join-Path $env:PUBLIC "NetPilot-UacLab-$env:GITHUB_RUN_ID"
          if (Test-Path $labDir) {
            Remove-Item $labDir -Recurse -Force
          }

          dotnet publish tools/NetPilot.WindowsIpcLabClient/NetPilot.WindowsIpcLabClient.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            --output $labDir

          $client = Join-Path $labDir 'NetPilot.WindowsIpcLabClient.exe'
          if (-not (Test-Path $client)) {
            throw 'Live IPC lab client was not published.'
          }

          $item = Get-Item $client
          $hash = Get-FileHash -Algorithm SHA256 -Path $client
          Write-Host "Lab client: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"
          Write-Host 'The lab client contains no password/credential handling and only sends the fixed Ping IPC request.'

      - name: Build installer
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/build-installer.ps1 -Version 0.1.0-alpha-uac -VersionInfoVersion 0.1.0.0

      - name: Standard user to Inno UAC to installation-owner SID binding
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path 'artifacts\installer\NetPilot-Setup-0.1.0-alpha-uac-x64.exe'
          $expectedSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $setupLog = Join-Path $env:RUNNER_TEMP 'netpilot-uac-setup.log'

          Write-Host 'A real Windows UAC consent/credential prompt is expected on the VM secure desktop.'
          Write-Host 'Setup is intentionally launched WITHOUT PowerShell -Verb RunAs.'
          Write-Host 'Inno Setup itself must request elevation so ExecAsOriginalUser retains the original standard-user identity.'
          Write-Host 'Do not disable UAC and do not use a test-only SID/elevation bypass.'

          $arguments = @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/LOG=$setupLog")
          $process = Start-Process -FilePath $setup -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            if (Test-Path $setupLog) { Get-Content $setupLog -Encoding Unicode -ErrorAction SilentlyContinue }
            throw "Setup failed with exit code $($process.ExitCode)."
          }

          $root = "$env:ProgramFiles\NetPilot"
          $sidPath = "$root\Config\authorized-user.sid"
          $noncePath = "$root\Config\enrollment.nonce"
          $sessionPath = "$root\Config\enrollment.session"

          $service = Get-CimInstance Win32_Service -Filter "Name='NetPilot.Service'"
          if ($null -eq $service) { throw 'NetPilot.Service was not registered.' }
          if ($service.StartName -ne 'LocalSystem') { throw "Unexpected service account: $($service.StartName)" }
          if ($service.StartMode -ne 'Auto') { throw "Unexpected service start mode after successful enrollment: $($service.StartMode)" }
          if ($service.State -ne 'Running') { throw "Service is not running: $($service.State)" }

          if (-not (Test-Path $sidPath)) { throw 'authorized-user.sid was not created.' }
          $actualSid = (Get-Content $sidPath -Raw).Trim()
          if ($actualSid -ne $expectedSid) {
            throw "Owner SID mismatch. Expected standard-user SID $expectedSid, got $actualSid."
          }
          if (Test-Path $noncePath) { throw 'Enrollment nonce remained after binding.' }
          if (Test-Path $sessionPath) { throw 'Enrollment session marker remained after binding.' }

          Write-Host "PASS: standard-user SID $expectedSid survived the real Inno UAC boundary and owns machine-level NetPilot provisioning."

      - name: Live IPC installation owner uses own SID profile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $client = Join-Path $env:PUBLIC "NetPilot-UacLab-$env:GITHUB_RUN_ID\NetPilot.WindowsIpcLabClient.exe"
          if (-not (Test-Path $client)) { throw 'Live IPC lab client is missing.' }

          $output = & $client --expect-authorized 2>&1
          $exitCode = $LASTEXITCODE
          $output | ForEach-Object { Write-Host $_ }

          if ($exitCode -ne 0) {
            throw "Authorized live IPC probe failed with exit code $exitCode."
          }
          if (-not ($output -contains 'RESULT=AUTHORIZED_PASS')) {
            throw 'Authorized live IPC probe did not return AUTHORIZED_PASS.'
          }

          $expectedSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          if (-not ($output -contains "SID=$expectedSid")) {
            throw 'Authorized live IPC probe did not run as the installation-owner SID.'
          }

          $profileRoot = "$env:ProgramFiles\NetPilot\Users\$expectedSid"
          if (-not (Test-Path $profileRoot)) {
            throw "Owner per-SID profile was not created: $profileRoot"
          }

          Write-Host 'PASS: installation owner authenticated to LocalSystem service, received Ping=Ok, and has a dedicated SID profile.'

      - name: Live IPC accepts a different standard-user SID with isolated profile
        shell: pwsh
        env:
          NETPILOT_UAC_LAB_OTHER_USER: ${{ secrets.NETPILOT_UAC_LAB_OTHER_USER }}
          NETPILOT_UAC_LAB_OTHER_PASSWORD: ${{ secrets.NETPILOT_UAC_LAB_OTHER_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:NETPILOT_UAC_LAB_OTHER_USER)) {
            throw 'Configure the NETPILOT_UAC_LAB_OTHER_USER repository secret with a pre-created second standard Windows lab account.'
          }
          if ([string]::IsNullOrWhiteSpace($env:NETPILOT_UAC_LAB_OTHER_PASSWORD)) {
            throw 'Configure the NETPILOT_UAC_LAB_OTHER_PASSWORD repository secret for the second standard Windows lab account.'
          }

          $client = Join-Path $env:PUBLIC "NetPilot-UacLab-$env:GITHUB_RUN_ID\NetPilot.WindowsIpcLabClient.exe"
          if (-not (Test-Path $client)) { throw 'Live IPC lab client is missing.' }

          $ownerSid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $ownerProfile = "$env:ProgramFiles\NetPilot\Users\$ownerSid"
          $ownerSidPath = "$env:ProgramFiles\NetPilot\Config\authorized-user.sid"
          $securePassword = ConvertTo-SecureString $env:NETPILOT_UAC_LAB_OTHER_PASSWORD -AsPlainText -Force
          $credential = [PSCredential]::new($env:NETPILOT_UAC_LAB_OTHER_USER, $securePassword)

          # Пароль удаляется из environment до создания дочернего процесса.
          # В command line он никогда не передаётся.
          Remove-Item Env:NETPILOT_UAC_LAB_OTHER_PASSWORD -ErrorAction SilentlyContinue

          $stdoutPath = Join-Path $env:RUNNER_TEMP 'netpilot-uac-other-user.stdout.txt'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'netpilot-uac-other-user.stderr.txt'
          Remove-Item $stdoutPath,$stderrPath -Force -ErrorAction SilentlyContinue

          $process = Start-Process `
            -FilePath $client `
            -ArgumentList '--expect-authorized' `
            -Credential $credential `
            -WorkingDirectory (Split-Path -Parent $client) `
            -RedirectStandardOutput $stdoutPath `
            -RedirectStandardError $stderrPath `
            -Wait `
            -PassThru

          $output = @()
          if (Test-Path $stdoutPath) { $output = @(Get-Content $stdoutPath) }
          $errors = @()
          if (Test-Path $stderrPath) { $errors = @(Get-Content $stderrPath) }

          $output | ForEach-Object { Write-Host $_ }
          $errors | ForEach-Object { Write-Host "LAB-CLIENT-ERROR: $_" }

          if ($process.ExitCode -ne 0) {
            throw "Different-SID live IPC probe failed with exit code $($process.ExitCode)."
          }
          if (-not ($output -contains 'RESULT=AUTHORIZED_PASS')) {
            throw 'Different-SID live IPC probe did not receive Ping=Ok.'
          }
          if (-not ($output -contains 'IS_ADMIN=False')) {
            throw 'The second Windows lab account must be a standard user, not an administrator.'
          }

          $sidLine = $output | Where-Object { $_ -like 'SID=*' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($sidLine)) {
            throw 'Different-SID live IPC probe did not report its SID.'
          }
          $otherSid = $sidLine.Substring(4).Trim()
          if ($otherSid -eq $ownerSid) {
            throw 'The multi-user IPC probe used the same SID as the installation owner.'
          }

          $otherProfile = "$env:ProgramFiles\NetPilot\Users\$otherSid"
          if (-not (Test-Path $ownerProfile)) {
            throw 'Owner SID profile disappeared during multi-user probe.'
          }
          if (-not (Test-Path $otherProfile)) {
            throw "Second-user per-SID profile was not created: $otherProfile"
          }
          if ($ownerProfile -eq $otherProfile) {
            throw 'Different Windows SIDs resolved to the same profile root.'
          }

          $ownerSidAfter = (Get-Content $ownerSidPath -Raw).Trim()
          if ($ownerSidAfter -ne $ownerSid) {
            throw "Second user changed machine-level installation owner SID. Expected $ownerSid, got $ownerSidAfter."
          }

          Write-Host "PASS: different standard-user SID $otherSid received Ping=Ok in its own profile while machine-level owner remained $ownerSid."

      - name: Remove live IPC lab client
        if: always()
        shell: pwsh
        run: |
          $labDir = Join-Path $env:PUBLIC "NetPilot-UacLab-$env:GITHUB_RUN_ID"
          if (Test-Path $labDir) {
            Remove-Item $labDir -Recurse -Force
          }

      - name: Uninstall through real UAC boundary
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = "$env:ProgramFiles\NetPilot\unins000.exe"
          if (Test-Path $uninstaller) {
            Write-Host 'A real Windows UAC consent/credential prompt may be required for uninstall.'
            Write-Host 'Uninstaller is launched without PowerShell -Verb RunAs; Inno must request its own required elevation.'
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstall failed with exit code $($process.ExitCode)." }
          }

          if (Get-Service -Name 'NetPilot.Service' -ErrorAction SilentlyContinue) {
            throw 'NetPilot.Service remained registered after uninstall.'
          }
          if (Test-Path "$env:ProgramFiles\NetPilot\Config\authorized-user.sid") {
            throw 'System authorization state remained after uninstall.'
          }
          if (Test-Path "$env:ProgramFiles\NetPilot\Users") {
            throw 'Per-SID user profile state remained after uninstall.'
          }

      - name: Evidence boundary
        if: always()
        shell: pwsh
        run: |
          Write-Host 'This workflow can provide live evidence for: interactive standard-user start, UAC enabled, Inno-initiated elevation, LocalSystem service account, machine-level owner SID binding, owner Ping=Ok, second standard-user Ping=Ok with a distinct SID profile, unchanged installation owner, and uninstall cleanup.'
          Write-Host 'Launching Setup with PowerShell -Verb RunAs is intentionally forbidden because it destroys the original-user evidence required by ExecAsOriginalUser.'
          Write-Host 'The multi-user SID isolation test requires two pre-created distinct standard Windows lab accounts. Password is supplied only through a GitHub Actions secret and is never placed in a command line or printed.'
          Write-Host 'A PASS may be claimed only when every non-cleanup step above completed successfully on the isolated self-hosted Windows lab.'
