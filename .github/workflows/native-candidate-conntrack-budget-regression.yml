name: Native Candidate Conntrack Budget Regression

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-conntrack-budget-regression.yml"
      - "security/native-admission/harnesses/zapret2-r28/conntrack_budget_harness.c"
      - "security/native-admission/patches/zapret2-r28/**"
      - "security/native-admission/zapret2-v1.0.6-plus-uaf-fix-fork-candidate.yaml"

permissions:
  contents: read

jobs:
  conntrack-budget-regression:
    name: ASan/UBSan conntrack saturation regression without engine execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Checkout exact LuaJIT headers used by controlled candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openresty/luajit2
          ref: dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc
          fetch-depth: 1
          path: luajit
          persist-credentials: false

      - name: Verify exact source and apply reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zapret2 rev-parse HEAD)" = "4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d"
          test "$(git -C zapret2 rev-parse HEAD^)" = "221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
          test "$(git -C zapret2 rev-parse 'HEAD^{tree}')" = "5c2a77786cc7089145abe2ca99bcc53a8ed7de15"
          test "$(git -C luajit rev-parse HEAD)" = "dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/harnesses/zapret2-r28/conntrack_budget_harness.c')" = "a506f0764c17f0a17add02dcc058d90fe7960e66"

          patch_dir="$PWD/netpilot/security/native-admission/patches/zapret2-r28"
          echo "af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff  $patch_dir/0001-explicit-conntrack-feed-result.patch" | sha256sum -c -
          echo "a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783  $patch_dir/0002-bounded-conntrack-resource-result.patch" | sha256sum -c -
          echo "33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68  $patch_dir/0003-bounded-delayed-queue-bytes.patch" | sha256sum -c -
          echo "f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777  $patch_dir/0004-explicit-daemon-stdio-redirection.patch" | sha256sum -c -
          echo "67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1  $patch_dir/0005-fail-closed-zero-conntrack-budget.patch" | sha256sum -c -

          for patch in \
            0001-explicit-conntrack-feed-result.patch \
            0002-bounded-conntrack-resource-result.patch \
            0003-bounded-delayed-queue-bytes.patch \
            0004-explicit-daemon-stdio-redirection.patch \
            0005-fail-closed-zero-conntrack-budget.patch
          do
            git -C zapret2 apply --check "$patch_dir/$patch"
            git -C zapret2 apply "$patch_dir/$patch"
          done

          grep -Fq 'CTRACK_FEED_RESOURCE_EXHAUSTED = 2' zapret2/nfq2/conntrack.h
          grep -Fq '!max_entries || HASH_COUNT(*pp) >= max_entries' zapret2/nfq2/conntrack.c
          grep -Fq 'ConntrackPoolSetMaxEntries' zapret2/nfq2/conntrack.c

      - name: Install isolated harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential strace

      - name: Strict-compile and link patched conntrack harness with ASan/UBSan
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch
          gcc \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 \
            -g \
            -fsanitize=address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections \
            -Wall -Wextra -Werror \
            -Izapret2/nfq2 \
            -Iluajit/src \
            -c netpilot/security/native-admission/harnesses/zapret2-r28/conntrack_budget_harness.c \
            -o scratch/conntrack_budget_harness.o \
            2>&1 | tee evidence/harness-compile.log

          gcc \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 \
            -g \
            -fsanitize=address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections \
            -Wall -Wextra \
            -Izapret2/nfq2 \
            -Iluajit/src \
            scratch/conntrack_budget_harness.o \
            zapret2/nfq2/conntrack.c \
            zapret2/nfq2/packet_queue.c \
            -Wl,--gc-sections \
            -o scratch/conntrack_budget_harness \
            2>&1 | tee evidence/link.log

          test -x scratch/conntrack_budget_harness

      - name: Run conntrack resource saturation regression
        id: regression
        continue-on-error: true
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          timeout 20s ./scratch/conntrack_budget_harness \
            2>&1 | tee evidence/regression.log
          grep -Fxq 'conntrack_budget_harness: PASS' evidence/regression.log

      - name: Verify harness performs no network syscalls
        id: no_network
        continue-on-error: true
        if: steps.regression.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=0:abort_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          strace -f -qq -e trace=network -o evidence/network-syscalls.log \
            ./scratch/conntrack_budget_harness >/dev/null 2>&1

          if grep -Eq 'socket\(|socketpair\(|connect\(|accept\(|accept4\(|bind\(|listen\(|sendto\(|recvfrom\(|sendmsg\(|recvmsg\(' evidence/network-syscalls.log; then
            cat evidence/network-syscalls.log
            exit 1
          fi

      - name: Produce text-only evidence and remove harness binaries
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          harness_sha256="$(sha256sum netpilot/security/native-admission/harnesses/zapret2-r28/conntrack_budget_harness.c | awk '{print $1}')"
          binary_sha256='not-produced'
          if [ -f scratch/conntrack_budget_harness ]; then
            binary_sha256="$(sha256sum scratch/conntrack_budget_harness | awk '{print $1}')"
          fi
          {
            echo 'schema_version=2'
            echo 'scope=isolated-conntrack-resource-budget-regression'
            echo 'candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0005'
            echo 'source_commit=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d'
            echo 'source_tree=5c2a77786cc7089145abe2ca99bcc53a8ed7de15'
            echo 'luajit_headers_commit=dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc'
            echo 'patch_0005_sha256=67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1'
            echo 'harness_git_blob_sha1=a506f0764c17f0a17add02dcc058d90fe7960e66'
            echo "harness_sha256=$harness_sha256"
            echo "instrumented_harness_binary_sha256=$binary_sha256"
            echo "compile_outcome=$COMPILE_OUTCOME"
            echo "regression_outcome=$REGRESSION_OUTCOME"
            echo "no_network_syscalls_outcome=$NO_NETWORK_OUTCOME"
            echo 'tested_max_entries=3,0,4'
            echo 'tested_semantics=new-flow-over-cap-resource-exhausted;zero-budget-new-flow-resource-exhausted;existing-forward-ok;existing-reverse-ok;explicit-budget-increase-ok;destroy-empty'
            echo 'candidate_engine_executed=false'
            echo 'windivert_present=false'
            echo 'driver_installed=false'
            echo 'network_interception_enabled=false'
          } > evidence/conntrack-budget-regression.txt

          rm -f scratch/conntrack_budget_harness scratch/conntrack_budget_harness.o
          test ! -e scratch/conntrack_budget_harness
          test ! -e scratch/conntrack_budget_harness.o
          sha256sum evidence/* | sort > evidence/SHA256SUMS-conntrack-budget-regression.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-conntrack-budget-regression-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce isolated resource gate
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          test "$COMPILE_OUTCOME" = 'success'
          test "$REGRESSION_OUTCOME" = 'success'
          test "$NO_NETWORK_OUTCOME" = 'success'
