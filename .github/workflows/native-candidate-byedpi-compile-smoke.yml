name: Native Candidate ByeDPI Compile Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-byedpi-compile-smoke.yml"
      - "security/native-admission/patches/byedpi-r28/**"
      - "security/native-admission/byedpi-v0.17.3-fork-candidate.yaml"
      - "docs/BYEDPI-*.md"

permissions:
  contents: read

jobs:
  byedpi-compile-smoke:
    name: Apply loopback hardening and compile Linux/Windows without execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact ByeDPI v0.17.3 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hufrea/byedpi
          ref: 7efde1b1296eaaa187b70e951894dde17527489c
          fetch-depth: 1
          path: byedpi
          persist-credentials: false

      - name: Verify source identity and apply reviewed canonical patch
        shell: bash
        run: |
          set -euo pipefail
          expected_commit='7efde1b1296eaaa187b70e951894dde17527489c'
          expected_tree='8d13f6f5939190cd27ee68696247073a00b3e7dc'
          patch_path='security/native-admission/patches/byedpi-r28/0001-loopback-only-listener.patch'
          expected_blob='fa9ba3349792d66f40d925bc612310e8d18aae8a'
          expected_sha256='3e9a744830082d224592d730a816c4afcf9df15a2a6ab93870409ccf5c94c068'

          observed_commit="$(git -C byedpi rev-parse HEAD)"
          observed_tree="$(git -C byedpi rev-parse 'HEAD^{tree}')"
          observed_blob="$(git -C netpilot rev-parse "HEAD:$patch_path")"

          mkdir -p scratch
          git -C netpilot show "HEAD:$patch_path" > scratch/byedpi-0001.patch
          observed_sha256="$(sha256sum scratch/byedpi-0001.patch | awk '{print $1}')"

          printf 'observed_source_commit=%s\n' "$observed_commit"
          printf 'observed_source_tree=%s\n' "$observed_tree"
          printf 'observed_patch_blob=%s\n' "$observed_blob"
          printf 'observed_patch_sha256=%s\n' "$observed_sha256"

          if [ "$observed_commit" != "$expected_commit" ]; then
            echo 'ByeDPI source commit mismatch' >&2
            exit 1
          fi
          if [ "$observed_tree" != "$expected_tree" ]; then
            echo 'ByeDPI source tree mismatch' >&2
            exit 1
          fi
          if [ "$observed_blob" != "$expected_blob" ]; then
            echo 'ByeDPI canonical patch blob mismatch' >&2
            exit 1
          fi
          if [ "$observed_sha256" != "$expected_sha256" ]; then
            echo 'ByeDPI canonical patch SHA-256 mismatch' >&2
            exit 1
          fi

          git -C byedpi apply --verbose --check "$PWD/scratch/byedpi-0001.patch"
          git -C byedpi apply --verbose "$PWD/scratch/byedpi-0001.patch"

          grep -Fq 'Listening IP, loopback only; default 127.0.0.1' byedpi/main.c || { echo 'ByeDPI help-text hardening anchor missing after patch' >&2; exit 1; }
          grep -Fq 'netpilot_is_loopback_addr' byedpi/main.c || { echo 'ByeDPI loopback validator missing after patch' >&2; exit 1; }
          grep -Fq 'get_addr("127.0.0.1", &params.laddr)' byedpi/main.c || { echo 'ByeDPI loopback default missing after patch' >&2; exit 1; }

      - name: Install compile-only toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential mingw-w64 file

      - name: Compile Linux candidate without execution
        id: linux_compile
        continue-on-error: true
        shell: bash
        working-directory: byedpi
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          make clean >/dev/null
          make CC=gcc 2>&1 | tee ../evidence/linux-build.log
          test -f ciadpi
          file ciadpi | tee ../evidence/linux-file.txt
          sha256sum ciadpi | awk '{print $1}' > ../evidence/linux-binary.sha256
          rm -f ciadpi
          make clean >/dev/null
          test ! -e ciadpi

      - name: Cross-compile Windows x64 candidate without execution
        id: windows_compile
        continue-on-error: true
        shell: bash
        working-directory: byedpi
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          make clean >/dev/null
          make windows CC=x86_64-w64-mingw32-gcc 2>&1 | tee ../evidence/windows-build.log
          test -f ciadpi.exe
          file ciadpi.exe | tee ../evidence/windows-file.txt
          sha256sum ciadpi.exe | awk '{print $1}' > ../evidence/windows-binary.sha256
          rm -f ciadpi.exe
          make clean >/dev/null
          test ! -e ciadpi.exe

      - name: Produce text-only evidence
        if: always()
        shell: bash
        env:
          LINUX_OUTCOME: ${{ steps.linux_compile.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows_compile.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          linux_compiler='not-installed-or-not-observed'
          windows_compiler='not-installed-or-not-observed'
          if command -v gcc >/dev/null 2>&1; then
            linux_compiler="$(gcc --version | head -n1)"
          fi
          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            windows_compiler="$(x86_64-w64-mingw32-gcc --version | head -n1)"
          fi
          {
            echo 'schema_version=5'
            echo 'scope=byedpi-v0.17.3-loopback-hardening-compile-only'
            echo 'source_commit=7efde1b1296eaaa187b70e951894dde17527489c'
            echo 'source_tree=8d13f6f5939190cd27ee68696247073a00b3e7dc'
            echo 'patch_0001_git_blob_sha1=fa9ba3349792d66f40d925bc612310e8d18aae8a'
            echo 'patch_0001_sha256=3e9a744830082d224592d730a816c4afcf9df15a2a6ab93870409ccf5c94c068'
            echo "linux_compile_outcome=$LINUX_OUTCOME"
            echo "windows_x64_cross_compile_outcome=$WINDOWS_OUTCOME"
            echo "linux_compiler=$linux_compiler"
            echo "windows_compiler=$windows_compiler"
            echo 'candidate_binary_executed=false'
            echo 'listener_opened=false'
            echo 'routing_changed=false'
          } > evidence/byedpi-compile-smoke.txt
          rm -f scratch/byedpi-0001.patch
          sha256sum evidence/* | sort > evidence/SHA256SUMS-byedpi-compile-smoke.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byedpi-r28-compile-smoke-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce compile-only gate
        if: always()
        shell: bash
        env:
          LINUX_OUTCOME: ${{ steps.linux_compile.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows_compile.outcome }}
        run: |
          set -euo pipefail
          test "$LINUX_OUTCOME" = 'success'
          test "$WINDOWS_OUTCOME" = 'success'
