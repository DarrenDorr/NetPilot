name: Native Candidate ByeDPI Compile Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-byedpi-compile-smoke.yml"
      - "security/native-admission/patches/byedpi-r28/**"
      - "security/native-admission/byedpi-v0.17.3-fork-candidate.yaml"
      - "docs/BYEDPI-*.md"

permissions:
  contents: read

jobs:
  byedpi-compile-smoke:
    name: Apply hardened patchset and compile Linux/Windows without execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact ByeDPI v0.17.3 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hufrea/byedpi
          ref: 7efde1b1296eaaa187b70e951894dde17527489c
          fetch-depth: 1
          path: byedpi
          persist-credentials: false

      - name: Verify source identity and apply full reviewed patchset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C byedpi rev-parse HEAD)" = "7efde1b1296eaaa187b70e951894dde17527489c"
          test "$(git -C byedpi rev-parse 'HEAD^{tree}')" = "8d13f6f5939190cd27ee68696247073a00b3e7dc"

          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0001-loopback-only-listener.patch')" = "fa9ba3349792d66f40d925bc612310e8d18aae8a"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0002-kavl-iterator-no-before-array-sentinel.patch')" = "6f51d66597847ee49e373922e4905c80b8ee2f47"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0003-pid-file-fail-safe-write.patch')" = "d56d0f8659a49c48c923b6af85a523a952e77e0c"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0004-kavl-empty-erase-guard.patch')" = "9b196b289efd9a2ea1118c5504f4a811aa0becd2"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0005-windows-socket-handle-narrowing-guard.patch')" = "d5cde98057a0ded600468b1f1c69d2e55c3b4d6e"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0006-windows-wait-result-range.patch')" = "0815be26534c291848a8b16bdedb07a6ab1e485f"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/patches/byedpi-r28/0007-windows-aux-socket-probes.patch')" = "e1e7cf53a87e9f51224147d7b1d4faf39dcf8ef6"

          canonical_patch_dir="$PWD/canonical-byedpi-patches"
          mkdir -p "$canonical_patch_dir"
          for patch in \
            0001-loopback-only-listener.patch \
            0002-kavl-iterator-no-before-array-sentinel.patch \
            0003-pid-file-fail-safe-write.patch \
            0004-kavl-empty-erase-guard.patch \
            0005-windows-socket-handle-narrowing-guard.patch \
            0006-windows-wait-result-range.patch \
            0007-windows-aux-socket-probes.patch
          do
            git -C netpilot show "HEAD:security/native-admission/patches/byedpi-r28/$patch" > "$canonical_patch_dir/$patch"
          done

          echo "3e9a744830082d224592d730a816c4afcf9df15a2a6ab93870409ccf5c94c068  $canonical_patch_dir/0001-loopback-only-listener.patch" | sha256sum -c -
          echo "6701c48ef00f81ca7fa95f98a1e6406f657fbdfc028371f568c7918106cd5fb7  $canonical_patch_dir/0002-kavl-iterator-no-before-array-sentinel.patch" | sha256sum -c -
          echo "5d10702499581eeba2f632aa506b5d6c51ceb3e8e093bff25b8dcbc821bb3738  $canonical_patch_dir/0003-pid-file-fail-safe-write.patch" | sha256sum -c -
          echo "fdc13219be9cb9d654ce7995df825decb6ee0f05e63d72481560977bbf3b3c4a  $canonical_patch_dir/0004-kavl-empty-erase-guard.patch" | sha256sum -c -
          echo "7c8f4eee9ff2624346cb886027df66378773d0af04f5f84f54c30815104b4356  $canonical_patch_dir/0005-windows-socket-handle-narrowing-guard.patch" | sha256sum -c -
          echo "136b9fdf34b68a55f0f1a6ebf16e8b61c9b88e6d15eeb923594bdd7bf0fa2a3e  $canonical_patch_dir/0006-windows-wait-result-range.patch" | sha256sum -c -
          echo "a586f60f9be69a203e6b8b17ce1eb6613918074d1e7b0bd98300d23e4553b725  $canonical_patch_dir/0007-windows-aux-socket-probes.patch" | sha256sum -c -

          for patch in \
            0001-loopback-only-listener.patch \
            0002-kavl-iterator-no-before-array-sentinel.patch \
            0003-pid-file-fail-safe-write.patch \
            0004-kavl-empty-erase-guard.patch \
            0005-windows-socket-handle-narrowing-guard.patch \
            0006-windows-wait-result-range.patch \
            0007-windows-aux-socket-probes.patch
          do
            git -C byedpi apply --verbose --check "$canonical_patch_dir/$patch"
            git -C byedpi apply --verbose "$canonical_patch_dir/$patch"
          done

          rm -rf "$canonical_patch_dir"

          grep -Fq 'Listening IP, loopback only; default 127.0.0.1' byedpi/main.c
          grep -Fq 'netpilot_is_loopback_addr' byedpi/main.c
          grep -Fq 'get_addr("127.0.0.1", &params.laddr)' byedpi/main.c
          grep -Fq '#define kavl_at(itr) ((itr)->top? *(itr)->top : 0)' byedpi/kavl.h
          grep -Fq 'if (*root_ == 0) return 0;' byedpi/kavl.h
          grep -Fq 'while (written < (size_t)pid_len)' byedpi/main.c
          grep -Fq 'static int netpilot_socket_to_int(SOCKET sock)' byedpi/proxy.c
          grep -Fq 'if (sock > (SOCKET)INT_MAX)' byedpi/proxy.c
          grep -Fq 'if (ret < WAIT_OBJECT_0 + MAX_TF)' byedpi/desync.c
          grep -Fq 'SOCKET fd = socket(AF_INET, SOCK_STREAM, 0)' byedpi/main.c
          grep -Fq 'SOCKET fd = socket(AF_INET6, SOCK_STREAM, 0)' byedpi/main.c

      - name: Install compile-only toolchains
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential mingw-w64 file

      - name: Enforce targeted Windows warning gates
        id: windows_warning_gate
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch
          x86_64-w64-mingw32-gcc \
            -D_DEFAULT_SOURCE -Ibyedpi -std=c99 -O2 \
            -Wall -Wextra -Wno-unused -Wno-unused-parameter -pedantic \
            -Werror=sign-compare \
            -c byedpi/conev.c -o scratch/conev-win.o \
            2>&1 | tee evidence/windows-conev-warning-gate.log
          x86_64-w64-mingw32-gcc \
            -D_DEFAULT_SOURCE -Ibyedpi -std=c99 -O2 \
            -Wall -Wextra -Wno-unused -Wno-unused-parameter -pedantic \
            -Werror=type-limits \
            -c byedpi/desync.c -o scratch/desync-win.o \
            2>&1 | tee evidence/windows-desync-warning-gate.log
          x86_64-w64-mingw32-gcc \
            -D_DEFAULT_SOURCE -Ibyedpi -std=c99 -O2 \
            -Wall -Wextra -Wno-unused -Wno-unused-parameter -pedantic \
            -Werror=sign-compare -Werror=conversion \
            -c byedpi/main.c -o scratch/main-win.o \
            2>&1 | tee evidence/windows-main-socket-warning-gate.log
          rm -f scratch/conev-win.o scratch/desync-win.o scratch/main-win.o

      - name: Compile Linux candidate twice without execution
        id: linux_compile
        continue-on-error: true
        shell: bash
        working-directory: byedpi
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          make clean >/dev/null
          make CC=gcc 2>&1 | tee ../evidence/linux-build-1.log
          test -f ciadpi
          file ciadpi | tee ../evidence/linux-file.txt
          linux_sha_1="$(sha256sum ciadpi | awk '{print $1}')"
          printf '%s\n' "$linux_sha_1" > ../evidence/linux-binary.sha256
          rm -f ciadpi

          make clean >/dev/null
          make CC=gcc 2>&1 | tee ../evidence/linux-build-2.log
          test -f ciadpi
          linux_sha_2="$(sha256sum ciadpi | awk '{print $1}')"
          printf '%s\n' "$linux_sha_2" > ../evidence/linux-binary-second-build.sha256
          test "$linux_sha_1" = "$linux_sha_2"
          rm -f ciadpi
          make clean >/dev/null
          test ! -e ciadpi

      - name: Cross-compile reproducible Windows x64 candidate twice without execution
        id: windows_compile
        continue-on-error: true
        shell: bash
        working-directory: byedpi
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          deterministic_win_ldflags='-Wl,--no-insert-timestamp -lws2_32 -lmswsock'

          make clean >/dev/null
          make windows CC=x86_64-w64-mingw32-gcc WIN_LDFLAGS="$deterministic_win_ldflags" 2>&1 | tee ../evidence/windows-build-1.log
          test -f ciadpi.exe
          file ciadpi.exe | tee ../evidence/windows-file.txt
          windows_sha_1="$(sha256sum ciadpi.exe | awk '{print $1}')"
          printf '%s\n' "$windows_sha_1" > ../evidence/windows-binary.sha256
          rm -f ciadpi.exe

          make clean >/dev/null
          make windows CC=x86_64-w64-mingw32-gcc WIN_LDFLAGS="$deterministic_win_ldflags" 2>&1 | tee ../evidence/windows-build-2.log
          test -f ciadpi.exe
          windows_sha_2="$(sha256sum ciadpi.exe | awk '{print $1}')"
          printf '%s\n' "$windows_sha_2" > ../evidence/windows-binary-second-build.sha256
          test "$windows_sha_1" = "$windows_sha_2"
          rm -f ciadpi.exe
          make clean >/dev/null
          test ! -e ciadpi.exe

      - name: Produce text-only evidence
        if: always()
        shell: bash
        env:
          WARNING_GATE_OUTCOME: ${{ steps.windows_warning_gate.outcome }}
          LINUX_OUTCOME: ${{ steps.linux_compile.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows_compile.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          linux_compiler='not-installed-or-not-observed'
          windows_compiler='not-installed-or-not-observed'
          if command -v gcc >/dev/null 2>&1; then
            linux_compiler="$(gcc --version | head -n1)"
          fi
          if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1; then
            windows_compiler="$(x86_64-w64-mingw32-gcc --version | head -n1)"
          fi
          {
            echo 'schema_version=10'
            echo 'scope=byedpi-v0.17.3-netpilot-hardening-0001-0007-compile-only'
            echo 'source_commit=7efde1b1296eaaa187b70e951894dde17527489c'
            echo 'source_tree=8d13f6f5939190cd27ee68696247073a00b3e7dc'
            echo 'patch_0001_sha256=3e9a744830082d224592d730a816c4afcf9df15a2a6ab93870409ccf5c94c068'
            echo 'patch_0002_sha256=6701c48ef00f81ca7fa95f98a1e6406f657fbdfc028371f568c7918106cd5fb7'
            echo 'patch_0003_sha256=5d10702499581eeba2f632aa506b5d6c51ceb3e8e093bff25b8dcbc821bb3738'
            echo 'patch_0004_sha256=fdc13219be9cb9d654ce7995df825decb6ee0f05e63d72481560977bbf3b3c4a'
            echo 'patch_0005_sha256=7c8f4eee9ff2624346cb886027df66378773d0af04f5f84f54c30815104b4356'
            echo 'patch_0006_sha256=136b9fdf34b68a55f0f1a6ebf16e8b61c9b88e6d15eeb923594bdd7bf0fa2a3e'
            echo 'patch_0007_sha256=a586f60f9be69a203e6b8b17ce1eb6613918074d1e7b0bd98300d23e4553b725'
            echo "windows_warning_gate_outcome=$WARNING_GATE_OUTCOME"
            echo "linux_compile_outcome=$LINUX_OUTCOME"
            echo "windows_x64_cross_compile_outcome=$WINDOWS_OUTCOME"
            echo "linux_compiler=$linux_compiler"
            echo "windows_compiler=$windows_compiler"
            echo 'socket_handle_policy=event-pool-ingress-and-auxiliary-probes-use-validated-Win64-SOCKET-boundaries'
            echo 'wait_result_policy=only-WAIT_OBJECT_0-through-WAIT_OBJECT_0-plus-MAX_TF-minus-one-is-indexed'
            echo 'linux_reproducibility=two-consecutive-builds-must-match'
            echo 'windows_reproducibility=two-consecutive-builds-must-match'
            echo 'windows_linker_determinism_flag=--no-insert-timestamp'
            echo 'candidate_binary_executed=false'
            echo 'listener_opened=false'
            echo 'routing_changed=false'
            echo 'admission_effect=NONE'
            echo 'release_gate=BLOCK'
          } > evidence/byedpi-compile-smoke.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS-byedpi-compile-smoke.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byedpi-r28-compile-smoke-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce compile-only gate
        if: always()
        shell: bash
        env:
          WARNING_GATE_OUTCOME: ${{ steps.windows_warning_gate.outcome }}
          LINUX_OUTCOME: ${{ steps.linux_compile.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows_compile.outcome }}
        run: |
          set -euo pipefail
          test "$WARNING_GATE_OUTCOME" = 'success'
          test "$LINUX_OUTCOME" = 'success'
          test "$WINDOWS_OUTCOME" = 'success'
