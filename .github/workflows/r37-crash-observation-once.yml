name: R37 ByeDPI Abrupt Service Crash Observation Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r37-crash-observation-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: netpilot-r37-crash-observation-once
  cancel-in-progress: false

env:
  NETPILOT_R36_CODE_SHA: aa2711ae1bce1425306aad3cd606295c7b750c90
  SOURCE_RUN_ID: '41006065721'
  BYEDPI_WINDOWS_SHA256: 866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd
  PACKAGE_VERSION: 0.17.3-netpilot-r34-lab
  SERVICE_NAME: NetPilot.R36.Lab
  PROXY_PORT: '39036'

jobs:
  observe-abrupt-crash:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Checkout exact validated R36 product checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R36_CODE_SHA }}
          path: netpilot
          persist-credentials: false
          fetch-depth: 1

      - name: Download exact ByeDPI candidate from validated source build
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: r36-byedpi-candidate-transfer
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify exact clean lab boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C netpilot rev-parse HEAD).Trim() -ne $env:NETPILOT_R36_CODE_SHA) {
            throw 'R37 product checkpoint drift.'
          }
          $candidate = Resolve-Path 'candidate\ciadpi.exe'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'R37 candidate hash drift.' }

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'R37 requires an administrative hosted Windows runner.'
          }
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) { throw 'R37 client is not in an interactive session.' }

          foreach ($service in @('NetPilot.Service', $env:SERVICE_NAME)) {
            if (Get-Service -Name $service -ErrorAction SilentlyContinue) {
              throw "Refusing pre-existing service: $service"
            }
          }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $root) { throw "Refusing pre-existing NetPilot root: $root" }

          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "NETPILOT_R36_CODE_SHA=$env:NETPILOT_R36_CODE_SHA" | Set-Content evidence\r37-crash.txt
          "BYEDPI_WINDOWS_SHA256=$actual" | Add-Content evidence\r37-crash.txt
          "CLIENT_SESSION_ID=$sessionId" | Add-Content evidence\r37-crash.txt
          'PRODUCTION_ADMISSION=BLOCK' | Add-Content evidence\r37-crash.txt

      - name: Publish isolated R36 lab service and IPC client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage protected service and exact managed engine package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $serviceDir = Join-Path $root 'Lab\R36Service'
          $engineBin = Join-Path $root "Engines\Managed\byedpi\$env:PACKAGE_VERSION\x64\bin"
          $config = Join-Path $root 'Config'
          $users = Join-Path $root 'Users'
          New-Item -ItemType Directory -Force -Path $serviceDir, $engineBin, $config, $users | Out-Null
          Set-Content -LiteralPath (Join-Path $root '.r37-hosted-owned') -Value $env:NETPILOT_R36_CODE_SHA -NoNewline
          Copy-Item -Path 'publish\service\*' -Destination $serviceDir -Recurse
          Copy-Item -LiteralPath 'candidate\ciadpi.exe' -Destination (Join-Path $engineBin 'ciadpi.exe')
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          Set-Content -LiteralPath (Join-Path $config 'enrollment.session') -Value $sessionId -NoNewline

          & icacls.exe $root /inheritance:r | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to protect R37 root inheritance.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set R37 root ACL.' }
          & icacls.exe $root /setowner '*S-1-5-32-544' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set privileged R37 owner.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize R37 tree ACL.' }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $engineBin 'ciadpi.exe')).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'Staged R37 candidate hash drift.' }
          'PROTECTED_PROGRAM_FILES_TREE=True' | Add-Content evidence\r37-crash.txt

      - name: Register and start isolated LocalSystem service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceExe = Join-Path $env:ProgramFiles 'NetPilot\Lab\R36Service\NetPilot.ByeDpiR36ServiceLab.exe'
          $binaryPathName = '"' + $serviceExe + '"'
          New-Service -Name $env:SERVICE_NAME -BinaryPathName $binaryPathName -DisplayName 'NetPilot R37 Crash Observation' -StartupType Manual | Out-Null
          $svc = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($null -eq $svc -or $svc.StartName -ne 'LocalSystem') { throw 'R37 service is not LocalSystem.' }
          Start-Service -Name $env:SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $state = (Get-Service -Name $env:SERVICE_NAME).Status
            if ($state -eq 'Running') { break }
          } while ((Get-Date) -lt $deadline)
          if ($state -ne 'Running') { throw 'R37 LocalSystem service failed to start.' }
          'LOCALSYSTEM_SERVICE_RUNNING=True' | Add-Content evidence\r37-crash.txt

      - name: Start ByeDPI through authenticated IPC and verify ownership
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clientExe = Resolve-Path 'publish\client\NetPilot.ByeDpiR36LabClient.exe'
          & $clientExe --start-for-service-stop 2>&1 | Tee-Object -FilePath evidence\r37-client.txt
          if ($LASTEXITCODE -ne 0) { throw 'R37 IPC start client failed.' }

          $service = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($null -eq $service -or $service.ProcessId -le 0) { throw 'R37 service PID unavailable.' }
          $engines = @(Get-CimInstance Win32_Process -Filter "Name='ciadpi.exe'")
          if ($engines.Count -ne 1) { throw "R37 expected one ciadpi.exe, found $($engines.Count)." }
          $engine = $engines[0]
          if ([uint32]$engine.ParentProcessId -ne [uint32]$service.ProcessId) { throw 'R37 engine is not service-owned.' }
          $owner = Invoke-CimMethod -InputObject $engine -MethodName GetOwner
          if ($owner.User -ne 'SYSTEM') { throw 'R37 engine owner is not SYSTEM.' }

          "SERVICE_PID=$($service.ProcessId)" | Add-Content evidence\r37-crash.txt
          "ENGINE_PID=$($engine.ProcessId)" | Add-Content evidence\r37-crash.txt
          'ENGINE_PARENT_IS_SERVICE=True' | Add-Content evidence\r37-crash.txt
          'ENGINE_OWNER_SYSTEM=True' | Add-Content evidence\r37-crash.txt
          'PRE_CRASH_ENGINE_RUNNING=True' | Add-Content evidence\r37-crash.txt

      - name: Abruptly terminate LocalSystem service process and observe child containment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $service = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          $servicePid = [int]$service.ProcessId
          if ($servicePid -le 0) { throw 'R37 cannot obtain service PID before crash.' }

          Stop-Process -Id $servicePid -Force
          $deadline = (Get-Date).AddSeconds(10)
          do {
            Start-Sleep -Milliseconds 250
            $serviceProcess = Get-Process -Id $servicePid -ErrorAction SilentlyContinue
            if ($null -eq $serviceProcess) { break }
          } while ((Get-Date) -lt $deadline)
          if ($null -ne $serviceProcess) { throw 'R37 failed to terminate service process.' }
          'SERVICE_PROCESS_ABRUPTLY_TERMINATED=True' | Add-Content evidence\r37-crash.txt

          Start-Sleep -Seconds 3
          $residual = @(Get-Process -Name ciadpi -ErrorAction SilentlyContinue)
          $listener = @(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:PROXY_PORT) -ErrorAction SilentlyContinue)
          $residualProcess = $residual.Count -ne 0
          $residualListener = $listener.Count -ne 0
          "ABRUPT_CRASH_RESIDUAL_CIADPI=$residualProcess" | Add-Content evidence\r37-crash.txt
          "ABRUPT_CRASH_RESIDUAL_LISTENER=$residualListener" | Add-Content evidence\r37-crash.txt

          if (-not $residualProcess -and -not $residualListener) {
            'CRASH_CONTAINMENT=PASS' | Add-Content evidence\r37-crash.txt
            'RESULT=R37_CRASH_CONTAINMENT_PASS' | Add-Content evidence\r37-crash.txt
          } else {
            'CRASH_CONTAINMENT=NEEDS_HARDENING' | Add-Content evidence\r37-crash.txt
            'RESULT=R37_CRASH_CONTAINMENT_FINDING' | Add-Content evidence\r37-crash.txt
          }

          Get-Content evidence\r37-crash.txt | Out-Host

      - name: Upload text observation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r37-byedpi-abrupt-service-crash-observation
          path: evidence/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Force-clean only workflow-owned residue
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-Process -Name ciadpi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service -Name $env:SERVICE_NAME -Force -ErrorAction SilentlyContinue }
            & sc.exe delete $env:SERVICE_NAME | Out-Host
          }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $marker = Join-Path $root '.r37-hosted-owned'
          if (Test-Path -LiteralPath $marker) {
            $value = (Get-Content -LiteralPath $marker -Raw).Trim()
            if ($value -eq $env:NETPILOT_R36_CODE_SHA) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host 'WORKFLOW_OWNED_TREE_CLEANUP=PASS'
            } else {
              Write-Warning 'R37 ownership marker mismatch; protected tree not removed.'
            }
          }
