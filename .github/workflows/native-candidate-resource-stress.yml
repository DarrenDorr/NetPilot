name: Native Candidate Resource Stress

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-resource-stress.yml"
      - "security/native-admission/harnesses/zapret2-r28/resource_stress_harness.c"
      - "security/native-admission/patches/zapret2-r28/**"
      - "security/native-admission/zapret2-v1.0.6-plus-uaf-fix-fork-candidate.yaml"

permissions:
  contents: read

jobs:
  resource-stress:
    name: ASan/UBSan synthetic conntrack and queue stress without engine execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Checkout exact LuaJIT headers used by controlled candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openresty/luajit2
          ref: dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc
          fetch-depth: 1
          path: luajit
          persist-credentials: false

      - name: Verify exact source, harness and reviewed patches
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zapret2 rev-parse HEAD)" = "4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d"
          test "$(git -C zapret2 rev-parse HEAD^)" = "221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
          test "$(git -C zapret2 rev-parse 'HEAD^{tree}')" = "5c2a77786cc7089145abe2ca99bcc53a8ed7de15"
          test "$(git -C luajit rev-parse HEAD)" = "dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/harnesses/zapret2-r28/resource_stress_harness.c')" = "9cb70ace93bbda943495117123a2b5dcfbd30cd7"

          patch_dir="$PWD/netpilot/security/native-admission/patches/zapret2-r28"
          echo "af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff  $patch_dir/0001-explicit-conntrack-feed-result.patch" | sha256sum -c -
          echo "a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783  $patch_dir/0002-bounded-conntrack-resource-result.patch" | sha256sum -c -
          echo "33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68  $patch_dir/0003-bounded-delayed-queue-bytes.patch" | sha256sum -c -
          echo "f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777  $patch_dir/0004-explicit-daemon-stdio-redirection.patch" | sha256sum -c -
          echo "67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1  $patch_dir/0005-fail-closed-zero-conntrack-budget.patch" | sha256sum -c -
          echo "f5f3c01c73db3584513adc345da838bef6035c95a59762c469a386c7ad201d97  $patch_dir/0006-fail-closed-zero-delayed-queue-budget.patch" | sha256sum -c -

          for patch in \
            0001-explicit-conntrack-feed-result.patch \
            0002-bounded-conntrack-resource-result.patch \
            0003-bounded-delayed-queue-bytes.patch \
            0004-explicit-daemon-stdio-redirection.patch \
            0005-fail-closed-zero-conntrack-budget.patch \
            0006-fail-closed-zero-delayed-queue-budget.patch
          do
            git -C zapret2 apply --check "$patch_dir/$patch"
            git -C zapret2 apply "$patch_dir/$patch"
          done

          grep -Fq 'if (!q->max_bytes || new_queued_bytes > q->max_bytes) return NULL;' zapret2/nfq2/packet_queue.c

      - name: Install isolated harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential strace time libcap-dev

      - name: Strict-compile and link resource stress harness with ASan/UBSan
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch

          gcc \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 \
            -g \
            -fsanitize=address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections \
            -Wall -Wextra -Werror \
            -Izapret2/nfq2 \
            -Iluajit/src \
            -c netpilot/security/native-admission/harnesses/zapret2-r28/resource_stress_harness.c \
            -o scratch/resource_stress_harness.o \
            2>&1 | tee evidence/harness-compile.log

          gcc \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 \
            -g \
            -fsanitize=address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections \
            -Wall -Wextra \
            -Izapret2/nfq2 \
            -Iluajit/src \
            scratch/resource_stress_harness.o \
            zapret2/nfq2/conntrack.c \
            zapret2/nfq2/packet_queue.c \
            -Wl,--gc-sections \
            -o scratch/resource_stress_harness \
            2>&1 | tee evidence/link.log

          test -x scratch/resource_stress_harness

      - name: Run bounded synthetic resource stress
        id: stress
        continue-on-error: true
        if: steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          /usr/bin/time -v -o evidence/resource-usage.txt \
            timeout 60s ./scratch/resource_stress_harness \
            2>&1 | tee evidence/stress.log

          grep -Fxq 'resource_stress_harness: PASS' evidence/stress.log
          grep -Fq 'Maximum resident set size' evidence/resource-usage.txt

      - name: Verify stress harness performs no network syscalls
        id: no_network
        continue-on-error: true
        if: steps.stress.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=0:abort_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          strace -f -qq -e trace=network -o evidence/network-syscalls.log \
            timeout 60s ./scratch/resource_stress_harness >/dev/null 2>&1

          if grep -Eq 'socket\(|socketpair\(|connect\(|accept\(|accept4\(|bind\(|listen\(|sendto\(|recvfrom\(|sendmsg\(|recvmsg\(' evidence/network-syscalls.log; then
            cat evidence/network-syscalls.log
            exit 1
          fi

      - name: Produce text-only evidence and remove harness binaries
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          harness_sha256="$(sha256sum netpilot/security/native-admission/harnesses/zapret2-r28/resource_stress_harness.c | awk '{print $1}')"
          binary_sha256='not-produced'
          max_rss_kb='not-observed'
          if [ -f scratch/resource_stress_harness ]; then
            binary_sha256="$(sha256sum scratch/resource_stress_harness | awk '{print $1}')"
          fi
          if [ -f evidence/resource-usage.txt ]; then
            max_rss_kb="$(awk -F: '/Maximum resident set size/ {gsub(/^[ \t]+/, "", $2); print $2}' evidence/resource-usage.txt | tail -n1)"
          fi

          {
            echo 'schema_version=2'
            echo 'scope=isolated-synthetic-resource-stress'
            echo 'candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0006-proposed'
            echo 'source_commit=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d'
            echo 'source_tree=5c2a77786cc7089145abe2ca99bcc53a8ed7de15'
            echo 'luajit_headers_commit=dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc'
            echo 'patch_0006_sha256=f5f3c01c73db3584513adc345da838bef6035c95a59762c469a386c7ad201d97'
            echo 'harness_git_blob_sha1=9cb70ace93bbda943495117123a2b5dcfbd30cd7'
            echo "harness_sha256=$harness_sha256"
            echo "instrumented_harness_binary_sha256=$binary_sha256"
            echo "compile_outcome=$COMPILE_OUTCOME"
            echo "stress_outcome=$STRESS_OUTCOME"
            echo "no_network_syscalls_outcome=$NO_NETWORK_OUTCOME"
            echo "asan_instrumented_max_rss_kb=$max_rss_kb"
            echo 'conntrack_caps=64,512,2048'
            echo 'conntrack_overflow_attempts=equal-to-cap-per-level'
            echo 'packet_queue_packet_cap=64'
            echo 'packet_queue_full_size_bytes=96000'
            echo 'packet_queue_full_cycles=200'
            echo 'packet_queue_byte_cap=4096'
            echo 'packet_queue_byte_cap_cycles=500'
            echo 'production_budget_selected=false'
            echo 'candidate_engine_executed=false'
            echo 'windivert_present=false'
            echo 'driver_installed=false'
            echo 'network_interception_enabled=false'
          } > evidence/resource-stress.txt

          rm -f scratch/resource_stress_harness scratch/resource_stress_harness.o
          test ! -e scratch/resource_stress_harness
          test ! -e scratch/resource_stress_harness.o
          sha256sum evidence/* | sort > evidence/SHA256SUMS-resource-stress.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-resource-stress-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce synthetic resource stress gate
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          STRESS_OUTCOME: ${{ steps.stress.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          test "$COMPILE_OUTCOME" = 'success'
          test "$STRESS_OUTCOME" = 'success'
          test "$NO_NETWORK_OUTCOME" = 'success'
