name: R42.11.1 ByeDPI Verified Atomic Promotion Preflight Once

on:
  push:
    branches:
      - feature/byedpi-verified-promotion-r42-11-1
    paths:
      - 'src/NetPilot.Platform.Windows/WindowsByeDpiVerifiedStagingPromoter.cs'
      - 'tests/NetPilot.Platform.Windows.Tests/WindowsByeDpiVerifiedStagingPromoterTests.cs'
      - 'security/native-admission/byedpi-verified-promotion-r42-11-1.yaml'
      - 'scripts/security/r42-11-1-byedpi-verified-promotion-check.sh'
      - 'docs/BYEDPI-VERIFIED-PROMOTION-R42-11-1.md'
      - '.github/workflows/r42-11-1-verified-promotion-preflight-once.yml'
  pull_request:
    branches:
      - feature/byedpi-verified-staging-r42-11
    paths:
      - 'src/NetPilot.Platform.Windows/WindowsByeDpiVerifiedStagingPromoter.cs'
      - 'tests/NetPilot.Platform.Windows.Tests/WindowsByeDpiVerifiedStagingPromoterTests.cs'
      - 'security/native-admission/byedpi-verified-promotion-r42-11-1.yaml'
      - 'scripts/security/r42-11-1-byedpi-verified-promotion-check.sh'
      - 'docs/BYEDPI-VERIFIED-PROMOTION-R42-11-1.md'
      - '.github/workflows/r42-11-1-verified-promotion-preflight-once.yml'

permissions:
  contents: read

jobs:
  managed-boundary:
    name: Enforce verified staging to atomic promotion boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: R42.11 parent fail-closed guard
        run: bash scripts/security/r42-11-byedpi-verified-staging-check.sh

      - name: R42.11.1 fail-closed verified promotion guard
        run: bash scripts/security/r42-11-1-byedpi-verified-promotion-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore NetPilot.sln

      - name: Build full solution
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Boundary marker
        run: |
          cat r42-11-1-verified-promotion-guard-evidence.txt
          echo 'R42_11_1_VERIFIED_PROMOTION=EXISTING_R42_3_BOUNDARY_ONLY'
          echo 'R42_11_1_SERVICE_IPC_WIRING=ABSENT'
          echo 'R42_11_1_NATIVE_EXECUTION=NOT_IMPLEMENTED'
          echo 'R42_11_1_PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R42_11_1_MANAGED_BOUNDARY_PASS_BLOCK'

      - name: Upload text-only R42.11.1 guard evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byedpi-r42-11-1-verified-promotion-evidence
          path: r42-11-1-verified-promotion-guard-evidence.txt
          if-no-files-found: error
          retention-days: 14

  windows-promotion-integration:
    name: Verify synthetic download staging atomic-promotion chain
    runs-on: windows-2022
    timeout-minutes: 20
    needs: managed-boundary

    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore NetPilot.sln

      - name: Build Windows platform tests
        run: >-
          dotnet build tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj
          --configuration Release
          --no-restore

      - name: Run focused R42.11.1 and inherited staging/promotion tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~WindowsByeDpiVerifiedStagingPromoterTests|FullyQualifiedName~WindowsByeDpiVerifiedBundleStagerTests|FullyQualifiedName~WindowsByeDpiAtomicPackagePromotionTests|FullyQualifiedName~WindowsByeDpiProtectedStagingTransactionTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) {
            throw 'R42.11.1 unexpectedly launched ciadpi.'
          }
          Write-Host 'R42_11_1_SYNTHETIC_WINDOWS_PROMOTION=PASS'
          Write-Host 'R42_11_1_NATIVE_EXECUTION=NOT_PERFORMED'
          Write-Host 'R42_11_1_PRODUCTION_ADMISSION=BLOCK'
