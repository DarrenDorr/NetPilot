name: Native Candidate Protocol Parser Fuzz

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-protocol-parser-fuzz.yml"
      - "security/native-admission/harnesses/zapret2-r28/protocol_parser_fuzz_harness.c"
      - "security/native-admission/patches/zapret2-r28/**"
      - "security/native-admission/zapret2-v1.0.6-plus-uaf-fix-fork-candidate.yaml"
      - "docs/ZAPRET2-*.md"

permissions:
  contents: read

jobs:
  parser-fuzz:
    name: Coverage-guided parser fuzzing without engine execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Checkout exact LuaJIT headers used by controlled candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openresty/luajit2
          ref: dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc
          fetch-depth: 1
          path: luajit
          persist-credentials: false

      - name: Verify exact source and patch identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zapret2 rev-parse HEAD)" = "4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d"
          test "$(git -C zapret2 rev-parse HEAD^)" = "221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
          test "$(git -C zapret2 rev-parse 'HEAD^{tree}')" = "5c2a77786cc7089145abe2ca99bcc53a8ed7de15"
          test "$(git -C luajit rev-parse HEAD)" = "dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc"
          test "$(git -C netpilot rev-parse 'HEAD:security/native-admission/harnesses/zapret2-r28/protocol_parser_fuzz_harness.c')" = "7922070196a441e04506c6edc39de226bdd917f4"

          # Critical crypto sources used only to satisfy retained protocol.c sections
          # are pinned by the exact zapret2 source tree and additionally checked here.
          test "$(git -C zapret2 rev-parse 'HEAD:nfq2/crypto/aes.c')" = "49cd313ebb12513a0a4f5f5eb2d237ab57fb6db8"
          test "$(git -C zapret2 rev-parse 'HEAD:nfq2/crypto/aes-ctr.c')" = "f046c01b7c467cbf226b52ab791c530f81338116"
          test "$(git -C zapret2 rev-parse 'HEAD:nfq2/crypto/aes-gcm.c')" = "7dffa42c2ee71a18b5ba7d8e76c07b960935f11a"
          test "$(git -C zapret2 rev-parse 'HEAD:nfq2/crypto/gcm.c')" = "398b77c4ee1580355f0e28014d6a80d5fe485e64"
          test "$(git -C zapret2 rev-parse 'HEAD:nfq2/crypto/hkdf.c')" = "b62f6823775479b6bf39e674e8c129a09391e56b"
          test "$(git -C zapret2 rev-parse 'HEAD:nfq2/crypto/hmac.c')" = "6995da4d8d22f00c9f68f24f8ebc0b13b7103b10"

          patch_dir="$PWD/netpilot/security/native-admission/patches/zapret2-r28"
          echo "af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff  $patch_dir/0001-explicit-conntrack-feed-result.patch" | sha256sum -c -
          echo "a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783  $patch_dir/0002-bounded-conntrack-resource-result.patch" | sha256sum -c -
          echo "33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68  $patch_dir/0003-bounded-delayed-queue-bytes.patch" | sha256sum -c -
          echo "f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777  $patch_dir/0004-explicit-daemon-stdio-redirection.patch" | sha256sum -c -
          echo "67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1  $patch_dir/0005-fail-closed-zero-conntrack-budget.patch" | sha256sum -c -

          for patch in \
            0001-explicit-conntrack-feed-result.patch \
            0002-bounded-conntrack-resource-result.patch \
            0003-bounded-delayed-queue-bytes.patch \
            0004-explicit-daemon-stdio-redirection.patch \
            0005-fail-closed-zero-conntrack-budget.patch
          do
            git -C zapret2 apply --check "$patch_dir/$patch"
            git -C zapret2 apply "$patch_dir/$patch"
          done

      - name: Install isolated fuzzing dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang strace libcap-dev

      - name: Strict-compile NetPilot fuzz target
        id: harness_compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch/crashes corpus
          clang \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 -g \
            -fsanitize=fuzzer-no-link,address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections \
            -Wall -Wextra -Werror \
            -Izapret2/nfq2 \
            -Iluajit/src \
            -c netpilot/security/native-admission/harnesses/zapret2-r28/protocol_parser_fuzz_harness.c \
            -o scratch/protocol_parser_fuzz_harness.o \
            2>&1 | tee evidence/harness-compile.log
          test -f scratch/protocol_parser_fuzz_harness.o

      - name: Link parser fuzz target with libFuzzer ASan UBSan
        id: compile
        if: steps.harness_compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          clang \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 -g \
            -fsanitize=fuzzer,address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -ffunction-sections -fdata-sections \
            -Wall -Wextra \
            -Izapret2/nfq2 \
            -Iluajit/src \
            scratch/protocol_parser_fuzz_harness.o \
            zapret2/nfq2/protocol.c \
            zapret2/nfq2/helpers.c \
            zapret2/nfq2/crypto/*.c \
            -Wl,--gc-sections \
            -o scratch/protocol_parser_fuzzer \
            2>&1 | tee evidence/compile.log
          test -x scratch/protocol_parser_fuzzer

      - name: Create controlled seed corpus
        if: steps.harness_compile.outcome == 'success' && steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          # 72-byte TLS ClientHello with SNI example.com; same structural seed as the deterministic sanitizer gate.
          tls = bytes([
              0x16,0x03,0x01,0x00,0x43,
              0x01,0x00,0x00,0x3f,0x03,0x03,
              *([0x00] * 32),
              0x00,
              0x00,0x02,0x13,0x01,
              0x01,0x00,
              0x00,0x14,
              0x00,0x00,0x00,0x10,
              0x00,0x0e,0x00,0x00,0x0b,
              *b'example.com'
          ])
          assert len(tls) == 72
          Path('corpus/tls-clienthello.bin').write_bytes(tls)
          Path('corpus/http-request.bin').write_bytes(b'GET / HTTP/1.1\r\nHost: example.com\r\n\r\n')
          Path('corpus/empty.bin').write_bytes(b'')
          PY
          sha256sum corpus/* | sort > evidence/seed-corpus-sha256.txt

      - name: Run bounded coverage-guided fuzzing
        id: fuzz
        if: steps.harness_compile.outcome == 'success' && steps.compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          ./scratch/protocol_parser_fuzzer corpus \
            -runs=25000 \
            -seed=1337 \
            -max_len=2048 \
            -timeout=5 \
            -print_final_stats=1 \
            -artifact_prefix=scratch/crashes/ \
            2>&1 | tee evidence/fuzz.log

      - name: Verify fuzz target performs no network syscalls
        id: no_network
        if: steps.harness_compile.outcome == 'success' && steps.compile.outcome == 'success' && steps.fuzz.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=0:abort_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          strace -f -qq -e trace=network -o evidence/network-syscalls.log \
            ./scratch/protocol_parser_fuzzer corpus \
              -runs=1000 -seed=7331 -max_len=512 -verbosity=0 \
              >/dev/null 2>&1

          if grep -Eq 'socket\(|socketpair\(|connect\(|accept\(|accept4\(|bind\(|listen\(|sendto\(|recvfrom\(|sendmsg\(|recvmsg\(' evidence/network-syscalls.log; then
            cat evidence/network-syscalls.log
            exit 1
          fi

      - name: Produce text-only evidence and remove fuzz binaries
        if: always()
        shell: bash
        env:
          HARNESS_COMPILE_OUTCOME: ${{ steps.harness_compile.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          harness_sha256="$(sha256sum netpilot/security/native-admission/harnesses/zapret2-r28/protocol_parser_fuzz_harness.c | awk '{print $1}')"
          crash_count="$(find scratch/crashes -type f 2>/dev/null | wc -l | tr -d ' ')"

          if [ "$crash_count" -gt 0 ]; then
            : > evidence/crash-inputs-hex.txt
            for f in scratch/crashes/*; do
              [ -f "$f" ] || continue
              printf 'file_sha256=%s\n' "$(sha256sum "$f" | awk '{print $1}')" >> evidence/crash-inputs-hex.txt
              od -An -tx1 -v "$f" | tr -d ' \n' >> evidence/crash-inputs-hex.txt
              printf '\n' >> evidence/crash-inputs-hex.txt
            done
          fi

          {
            echo 'schema_version=2'
            echo 'scope=coverage-guided-protocol-parser-fuzzing'
            echo 'candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0005'
            echo 'source_commit=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d'
            echo 'source_tree=5c2a77786cc7089145abe2ca99bcc53a8ed7de15'
            echo 'luajit_headers_commit=dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc'
            echo 'link_dependency_scope=exact-source-tree-protocol-helpers-all-crypto-plus-abort-on-use-log-stubs'
            echo 'logging_stub_policy=abort-if-reached'
            echo "compiler=$(clang --version | head -n1)"
            echo "harness_sha256=$harness_sha256"
            echo 'sanitizers=libFuzzer,ASan,UBSan'
            echo 'runs=25000'
            echo 'seed=1337'
            echo 'max_len=2048'
            echo 'controlled_seed_corpus=tls-clienthello,http-request,empty'
            echo "harness_compile_outcome=$HARNESS_COMPILE_OUTCOME"
            echo "fuzzer_link_outcome=$COMPILE_OUTCOME"
            echo "fuzz_outcome=$FUZZ_OUTCOME"
            echo "no_network_syscalls_outcome=$NO_NETWORK_OUTCOME"
            echo "crash_artifact_count=$crash_count"
            echo 'candidate_engine_executed=false'
            echo 'windivert_present=false'
            echo 'driver_installed=false'
            echo 'network_interception_enabled=false'
            echo 'admission_effect=NONE'
            echo 'release_gate=BLOCK'
          } > evidence/protocol-parser-fuzz.txt

          rm -rf scratch corpus
          sha256sum evidence/* | sort > evidence/SHA256SUMS-protocol-parser-fuzz.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-protocol-parser-fuzz-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce fuzz gate after evidence upload
        if: always()
        shell: bash
        env:
          HARNESS_COMPILE_OUTCOME: ${{ steps.harness_compile.outcome }}
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          FUZZ_OUTCOME: ${{ steps.fuzz.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          test "$HARNESS_COMPILE_OUTCOME" = 'success'
          test "$COMPILE_OUTCOME" = 'success'
          test "$FUZZ_OUTCOME" = 'success'
          test "$NO_NETWORK_OUTCOME" = 'success'
