name: Native Candidate Delayed Queue Zero Budget

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-delayed-queue-zero-budget.yml"
      - "security/native-admission/harnesses/zapret2-r28/delayed_queue_zero_budget_harness.c"
      - "security/native-admission/patches/zapret2-r28/0006-fail-closed-zero-delayed-queue-budget.patch"
      - "security/native-admission/patches/zapret2-r28/0001-explicit-conntrack-feed-result.patch"
      - "security/native-admission/patches/zapret2-r28/0002-bounded-conntrack-resource-result.patch"
      - "security/native-admission/patches/zapret2-r28/0003-bounded-delayed-queue-bytes.patch"
      - "security/native-admission/patches/zapret2-r28/0004-explicit-daemon-stdio-redirection.patch"
      - "security/native-admission/patches/zapret2-r28/0005-fail-closed-zero-conntrack-budget.patch"
      - "docs/ZAPRET2-DELAYED-QUEUE-ZERO-BUDGET-R28.9.md"

permissions:
  contents: read

jobs:
  delayed-queue-zero-budget:
    name: ASan/UBSan zero-budget regression without engine execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Verify exact source, harness and proposed patch identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zapret2 rev-parse HEAD)" = "4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d"
          test "$(git -C zapret2 rev-parse HEAD^)" = "221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
          test "$(git -C zapret2 rev-parse 'HEAD^{tree}')" = "5c2a77786cc7089145abe2ca99bcc53a8ed7de15"

          patch_dir="$PWD/netpilot/security/native-admission/patches/zapret2-r28"
          harness="$PWD/netpilot/security/native-admission/harnesses/zapret2-r28/delayed_queue_zero_budget_harness.c"

          test "$(git -C netpilot hash-object security/native-admission/harnesses/zapret2-r28/delayed_queue_zero_budget_harness.c)" = "ad6d58d22b7174a27eaf558d6598aaec560ab8bf"
          test "$(git -C netpilot hash-object security/native-admission/patches/zapret2-r28/0006-fail-closed-zero-delayed-queue-budget.patch)" = "2a5165f5b562635dace89ae5069bdb791b69668c"

          echo "af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff  $patch_dir/0001-explicit-conntrack-feed-result.patch" | sha256sum -c -
          echo "a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783  $patch_dir/0002-bounded-conntrack-resource-result.patch" | sha256sum -c -
          echo "33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68  $patch_dir/0003-bounded-delayed-queue-bytes.patch" | sha256sum -c -
          echo "f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777  $patch_dir/0004-explicit-daemon-stdio-redirection.patch" | sha256sum -c -
          echo "67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1  $patch_dir/0005-fail-closed-zero-conntrack-budget.patch" | sha256sum -c -
          echo "a507b5619beccd27c1dd06576c203d2badb8857655192649c8ae455299701ccb  $patch_dir/0006-fail-closed-zero-delayed-queue-budget.patch" | sha256sum -c -

          for patch in \
            0001-explicit-conntrack-feed-result.patch \
            0002-bounded-conntrack-resource-result.patch \
            0003-bounded-delayed-queue-bytes.patch \
            0004-explicit-daemon-stdio-redirection.patch \
            0005-fail-closed-zero-conntrack-budget.patch \
            0006-fail-closed-zero-delayed-queue-budget.patch
          do
            git -C zapret2 apply --check "$patch_dir/$patch"
            git -C zapret2 apply "$patch_dir/$patch"
          done

          grep -Fq 'if (!q->max_bytes || new_queued_bytes > q->max_bytes) return NULL;' zapret2/nfq2/packet_queue.c
          grep -Fq 'zero/unconfigured byte budget must reject delayed packet state' "$harness"

      - name: Install isolated harness dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential strace

      - name: Compile zero-budget harness with ASan and UBSan
        id: compile
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch
          gcc \
            -D_DEFAULT_SOURCE \
            -std=c11 \
            -O1 \
            -g \
            -fsanitize=address,undefined \
            -fno-sanitize-recover=all \
            -fno-omit-frame-pointer \
            -Wall -Wextra -Werror \
            -Izapret2/nfq2 \
            netpilot/security/native-admission/harnesses/zapret2-r28/delayed_queue_zero_budget_harness.c \
            zapret2/nfq2/packet_queue.c \
            -o scratch/delayed_queue_zero_budget_harness \
            2>&1 | tee evidence/compile.log
          test -x scratch/delayed_queue_zero_budget_harness

      - name: Run zero-budget fail-closed regression
        id: regression
        if: steps.compile.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=1:abort_on_error=1:strict_string_checks=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          timeout 20s ./scratch/delayed_queue_zero_budget_harness \
            2>&1 | tee evidence/regression.log
          grep -Fxq 'delayed_queue_zero_budget_harness: PASS' evidence/regression.log

      - name: Verify harness performs no network syscalls
        id: no_network
        if: steps.compile.outcome == 'success' && steps.regression.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          ASAN_OPTIONS='detect_leaks=0:abort_on_error=1' \
          UBSAN_OPTIONS='halt_on_error=1:print_stacktrace=1' \
          strace -f -qq -e trace=network -o evidence/network-syscalls.log \
            ./scratch/delayed_queue_zero_budget_harness >/dev/null 2>&1

          if grep -Eq 'socket\(|socketpair\(|connect\(|accept\(|accept4\(|bind\(|listen\(|sendto\(|recvfrom\(|sendmsg\(|recvmsg\(' evidence/network-syscalls.log; then
            cat evidence/network-syscalls.log
            exit 1
          fi

      - name: Produce text-only evidence and remove harness binary
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence

          harness_sha256="$(sha256sum netpilot/security/native-admission/harnesses/zapret2-r28/delayed_queue_zero_budget_harness.c | awk '{print $1}')"
          binary_sha256="not-produced"
          if [ -f scratch/delayed_queue_zero_budget_harness ]; then
            binary_sha256="$(sha256sum scratch/delayed_queue_zero_budget_harness | awk '{print $1}')"
          fi

          {
            echo 'schema_version=1'
            echo 'scope=isolated-delayed-queue-zero-budget-regression'
            echo 'candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0006-proposed'
            echo 'source_commit=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d'
            echo 'source_tree=5c2a77786cc7089145abe2ca99bcc53a8ed7de15'
            echo 'patch_0006_sha256=a507b5619beccd27c1dd06576c203d2badb8857655192649c8ae455299701ccb'
            echo "harness_sha256=$harness_sha256"
            echo "instrumented_harness_binary_sha256=$binary_sha256"
            echo "compile_outcome=$COMPILE_OUTCOME"
            echo "regression_outcome=$REGRESSION_OUTCOME"
            echo "no_network_syscalls_outcome=$NO_NETWORK_OUTCOME"
            echo 'zero_budget_semantics=reject_delayed_packet_state'
            echo 'positive_budget_semantics=admit_only_within_configured_bytes'
            echo 'candidate_engine_executed=false'
            echo 'windivert_present=false'
            echo 'driver_installed=false'
            echo 'network_interception_enabled=false'
          } > evidence/delayed-queue-zero-budget-regression.txt

          rm -f scratch/delayed_queue_zero_budget_harness
          test ! -e scratch/delayed_queue_zero_budget_harness
          sha256sum evidence/* | sort > evidence/SHA256SUMS-delayed-queue-zero-budget.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-delayed-queue-zero-budget-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce dedicated gate success after evidence upload
        if: always()
        shell: bash
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
          REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          NO_NETWORK_OUTCOME: ${{ steps.no_network.outcome }}
        run: |
          set -euo pipefail
          test "$COMPILE_OUTCOME" = 'success'
          test "$REGRESSION_OUTCOME" = 'success'
          test "$NO_NETWORK_OUTCOME" = 'success'
