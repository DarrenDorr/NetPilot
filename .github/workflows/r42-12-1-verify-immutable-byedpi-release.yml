name: R42.12.1 Verify Published Immutable ByeDPI Release

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: byedpi-v0.17.3
  PAYLOAD_NAME: NetPilot-ByeDPI-0.17.3-x64.zip
  PAYLOAD_SIZE: '496964'
  PAYLOAD_SHA256: c0fe998e3d81ccb871f09d126e7b5ee0ab82d15daf78bc44bcd63b7762313db7
  MANIFEST_NAME: NetPilot-ByeDPI-0.17.3-x64.manifest.json
  MANIFEST_SIZE: '511'
  MANIFEST_SHA256: eaa6f063fcb8e012810f849ed08b6bd82d4d046d4796c2fb4b903c4195985f54
  PROVENANCE_NAME: NetPilot-ByeDPI-0.17.3-x64.provenance.json
  PROVENANCE_SIZE: '1726'
  PROVENANCE_SHA256: e1f98760eed94f5daa7d37a868015755220cb17d389000bc49e031da511f7f31

jobs:
  verify-published-immutable-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Verify exact published immutable release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence release-assets
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"

          test "$(jq -r '.tag_name' <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r '.draft' <<<"$release_json")" = 'false'
          test "$(jq -r '.prerelease' <<<"$release_json")" = 'false'
          test "$(jq -r '.immutable' <<<"$release_json")" = 'true'
          test "$(jq '.assets | length' <<<"$release_json")" -eq 3

          validate_asset() {
            local name="$1"
            local size="$2"
            local hash="$3"
            local count
            count="$(jq --arg name "$name" '[.assets[] | select(.name == $name)] | length' <<<"$release_json")"
            test "$count" -eq 1
            test "$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .state' <<<"$release_json")" = 'uploaded'
            test "$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .size' <<<"$release_json")" = "$size"
            test "$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .digest' <<<"$release_json")" = "sha256:$hash"
          }

          validate_asset "$PAYLOAD_NAME" "$PAYLOAD_SIZE" "$PAYLOAD_SHA256"
          validate_asset "$MANIFEST_NAME" "$MANIFEST_SIZE" "$MANIFEST_SHA256"
          validate_asset "$PROVENANCE_NAME" "$PROVENANCE_SIZE" "$PROVENANCE_SHA256"

          jq '{id,tag_name,draft,prerelease,immutable,target_commitish,assets:[.assets[]|{id,name,state,size,digest,url}]}' \
            <<<"$release_json" > evidence/release-metadata.json

      - name: Download and hash all exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern "$PAYLOAD_NAME" \
            --pattern "$MANIFEST_NAME" \
            --pattern "$PROVENANCE_NAME"

          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          test "$(wc -c < "release-assets/$PAYLOAD_NAME")" -eq "$PAYLOAD_SIZE"
          test "$(sha256sum "release-assets/$PAYLOAD_NAME" | awk '{print $1}')" = "$PAYLOAD_SHA256"
          test "$(wc -c < "release-assets/$MANIFEST_NAME")" -eq "$MANIFEST_SIZE"
          test "$(sha256sum "release-assets/$MANIFEST_NAME" | awk '{print $1}')" = "$MANIFEST_SHA256"
          test "$(wc -c < "release-assets/$PROVENANCE_NAME")" -eq "$PROVENANCE_SIZE"
          test "$(sha256sum "release-assets/$PROVENANCE_NAME" | awk '{print $1}')" = "$PROVENANCE_SHA256"

          sha256sum release-assets/* | sort | tee evidence/downloaded-assets.sha256
          wc -c release-assets/* | tee evidence/downloaded-assets.sizes

      - name: Verify GitHub immutable release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release verify "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" | tee evidence/immutable-release-verification.txt
          echo 'R42_12_1_RELEASE_IMMUTABLE=true' | tee evidence/result.txt
          echo 'R42_12_1_EXACT_ASSETS_VERIFIED=true' | tee -a evidence/result.txt
          echo 'R42_12_1_NATIVE_EXECUTION=NOT_PERFORMED' | tee -a evidence/result.txt
          echo 'R42_12_1_PRODUCTION_ADMISSION=BLOCK' | tee -a evidence/result.txt

      - name: Upload text-only immutable release verification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byedpi-r42-12-1-immutable-release-verification
          path: evidence/*
          if-no-files-found: error
          retention-days: 30
