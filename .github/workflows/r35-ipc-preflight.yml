name: R35 ByeDPI IPC and Lease Preflight

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r35-ipc-preflight.yml'

permissions:
  contents: read

concurrency:
  group: netpilot-r35-ipc-preflight
  cancel-in-progress: false

env:
  NETPILOT_R35_SHA: 32e6780b7d87ef598d86af252e32c5cfa6e138c1

jobs:
  linux-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R35_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkpoint
        run: test "$(git rev-parse HEAD)" = "$NETPILOT_R35_SHA"
      - name: Security gates
        run: |
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh
          bash scripts/security/r35-service-integration-boundary-check.sh
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build solution
        run: |
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore
      - name: Core and IPC tests
        run: dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build

  windows-service-ipc:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R35_SHA }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify checkpoint
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R35_SHA) { throw 'R35 checkpoint drift.' }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore src\NetPilot.Service\NetPilot.Service.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore src\NetPilot.App.Windows\NetPilot.App.Windows.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build service and GUI
        shell: pwsh
        run: |
          dotnet build src\NetPilot.Service\NetPilot.Service.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build src\NetPilot.App.Windows\NetPilot.App.Windows.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Windows tests
        run: dotnet test tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj --configuration Release
      - name: Evidence boundary
        shell: pwsh
        run: |
          Write-Host 'R35 IPC preflight validates protocol, service composition and tests only.'
          Write-Host 'ByeDPI native execution: NOT PERFORMED.'
          Write-Host 'Production runtime admission: BLOCK.'
