name: ByeDPI User Smoke Preflight

on:
  push:
    branches: [ feature/byedpi-real-profile-ui-r2 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - name: Global security policy
        shell: bash
        run: bash scripts/security-policy-check.sh
      - name: Runtime admission policy
        shell: bash
        run: bash scripts/runtime-admission-policy-check.sh
      - name: R42.9 isolated HTTP boundary
        shell: bash
        run: bash scripts/security/r42-9-byedpi-isolated-http-check.sh
      - name: Build default solution
        shell: pwsh
        run: dotnet build NetPilot.sln --configuration Release
      - name: Test typed ByeDPI user-smoke contract
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/test-results | Out-Null
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~EngineShortArgumentTokenContractsTests|FullyQualifiedName~ByeDpiWindowsUserSmokeContractTests" `
            --logger "console;verbosity=detailed" `
            --logger "trx;LogFileName=byedpi-user-smoke.trx" `
            --results-directory artifacts/test-results
      - name: Upload focused test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: byedpi-user-smoke-test-results
          path: artifacts/test-results
          if-no-files-found: warn
          retention-days: 3
      - name: Build experimental Windows UI and SOCKS diagnostics
        shell: pwsh
        run: |
          dotnet publish src/NetPilot.App.Windows/NetPilot.App.Windows.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output artifacts/preflight-app `
            -p:NetPilotExperimentalByeDpi=true `
            -p:Version=0.1.0 `
            -p:FileVersion=0.1.0.0 `
            -p:AssemblyVersion=0.1.0.0 `
            -p:InformationalVersion=0.1.0-alpha-byedpi3
      - name: Boundary marker
        shell: pwsh
        run: |
          Write-Host 'DEFAULT_PRODUCT_FAIL_CLOSED=true'
          Write-Host 'EXPERIMENTAL_BYEDPI_UI=true'
          Write-Host 'BYPASS_PROFILE=BYEDPI_SPLIT_1S_DISORDER_3S'
          Write-Host 'SOCKS_ENDPOINT=127.0.0.1:39036'
          Write-Host 'SYSTEM_PROXY_MUTATION=false'
          Write-Host 'WINDIVERT_EXECUTION=false'
          Write-Host 'ZAPRET2_EXECUTION=false'
          Write-Host 'PRODUCTION_ADMISSION=BLOCK'
