name: R39 Real Service Restart Reconciliation Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r39-restart-runtime-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: netpilot-r39-restart-runtime-once
  cancel-in-progress: false

env:
  NETPILOT_R39_SHA: 99b0ef2feb4a9276a1b06420a5df53f95fc599b8
  SOURCE_RUN_ID: '41006065721'
  BYEDPI_WINDOWS_SHA256: 866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd
  PACKAGE_VERSION: 0.17.3-netpilot-r34-lab
  SERVICE_NAME: NetPilot.R39.Lab
  PROXY_PORT: '39036'
  SECOND_USER_NAME: NetPilotR39B

jobs:
  restart-reconciliation:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact R39 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R39_SHA }}
          path: netpilot
          persist-credentials: false
          fetch-depth: 1

      - name: Download exact reviewed ByeDPI candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: r36-byedpi-candidate-transfer
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify exact clean boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C netpilot rev-parse HEAD).Trim() -ne $env:NETPILOT_R39_SHA) { throw 'R39 checkpoint drift.' }
          $candidate = Resolve-Path 'candidate\ciadpi.exe'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'R39 candidate hash drift.' }

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'R39 requires an administrative hosted Windows runner.' }
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) { throw 'R39 primary client is not in an interactive session.' }

          foreach ($service in @('NetPilot.Service','NetPilot.R36.Lab','NetPilot.R37.Lab','NetPilot.R38.Lab',$env:SERVICE_NAME)) {
            if (Get-Service -Name $service -ErrorAction SilentlyContinue) { throw "Refusing pre-existing Windows service: $service" }
          }
          if (Get-LocalUser -Name $env:SECOND_USER_NAME -ErrorAction SilentlyContinue) { throw 'Refusing pre-existing R39 temporary local user.' }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $root) { throw "Refusing pre-existing NetPilot root: $root" }

          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "NETPILOT_R39_SHA=$env:NETPILOT_R39_SHA" | Set-Content evidence\r39-restart.txt
          "BYEDPI_WINDOWS_SHA256=$actual" | Add-Content evidence\r39-restart.txt
          "PRIMARY_SESSION_ID=$sessionId" | Add-Content evidence\r39-restart.txt
          'PRODUCTION_ADMISSION=BLOCK' | Add-Content evidence\r39-restart.txt

      - name: Publish hardened service and clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\owner-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish netpilot\tools\NetPilot.ByeDpiR39RestartClient\NetPilot.ByeDpiR39RestartClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\restart-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage protected service, clients and exact engine package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $serviceDir = Join-Path $root 'Lab\R39Service'
          $ownerClientDir = Join-Path $root 'Lab\R39OwnerClient'
          $restartClientDir = Join-Path $root 'Lab\R39RestartClient'
          $engineBin = Join-Path $root "Engines\Managed\byedpi\$env:PACKAGE_VERSION\x64\bin"
          $config = Join-Path $root 'Config'
          $users = Join-Path $root 'Users'
          New-Item -ItemType Directory -Force -Path $serviceDir,$ownerClientDir,$restartClientDir,$engineBin,$config,$users | Out-Null
          Set-Content -LiteralPath (Join-Path $root '.r39-hosted-owned') -Value $env:NETPILOT_R39_SHA -NoNewline
          Copy-Item -Path 'publish\service\*' -Destination $serviceDir -Recurse
          Copy-Item -Path 'publish\owner-client\*' -Destination $ownerClientDir -Recurse
          Copy-Item -Path 'publish\restart-client\*' -Destination $restartClientDir -Recurse
          Copy-Item -LiteralPath 'candidate\ciadpi.exe' -Destination (Join-Path $engineBin 'ciadpi.exe')
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          Set-Content -LiteralPath (Join-Path $config 'enrollment.session') -Value $sessionId -NoNewline

          & icacls.exe $root /inheritance:r | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to protect R39 root inheritance.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set R39 root ACL.' }
          & icacls.exe $root /setowner '*S-1-5-32-544' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set privileged R39 owner.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize R39 tree ACL.' }

          $staged = Join-Path $engineBin 'ciadpi.exe'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $staged).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'Staged R39 candidate hash drift.' }
          'PROTECTED_PROGRAM_FILES_TREE=True' | Add-Content evidence\r39-restart.txt

      - name: Register and start hardened LocalSystem lab service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceExe = Join-Path $env:ProgramFiles 'NetPilot\Lab\R39Service\NetPilot.ByeDpiR36ServiceLab.exe'
          $binaryPathName = '"' + $serviceExe + '"'
          New-Service -Name $env:SERVICE_NAME -BinaryPathName $binaryPathName -DisplayName 'NetPilot R39 Restart Lab' -StartupType Manual | Out-Null
          $svc = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($null -eq $svc -or $svc.StartName -ne 'LocalSystem') { throw 'R39 service is not LocalSystem.' }
          Start-Service -Name $env:SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $status = (Get-Service -Name $env:SERVICE_NAME).Status
            if ($status -eq 'Running') { break }
          } while ((Get-Date) -lt $deadline)
          if ($status -ne 'Running') { throw 'R39 LocalSystem service failed to start.' }
          'LOCALSYSTEM_SERVICE_RUNNING=True' | Add-Content evidence\r39-restart.txt

      - name: Primary user enrolls and starts original engine session
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ownerClient = Join-Path $env:ProgramFiles 'NetPilot\Lab\R39OwnerClient\NetPilot.ByeDpiR36LabClient.exe'
          & $ownerClient --start-for-service-stop 2>&1 | Tee-Object -FilePath evidence\r39-original-owner-start.txt
          if ($LASTEXITCODE -ne 0) { throw 'R39 original owner failed to start engine.' }
          $content = Get-Content evidence\r39-original-owner-start.txt -Raw
          foreach ($marker in @('AUTHENTICATED_IPC=PASS','IPC_START=PASS','START_FOR_SERVICE_STOP=PASS','RESULT=R36_START_FOR_SERVICE_STOP_PASS')) {
            if (-not $content.Contains($marker,[StringComparison]::Ordinal)) { throw "Missing original-owner marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 1) { throw 'R39 expected exactly one original ciadpi.exe.' }
          if (@(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:PROXY_PORT) -ErrorAction SilentlyContinue).Count -ne 1) { throw 'R39 expected original loopback listener.' }
          'ORIGINAL_OWNER_ENGINE_RUNNING=PASS' | Add-Content evidence\r39-restart.txt

      - name: Abruptly terminate service and prove old engine containment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $svc = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($null -eq $svc -or $svc.State -ne 'Running' -or [int]$svc.ProcessId -le 0) { throw 'R39 service process identity unavailable before crash.' }
          $servicePid = [int]$svc.ProcessId
          $serviceExe = [IO.Path]::GetFullPath((Join-Path $env:ProgramFiles 'NetPilot\Lab\R39Service\NetPilot.ByeDpiR36ServiceLab.exe'))
          $actualPath = [IO.Path]::GetFullPath((Get-Process -Id $servicePid).Path)
          if (-not [string]::Equals($actualPath,$serviceExe,[StringComparison]::OrdinalIgnoreCase)) { throw 'R39 service PID path mismatch.' }

          Stop-Process -Id $servicePid -Force
          $deadline = (Get-Date).AddSeconds(15)
          do {
            Start-Sleep -Milliseconds 200
            $serviceStopped = (Get-Service -Name $env:SERVICE_NAME).Status -eq 'Stopped'
            $engineGone = @(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -eq 0
            $listenerGone = @(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:PROXY_PORT) -ErrorAction SilentlyContinue).Count -eq 0
            if ($serviceStopped -and $engineGone -and $listenerGone) { break }
          } while ((Get-Date) -lt $deadline)

          if (-not $serviceStopped) { throw 'R39 crashed service did not reach Stopped.' }
          if (-not $engineGone) { throw 'R39 crash left residual ciadpi.exe.' }
          if (-not $listenerGone) { throw 'R39 crash left residual loopback listener.' }
          'ABRUPT_SERVICE_TERMINATION=PASS' | Add-Content evidence\r39-restart.txt
          'OLD_ENGINE_KILLED_ON_SERVICE_CLOSE=PASS' | Add-Content evidence\r39-restart.txt
          'OLD_LISTENER_CLEANUP=PASS' | Add-Content evidence\r39-restart.txt

      - name: Restart service and require reconciled Stopped state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Service -Name $env:SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $status = (Get-Service -Name $env:SERVICE_NAME).Status
            if ($status -eq 'Running') { break }
          } while ((Get-Date) -lt $deadline)
          if ($status -ne 'Running') { throw 'R39 LocalSystem service did not restart.' }

          $client = Join-Path $env:ProgramFiles 'NetPilot\Lab\R39RestartClient\NetPilot.ByeDpiR39RestartClient.exe'
          & $client --expect-stopped-after-restart 2>&1 | Tee-Object -FilePath evidence\r39-post-restart.txt
          if ($LASTEXITCODE -ne 0) { throw 'R39 post-restart Stopped probe failed.' }
          $content = Get-Content evidence\r39-post-restart.txt -Raw
          foreach ($marker in @('R39_AUTHENTICATED_IPC=PASS','R39_POST_RESTART_STATUS_STOPPED=PASS','R39_POST_RESTART_NO_LISTENER=PASS','RESULT=R39_POST_RESTART_STOPPED_PASS')) {
            if (-not $content.Contains($marker,[StringComparison]::Ordinal)) { throw "Missing post-restart marker: $marker" }
          }
          'SERVICE_RESTART=PASS' | Add-Content evidence\r39-restart.txt
          'POST_RESTART_STATUS_STOPPED=PASS' | Add-Content evidence\r39-restart.txt

      - name: Second SID acquires fresh lease and old owner is denied
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $username = $env:SECOND_USER_NAME
          $passwordPlain = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) + 'aA1!'
          $password = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          New-LocalUser -Name $username -Password $password -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $usersGroup = (Get-LocalGroup -SID 'S-1-5-32-545').Name
          Add-LocalGroupMember -Group $usersGroup -Member $username

          $primarySid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $secondSid = (Get-LocalUser -Name $username).SID.Value
          if ([string]::Equals($primarySid,$secondSid,[StringComparison]::OrdinalIgnoreCase)) { throw 'R39 temporary user SID matches primary SID.' }
          'SECOND_SID_DISTINCT=True' | Add-Content evidence\r39-restart.txt

          $cred = [Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$username",$password)
          $clientDir = Join-Path $env:ProgramFiles 'NetPilot\Lab\R39RestartClient'
          $clientExe = Join-Path $clientDir 'NetPilot.ByeDpiR39RestartClient.exe'
          $scratch = Join-Path $env:ProgramData 'NetPilotR39'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          & icacls.exe $scratch /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)M' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare R39 second-user scratch ACL.' }

          function Invoke-SecondUserClient([string]$mode,[string]$name) {
            $stdout = Join-Path $scratch "$name.out.txt"
            $stderr = Join-Path $scratch "$name.err.txt"
            $p = Start-Process -FilePath $clientExe -ArgumentList $mode -WorkingDirectory $clientDir -Credential $cred -LoadUserProfile -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $out = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
            $err = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
            $out | Set-Content "evidence\$name.txt"
            if ($err) { $err | Add-Content "evidence\$name.txt" }
            if ($p.ExitCode -ne 0) {
              Get-Content "evidence\$name.txt" | Out-Host
              throw "R39 second-user mode $mode failed with exit code $($p.ExitCode)."
            }
            return $out
          }

          $freshStart = Invoke-SecondUserClient '--start-fresh-owner' 'r39-second-user-start'
          foreach ($marker in @('R39_AUTHENTICATED_IPC=PASS','R39_SESSION_NONZERO=True','R39_FRESH_OWNER_START=PASS','R39_FRESH_OWNER_LISTENER=PASS','RESULT=R39_FRESH_OWNER_START_PASS')) {
            if (-not $freshStart.Contains($marker,[StringComparison]::Ordinal)) { throw "Missing fresh-owner start marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 1) { throw 'R39 fresh owner start did not create exactly one engine process.' }
          'SECOND_USER_FRESH_START=PASS' | Add-Content evidence\r39-restart.txt

          & $clientExe --expect-nonowner-denied 2>&1 | Tee-Object -FilePath evidence\r39-old-owner-denied.txt
          if ($LASTEXITCODE -ne 0) { throw 'R39 old-owner denial probe failed.' }
          $oldOwner = Get-Content evidence\r39-old-owner-denied.txt -Raw
          foreach ($marker in @('R39_OLD_OWNER_START_DENIED=PASS','R39_OLD_OWNER_STOP_DENIED=PASS','R39_FRESH_LEASE_PRESERVED=PASS','RESULT=R39_OLD_OWNER_DENIAL_PASS')) {
            if (-not $oldOwner.Contains($marker,[StringComparison]::Ordinal)) { throw "Missing old-owner denial marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 1) { throw 'R39 old-owner denial changed fresh engine state.' }
          'OLD_OWNER_DENIED_AFTER_RESTART=PASS' | Add-Content evidence\r39-restart.txt
          'FRESH_LEASE_PRESERVED=PASS' | Add-Content evidence\r39-restart.txt

          $freshStop = Invoke-SecondUserClient '--fresh-owner-stop' 'r39-second-user-stop'
          foreach ($marker in @('R39_FRESH_OWNER_STOP=PASS','R39_FRESH_OWNER_CLEANUP=PASS','RESULT=R39_FRESH_OWNER_STOP_PASS')) {
            if (-not $freshStop.Contains($marker,[StringComparison]::Ordinal)) { throw "Missing fresh-owner stop marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 0) { throw 'R39 fresh owner stop left residual ciadpi.exe.' }
          if (@(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:PROXY_PORT) -ErrorAction SilentlyContinue).Count -ne 0) { throw 'R39 fresh owner stop left listener.' }
          'SECOND_USER_FRESH_STOP=PASS' | Add-Content evidence\r39-restart.txt
          'FINAL_ENGINE_CLEANUP=PASS' | Add-Content evidence\r39-restart.txt

          Remove-LocalUser -Name $username
          Remove-Item -LiteralPath $scratch -Recurse -Force
          'SECOND_USER_CLEANUP=PASS' | Add-Content evidence\r39-restart.txt
          'RESULT=R39_RESTART_RECONCILIATION_PASS' | Add-Content evidence\r39-restart.txt
          Get-Content evidence\r39-restart.txt | Out-Host

      - name: Upload text-only R39 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r39-byedpi-restart-reconciliation-evidence
          path: evidence/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Force-clean only workflow-owned state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-LocalUser -Name $env:SECOND_USER_NAME -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:SECOND_USER_NAME -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:ProgramData 'NetPilotR39') -Recurse -Force -ErrorAction SilentlyContinue
          Get-Process -Name ciadpi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service -Name $env:SERVICE_NAME -Force -ErrorAction SilentlyContinue }
            & sc.exe delete $env:SERVICE_NAME | Out-Host
          }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $marker = Join-Path $root '.r39-hosted-owned'
          if (Test-Path -LiteralPath $marker) {
            $value = (Get-Content -LiteralPath $marker -Raw).Trim()
            if ($value -eq $env:NETPILOT_R39_SHA) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host 'WORKFLOW_OWNED_STATE_CLEANUP=PASS'
            } else {
              Write-Warning 'R39 ownership marker mismatch; protected tree not removed.'
            }
          }
