name: R41 ByeDPI Readiness Review Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r41-readiness-review-preflight-once.yml'

permissions:
  contents: read

concurrency:
  group: netpilot-r41-readiness-review-preflight-once
  cancel-in-progress: false

env:
  NETPILOT_R41_SHA: eb46e5f9da52099b7c3b713e2defab424aa029bd

jobs:
  fail-closed-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact R41 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R41_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NETPILOT_R41_SHA"

      - name: Run production fail-closed security gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh
          bash scripts/security/r41-byedpi-production-readiness-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build solution without native execution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build
          echo 'R41_NATIVE_EXECUTION_TESTED=False'
          echo 'PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R41_PREFLIGHT_PASS_BLOCK'
