name: Native Lab Plan Policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-lab-plan-policy.yml"
      - "security/native-admission/lab-execution-policy-r28.4.yaml"
      - "security/native-admission/lab-plans/**"
      - "security/native-admission/prelab-gate-matrix-r28.4.yaml"

permissions:
  contents: read

jobs:
  validate-draft-lab-plans:
    name: Enforce fail-closed native lab plan drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate draft plans remain non-executable and current
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("security/native-admission")
          policy = (root / "lab-execution-policy-r28.4.yaml").read_text(encoding="utf-8")
          matrix = (root / "prelab-gate-matrix-r28.4.yaml").read_text(encoding="utf-8")
          plans = sorted((root / "lab-plans").glob("*.yaml"))

          if not plans:
              raise SystemExit("No native lab plans found")

          def require(text: str, pattern: str, message: str) -> None:
              if re.search(pattern, text, flags=re.MULTILINE) is None:
                  raise SystemExit(message)

          def forbid(text: str, pattern: str, message: str) -> None:
              if re.search(pattern, text, flags=re.MULTILINE) is not None:
                  raise SystemExit(message)

          require(policy, r"^status:\s*ACTIVE_POLICY\s*$", "Lab execution policy must remain ACTIVE_POLICY")
          require(policy, r"^production_effect:\s*NONE\s*$", "Lab policy must have no production effect")
          require(policy, r"^\s*production_activation_requires_separate_admit:\s*true\s*$", "Production activation must require separate ADMIT")
          require(policy, r"^\s*windows:\s*$", "Windows boundary must be present")
          require(policy, r"^\s*current_state:\s*BLOCK\s*$", "At least the declared Windows boundary must remain BLOCK in this policy")

          require(matrix, r"^production_activation_allowed:\s*false\s*$", "Pre-lab matrix must forbid production activation")
          require(matrix, r"^native_runtime_allowed_by_matrix:\s*false\s*$", "Pre-lab matrix must not authorize native runtime")
          forbid(matrix, r"^\s*admission_status:\s*ADMIT\s*$", "Pre-lab matrix must not contain an ADMIT candidate")
          forbid(matrix, r"^\s*may_execute_in_netpilot:\s*true\s*$", "Pre-lab matrix must not enable candidate execution")
          forbid(matrix, r"^\s*may_integrate_in_netpilot:\s*true\s*$", "Pre-lab matrix must not enable candidate integration")

          checked = []
          for path in plans:
              text = path.read_text(encoding="utf-8")
              require(text, r"^status:\s*DRAFT_NOT_APPROVED\s*$", f"{path}: status must remain DRAFT_NOT_APPROVED")
              require(text, r"^execution_allowed:\s*false\s*$", f"{path}: execution_allowed must remain false")
              require(text, r"^\s*approval_id:\s*null\s*$", f"{path}: approval_id must remain null in draft")
              require(text, r"^\s*production_activation_allowed:\s*false\s*$", f"{path}: production activation must remain false")
              forbid(text, r"^\s*execution_allowed:\s*true\s*$", f"{path}: draft cannot enable execution")
              forbid(text, r"^\s*executable_run_allowed:\s*true\s*$", f"{path}: draft stage cannot enable executable run")
              forbid(text, r"^\s*service_installation_allowed:\s*true\s*$", f"{path}: draft cannot enable service installation")
              forbid(text, r"^\s*autostart_allowed:\s*true\s*$", f"{path}: draft cannot enable autostart")
              forbid(text, r"^\s*lab_pass_implies_admit:\s*true\s*$", f"{path}: lab PASS cannot imply ADMIT")
              forbid(text, r"^\s*lab_pass_changes_release_gate:\s*true\s*$", f"{path}: lab PASS cannot change release gate automatically")
              checked.append(path.as_posix())

          byedpi_path = root / "lab-plans/byedpi-loopback-r28.4.yaml"
          if not byedpi_path.exists():
              raise SystemExit("ByeDPI draft lab plan is missing")
          byedpi = byedpi_path.read_text(encoding="utf-8")
          require(byedpi, r"^\s*- 0007-windows-aux-socket-probes\.patch\s*$", "ByeDPI lab plan is stale: patch 0007 is missing")
          require(byedpi, r"^\s*patch_0007_git_blob_sha1:\s*e7b590a7d0594be0629bac221cb120c165dab8cd\s*$", "ByeDPI lab plan patch 0007 Git identity mismatch")
          require(byedpi, r"^\s*patch_0007_sha256:\s*778f47d3ecf2d0f6c8ce0152766c0eb51e2d6e460923227bed49844ba18c0d25\s*$", "ByeDPI lab plan patch 0007 SHA-256 mismatch")
          require(byedpi, r"^\s*linux_x86_64_sha256:\s*a54f71634020ef43421fa6b4c22800409226d29450ad143df949940c2290f33a\s*$", "ByeDPI controlled Linux build reference mismatch")
          require(byedpi, r"^\s*windows_x64_sha256:\s*866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd\s*$", "ByeDPI controlled Windows build reference mismatch")
          require(byedpi, r"^\s*binaries_retained:\s*false\s*$", "ByeDPI draft must record that compile-only binaries were not retained")
          require(byedpi, r"^\s*linux_runtime_binary_sha256:\s*null\s*$", "ByeDPI draft must not pre-authorize a Linux runtime binary")
          require(byedpi, r"^\s*windows_runtime_binary_sha256:\s*null\s*$", "ByeDPI draft must not pre-authorize a Windows runtime binary")
          require(byedpi, r"^\s*approved_candidate_hashes:\s*\[\]\s*$", "ByeDPI draft approval hash list must remain empty")

          require(matrix, r"^\s*- 0007-windows-aux-socket-probes\.patch\s*$", "Pre-lab matrix is stale: ByeDPI patch 0007 is missing")
          require(matrix, r"^\s*patch_0007_git_blob_sha1:\s*e7b590a7d0594be0629bac221cb120c165dab8cd\s*$", "Pre-lab matrix patch 0007 Git identity mismatch")
          require(matrix, r"^\s*patch_0007_sha256:\s*778f47d3ecf2d0f6c8ce0152766c0eb51e2d6e460923227bed49844ba18c0d25\s*$", "Pre-lab matrix patch 0007 SHA-256 mismatch")
          require(matrix, r"^\s*full_patchset_0001_0007_compile:\s*PASS_FOR_COMPILE_ONLY\s*$", "Pre-lab matrix must pin ByeDPI full patchset compile-only PASS")
          require(matrix, r"^\s*linux_binary_sha256:\s*a54f71634020ef43421fa6b4c22800409226d29450ad143df949940c2290f33a\s*$", "Pre-lab matrix Linux build hash mismatch")
          require(matrix, r"^\s*windows_binary_sha256:\s*866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd\s*$", "Pre-lab matrix Windows build hash mismatch")

          dpibreak_path = root / "lab-plans/dpibreak-linux-r28.4.yaml"
          if not dpibreak_path.exists():
              raise SystemExit("DPIBreak Linux draft lab plan is missing")
          dpibreak = dpibreak_path.read_text(encoding="utf-8")
          require(dpibreak, r"^candidate:\s*dpibreak-v0\.6\.2-candidate\s*$", "DPIBreak draft candidate identity mismatch")
          require(dpibreak, r"^\s*annotated_tag_object:\s*7601532147fe92130964e49a644d3207e74b8a51\s*$", "DPIBreak annotated tag identity mismatch")
          require(dpibreak, r"^\s*release_commit:\s*334285b60aabd5a32a83a65211ac60bce968b211\s*$", "DPIBreak release commit mismatch")
          require(dpibreak, r"^\s*release_tree:\s*7e95a17933fe9fda521865b1317c4f9f75d6c58c\s*$", "DPIBreak release tree mismatch")
          require(dpibreak, r"^\s*cargo_lock_git_blob_sha1:\s*e3adcd1b21711e7e754878b15625076c7bcaf7e9\s*$", "DPIBreak Cargo.lock identity mismatch")
          require(dpibreak, r"^\s*runtime_binary_sha256:\s*null\s*$", "DPIBreak draft must not pre-authorize a runtime binary")
          require(dpibreak, r"^\s*quic_http3_assumed_supported:\s*false\s*$", "DPIBreak draft must not assume QUIC/HTTP3 support")
          require(dpibreak, r"^\s*discord_udp_assumed_supported:\s*false\s*$", "DPIBreak draft must not assume Discord UDP support")
          require(dpibreak, r"^\s*public_service_targets_allowed_initially:\s*false\s*$", "DPIBreak first lab stage must remain local/synthetic")
          require(dpibreak, r"^\s*execution_allowed:\s*false\s*$", "DPIBreak segmentation matrix must remain non-executable")

          require(matrix, r"^\s*linux_plan:\s*security/native-admission/lab-plans/dpibreak-linux-r28\.4\.yaml\s*$", "Pre-lab matrix is missing DPIBreak Linux plan")
          require(matrix, r"^\s*linux_plan_status:\s*DRAFT_NOT_APPROVED\s*$", "DPIBreak Linux plan must remain DRAFT_NOT_APPROVED")
          require(matrix, r"^\s*runtime_binary_sha256:\s*null\s*$", "Pre-lab matrix must not pre-authorize a DPIBreak runtime binary")
          require(matrix, r"^\s*nfqueue_or_firewall_execution_allowed:\s*false\s*$", "Pre-lab matrix must forbid DPIBreak NFQUEUE/firewall execution")

          Path("lab-plan-policy-evidence.txt").write_text(
              "schema_version=5\n"
              "scope=native-lab-plan-draft-policy\n"
              "result=PASS\n"
              "production_activation_allowed=false\n"
              "native_runtime_authorized=false\n"
              "byedpi_current_patchset=0001-0007\n"
              "byedpi_patch_0007_git_blob_sha1=e7b590a7d0594be0629bac221cb120c165dab8cd\n"
              "byedpi_patch_0007_sha256=778f47d3ecf2d0f6c8ce0152766c0eb51e2d6e460923227bed49844ba18c0d25\n"
              "byedpi_compile_reference_linux_sha256=a54f71634020ef43421fa6b4c22800409226d29450ad143df949940c2290f33a\n"
              "byedpi_compile_reference_windows_sha256=866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd\n"
              "byedpi_runtime_hashes_preauthorized=false\n"
              "dpibreak_plan_present=true\n"
              "dpibreak_release_commit=334285b60aabd5a32a83a65211ac60bce968b211\n"
              "dpibreak_cargo_lock_git_blob_sha1=e3adcd1b21711e7e754878b15625076c7bcaf7e9\n"
              "dpibreak_runtime_hash_preauthorized=false\n"
              "dpibreak_nfqueue_firewall_execution_allowed=false\n"
              "checked_plans=" + ",".join(checked) + "\n",
              encoding="utf-8",
          )

      - name: Upload text-only policy evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lab-plan-policy-evidence
          path: lab-plan-policy-evidence.txt
          if-no-files-found: error
          retention-days: 14
