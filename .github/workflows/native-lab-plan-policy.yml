name: Native Lab Plan Policy

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-lab-plan-policy.yml"
      - "security/native-admission/lab-execution-policy-r28.4.yaml"
      - "security/native-admission/lab-plans/**"
      - "security/native-admission/prelab-gate-matrix-r28.4.yaml"

permissions:
  contents: read

jobs:
  validate-draft-lab-plans:
    name: Enforce fail-closed native lab plan drafts
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate draft plans remain non-executable
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path("security/native-admission")
          policy = (root / "lab-execution-policy-r28.4.yaml").read_text(encoding="utf-8")
          matrix = (root / "prelab-gate-matrix-r28.4.yaml").read_text(encoding="utf-8")
          plans = sorted((root / "lab-plans").glob("*.yaml"))

          if not plans:
              raise SystemExit("No native lab plans found")

          def require(text: str, pattern: str, message: str) -> None:
              if re.search(pattern, text, flags=re.MULTILINE) is None:
                  raise SystemExit(message)

          def forbid(text: str, pattern: str, message: str) -> None:
              if re.search(pattern, text, flags=re.MULTILINE) is not None:
                  raise SystemExit(message)

          require(policy, r"^status:\s*ACTIVE_POLICY\s*$", "Lab execution policy must remain ACTIVE_POLICY")
          require(policy, r"^production_effect:\s*NONE\s*$", "Lab policy must have no production effect")
          require(policy, r"^\s*production_activation_requires_separate_admit:\s*true\s*$", "Production activation must require separate ADMIT")
          require(policy, r"^\s*windows:\s*$", "Windows boundary must be present")
          require(policy, r"^\s*current_state:\s*BLOCK\s*$", "At least the declared Windows boundary must remain BLOCK in this policy")

          require(matrix, r"^production_activation_allowed:\s*false\s*$", "Pre-lab matrix must forbid production activation")
          require(matrix, r"^native_runtime_allowed_by_matrix:\s*false\s*$", "Pre-lab matrix must not authorize native runtime")
          forbid(matrix, r"^\s*admission_status:\s*ADMIT\s*$", "Pre-lab matrix must not contain an ADMIT candidate")
          forbid(matrix, r"^\s*may_execute_in_netpilot:\s*true\s*$", "Pre-lab matrix must not enable candidate execution")
          forbid(matrix, r"^\s*may_integrate_in_netpilot:\s*true\s*$", "Pre-lab matrix must not enable candidate integration")

          checked = []
          for path in plans:
              text = path.read_text(encoding="utf-8")
              require(text, r"^status:\s*DRAFT_NOT_APPROVED\s*$", f"{path}: status must remain DRAFT_NOT_APPROVED")
              require(text, r"^execution_allowed:\s*false\s*$", f"{path}: execution_allowed must remain false")
              require(text, r"^\s*approval_id:\s*null\s*$", f"{path}: approval_id must remain null in draft")
              require(text, r"^\s*production_activation_allowed:\s*false\s*$", f"{path}: production activation must remain false")
              forbid(text, r"^\s*execution_allowed:\s*true\s*$", f"{path}: draft cannot enable execution")
              forbid(text, r"^\s*executable_run_allowed:\s*true\s*$", f"{path}: draft stage cannot enable executable run")
              forbid(text, r"^\s*service_installation_allowed:\s*true\s*$", f"{path}: draft cannot enable service installation")
              forbid(text, r"^\s*autostart_allowed:\s*true\s*$", f"{path}: draft cannot enable autostart")
              forbid(text, r"^\s*lab_pass_implies_admit:\s*true\s*$", f"{path}: lab PASS cannot imply ADMIT")
              forbid(text, r"^\s*lab_pass_changes_release_gate:\s*true\s*$", f"{path}: lab PASS cannot change release gate automatically")
              checked.append(path.as_posix())

          Path("lab-plan-policy-evidence.txt").write_text(
              "schema_version=1\n"
              "scope=native-lab-plan-draft-policy\n"
              "result=PASS\n"
              "production_activation_allowed=false\n"
              "native_runtime_authorized=false\n"
              "checked_plans=" + ",".join(checked) + "\n",
              encoding="utf-8",
          )

      - name: Upload text-only policy evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-lab-plan-policy-evidence
          path: lab-plan-policy-evidence.txt
          if-no-files-found: error
          retention-days: 14
