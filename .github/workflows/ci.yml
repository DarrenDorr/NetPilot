name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NetPilot.sln

      - name: Build
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test NetPilot.sln --configuration Release --no-build
