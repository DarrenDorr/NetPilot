name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Проверка политики безопасности
        run: bash scripts/security-policy-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NetPilot.sln

      - name: Build
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Тесты Core и IPC
        run: dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build

      - name: Тесты безопасного парсера Zapret
        run: dotnet test tests/NetPilot.Engine.Zapret.Tests/NetPilot.Engine.Zapret.Tests.csproj --configuration Release --no-build

  windows-security-test:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Parse no-admin PowerShell harnesses
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in @(
            'scripts\build-user-mode-installer.ps1',
            'scripts\r42-12-4-hosted-standard-user.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file).Path,
              [ref]$tokens,
              [ref]$errors) | Out-Null
            if (@($errors).Count -ne 0) {
              $messages = @($errors | ForEach-Object { $_.Message }) -join '; '
              throw "PowerShell parser rejected $file : $messages"
            }
          }

      - name: Restore Windows security tests
        run: dotnet restore tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj

      - name: Restore Windows GUI host
        run: dotnet restore src/NetPilot.App.Windows/NetPilot.App.Windows.csproj

      - name: Restore real-PC ByeDPI validation tool
        run: dotnet restore tools/NetPilot.ByeDpiPcValidation/NetPilot.ByeDpiPcValidation.csproj

      - name: Restore no-admin ByeDPI validation tool
        run: dotnet restore tools/NetPilot.ByeDpiUserModeValidation/NetPilot.ByeDpiUserModeValidation.csproj

      - name: Build Windows security tests
        run: dotnet build tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-restore

      - name: Build Windows GUI host
        run: dotnet build src/NetPilot.App.Windows/NetPilot.App.Windows.csproj --configuration Release --no-restore

      - name: Build real-PC ByeDPI validation tool
        run: dotnet build tools/NetPilot.ByeDpiPcValidation/NetPilot.ByeDpiPcValidation.csproj --configuration Release --no-restore

      - name: Build no-admin ByeDPI validation tool
        run: dotnet build tools/NetPilot.ByeDpiUserModeValidation/NetPilot.ByeDpiUserModeValidation.csproj --configuration Release --no-restore

      - name: Windows IPC security tests
        run: dotnet test tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-build

      - name: Build verified Inno Setup installer
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/build-installer.ps1 -Version 0.1.0-alpha-ci -VersionInfoVersion 0.1.0.0

      - name: Installer smoke test - install and service start
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path 'artifacts\installer\NetPilot-Setup-0.1.0-alpha-ci-x64.exe'
          $process = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Setup failed with exit code $($process.ExitCode)" }
          $service = Get-Service -Name 'NetPilot.Service' -ErrorAction Stop
          if ($service.Status -ne 'Running') { throw "NetPilot.Service is not running: $($service.Status)" }
          if (-not (Test-Path "$env:ProgramFiles\NetPilot\App\NetPilot.exe")) { throw 'NetPilot.exe was not installed.' }
          if (-not (Test-Path "$env:ProgramFiles\NetPilot\Service\NetPilot.Service.exe")) { throw 'NetPilot.Service.exe was not installed.' }

      - name: Installed diagnostics support bundle smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = "$env:ProgramFiles\NetPilot\App\NetPilot.exe"
          $support = "$env:LOCALAPPDATA\NetPilot\Support"
          if (Test-Path $support) { Remove-Item -LiteralPath $support -Recurse -Force }

          $process = Start-Process -FilePath $app -ArgumentList '--collect-diagnostics' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Diagnostics mode failed with exit code $($process.ExitCode)" }

          $bundle = Get-ChildItem -LiteralPath $support -Filter 'NetPilot-Diagnostics-*-UTC.zip' -File |
            Sort-Object LastWriteTimeUtc -Descending |
            Select-Object -First 1
          if ($null -eq $bundle) { throw 'Diagnostics ZIP was not created.' }

          $expanded = Join-Path $env:RUNNER_TEMP 'netpilot-diagnostics-smoke'
          if (Test-Path $expanded) { Remove-Item -LiteralPath $expanded -Recurse -Force }
          Expand-Archive -LiteralPath $bundle.FullName -DestinationPath $expanded

          foreach ($required in @('diagnostics.json','environment.txt','engine-status.json','privacy.txt','checksums.txt')) {
            if (-not (Test-Path (Join-Path $expanded $required) -PathType Leaf)) {
              throw "Diagnostics bundle is missing $required"
            }
          }

          $metadata = Get-Content -LiteralPath (Join-Path $expanded 'diagnostics.json') -Raw | ConvertFrom-Json
          if ($metadata.AutomaticUpload -ne $false) { throw 'Diagnostics bundle must record AutomaticUpload=false.' }
          if ($metadata.DiagnosticCode -cne 'NP-DIAG-MANUAL-001') { throw 'Unexpected diagnostics code.' }
          if ($metadata.ServiceLogsReadable -ne $true) { throw 'Installed user must have read-only access to service diagnostics.' }

          $appLogs = @(Get-ChildItem -LiteralPath (Join-Path $expanded 'logs\app') -Filter 'netpilot-*.jsonl' -File -ErrorAction SilentlyContinue)
          if ($appLogs.Count -lt 1) { throw 'Diagnostics bundle did not include the app JSONL log.' }

          $serviceLogs = @(Get-ChildItem -LiteralPath (Join-Path $expanded 'logs\service') -Filter 'netpilot-*.jsonl' -File -ErrorAction SilentlyContinue)
          if ($serviceLogs.Count -lt 1) { throw 'Diagnostics bundle did not include the service JSONL log.' }

      - name: Installer smoke test - uninstall and service removal
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $uninstaller = "$env:ProgramFiles\NetPilot\unins000.exe"
          if (Test-Path $uninstaller) {
            $process = Start-Process -FilePath $uninstaller -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Uninstall failed with exit code $($process.ExitCode)" }
          }
          if (Get-Service -Name 'NetPilot.Service' -ErrorAction SilentlyContinue) { throw 'NetPilot.Service remained registered after uninstall.' }
