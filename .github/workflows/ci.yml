name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, feature/byedpi-functional-lab-r34 ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Проверка политики безопасности
        run: bash scripts/security-policy-check.sh

      - name: Проверка runtime admission composition
        run: bash scripts/runtime-admission-policy-check.sh

      - name: R35 service integration boundary when present
        run: |
          if [ -f scripts/security/r35-service-integration-boundary-check.sh ]; then
            bash scripts/security/r35-service-integration-boundary-check.sh
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NetPilot.sln

      - name: Build
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Тесты Core и IPC
        run: dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build

      - name: Тесты безопасного парсера Zapret
        run: dotnet test tests/NetPilot.Engine.Zapret.Tests/NetPilot.Engine.Zapret.Tests.csproj --configuration Release --no-build

  windows-security-test:
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore Windows security tests
        run: dotnet restore tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj

      - name: Restore Windows GUI host
        run: dotnet restore src/NetPilot.App.Windows/NetPilot.App.Windows.csproj

      - name: Restore UAC lab IPC client
        run: dotnet restore tools/NetPilot.WindowsIpcLabClient/NetPilot.WindowsIpcLabClient.csproj

      - name: Build Windows security tests
        run: dotnet build tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-restore

      - name: Build Windows GUI host
        run: dotnet build src/NetPilot.App.Windows/NetPilot.App.Windows.csproj --configuration Release --no-restore

      - name: Build UAC lab IPC client without execution
        run: dotnet build tools/NetPilot.WindowsIpcLabClient/NetPilot.WindowsIpcLabClient.csproj --configuration Release --no-restore

      - name: Windows unit and local pipe security tests
        run: dotnet test tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-build

      - name: Build verified Inno Setup installer
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File scripts/build-installer.ps1 -Version 0.1.0-alpha-ci -VersionInfoVersion 0.1.0.0

      - name: Installer artifact sanity check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Resolve-Path 'artifacts\installer\NetPilot-Setup-0.1.0-alpha-ci-x64.exe'
          $item = Get-Item $setup
          if ($item.Length -le 0) {
            throw 'Installer artifact is empty.'
          }

          $hash = Get-FileHash -Algorithm SHA256 -Path $setup
          Write-Host "Installer: $($item.FullName)"
          Write-Host "Size: $($item.Length) bytes"
          Write-Host "SHA-256: $($hash.Hash)"

      - name: Hosted Windows evidence boundary
        shell: pwsh
        run: |
          Write-Host 'Hosted Windows CI validates build, unit/local-pipe tests, lab-client compilation and installer artifact creation only.'
          Write-Host 'The lab IPC client is NOT executed on the hosted runner because no real installed LocalSystem service/UAC/SID binding exists here.'
          Write-Host 'Hosted CI MUST NOT be treated as evidence of real standard-user UAC, installer elevation, LocalSystem service lifecycle or cross-user SID binding.'
          Write-Host 'Those checks belong to the isolated windows-uac-security workflow.'
