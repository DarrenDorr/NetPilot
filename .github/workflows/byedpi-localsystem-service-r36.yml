name: R36 ByeDPI Installed LocalSystem Service Lab

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netpilot-r36-byedpi-localsystem-service
  cancel-in-progress: false

env:
  NETPILOT_R36_SHA: aa2711ae1bce1425306aad3cd606295c7b750c90
  BYEDPI_SOURCE_SHA: 7efde1b1296eaaa187b70e951894dde17527489c
  BYEDPI_SOURCE_TREE: 8d13f6f5939190cd27ee68696247073a00b3e7dc
  BYEDPI_WINDOWS_SHA256: 866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd
  R36_PACKAGE_VERSION: 0.17.3-netpilot-r34-lab
  R36_SERVICE_NAME: NetPilot.R36.Lab
  R36_PROXY_PORT: 39036

jobs:
  build-exact-candidate:
    name: Rebuild exact reviewed ByeDPI candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact NetPilot R36 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R36_SHA }}
          path: netpilot
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout exact ByeDPI v0.17.3 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: hufrea/byedpi
          ref: ${{ env.BYEDPI_SOURCE_SHA }}
          path: byedpi
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact source and apply reviewed patchset
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C netpilot rev-parse HEAD)" = "$NETPILOT_R36_SHA"
          test "$(git -C byedpi rev-parse HEAD)" = "$BYEDPI_SOURCE_SHA"
          test "$(git -C byedpi rev-parse 'HEAD^{tree}')" = "$BYEDPI_SOURCE_TREE"

          patch_dir="$PWD/canonical-byedpi-patches"
          mkdir -p "$patch_dir"

          declare -A blob_sha=(
            [0001-loopback-only-listener.patch]=fa9ba3349792d66f40d925bc612310e8d18aae8a
            [0002-kavl-iterator-no-before-array-sentinel.patch]=6f51d66597847ee49e373922e4905c80b8ee2f47
            [0003-pid-file-fail-safe-write.patch]=d56d0f8659a49c48c923b6af85a523a952e77e0c
            [0004-kavl-empty-erase-guard.patch]=9b196b289efd9a2ea1118c5504f4a811aa0becd2
            [0005-windows-socket-handle-narrowing-guard.patch]=d5cde98057a0ded600468b1f1c69d2e55c3b4d6e
            [0006-windows-wait-result-range.patch]=0815be26534c291848a8b16bdedb07a6ab1e485f
            [0007-windows-aux-socket-probes.patch]=e7b590a7d0594be0629bac221cb120c165dab8cd
          )

          declare -A patch_sha256=(
            [0001-loopback-only-listener.patch]=3e9a744830082d224592d730a816c4afcf9df15a2a6ab93870409ccf5c94c068
            [0002-kavl-iterator-no-before-array-sentinel.patch]=6701c48ef00f81ca7fa95f98a1e6406f657fbdfc028371f568c7918106cd5fb7
            [0003-pid-file-fail-safe-write.patch]=5d10702499581eeba2f632aa506b5d6c51ceb3e8e093bff25b8dcbc821bb3738
            [0004-kavl-empty-erase-guard.patch]=fdc13219be9cb9d654ce7995df825decb6ee0f05e63d72481560977bbf3b3c4a
            [0005-windows-socket-handle-narrowing-guard.patch]=7c8f4eee9ff2624346cb886027df66378773d0af04f5f84f54c30815104b4356
            [0006-windows-wait-result-range.patch]=136b9fdf34b68a55f0f1a6ebf16e8b61c9b88e6d15eeb923594bdd7bf0fa2a3e
            [0007-windows-aux-socket-probes.patch]=778f47d3ecf2d0f6c8ce0152766c0eb51e2d6e460923227bed49844ba18c0d25
          )

          for patch in \
            0001-loopback-only-listener.patch \
            0002-kavl-iterator-no-before-array-sentinel.patch \
            0003-pid-file-fail-safe-write.patch \
            0004-kavl-empty-erase-guard.patch \
            0005-windows-socket-handle-narrowing-guard.patch \
            0006-windows-wait-result-range.patch \
            0007-windows-aux-socket-probes.patch
          do
            actual_blob="$(git -C netpilot rev-parse "HEAD:security/native-admission/patches/byedpi-r28/$patch")"
            test "$actual_blob" = "${blob_sha[$patch]}"
            git -C netpilot show "HEAD:security/native-admission/patches/byedpi-r28/$patch" > "$patch_dir/$patch"
            actual_sha="$(sha256sum "$patch_dir/$patch" | awk '{print $1}')"
            test "$actual_sha" = "${patch_sha256[$patch]}"
            git -C byedpi apply --check "$patch_dir/$patch"
            git -C byedpi apply "$patch_dir/$patch"
          done

          grep -Fq 'Listening IP, loopback only; default 127.0.0.1' byedpi/main.c
          grep -Fq 'netpilot_is_loopback_addr' byedpi/main.c
          grep -Fq 'get_addr("127.0.0.1", &params.laddr)' byedpi/main.c

      - name: Install Windows cross-compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends mingw-w64 file

      - name: Build deterministic Windows x64 candidate and require exact SHA-256
        shell: bash
        working-directory: byedpi
        run: |
          set -euo pipefail
          make clean >/dev/null
          make windows CC=x86_64-w64-mingw32-gcc WIN_LDFLAGS='-Wl,--no-insert-timestamp -lws2_32 -lmswsock'
          test -f ciadpi.exe
          file ciadpi.exe
          actual="$(sha256sum ciadpi.exe | awk '{print $1}')"
          echo "BYEDPI_WINDOWS_SHA256_ACTUAL=$actual"
          test "$actual" = "$BYEDPI_WINDOWS_SHA256"

      - name: Transfer exact candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r36-byedpi-candidate-transfer
          path: byedpi/ciadpi.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  execute-installed-localsystem-lab:
    name: Install LocalSystem lab service and exercise authenticated IPC
    needs: build-exact-candidate
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Checkout exact NetPilot R36 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R36_SHA }}
          path: netpilot
          persist-credentials: false
          fetch-depth: 1

      - name: Download exact candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: r36-byedpi-candidate-transfer
          path: candidate

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify clean elevated hosted boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C netpilot rev-parse HEAD).Trim() -ne $env:NETPILOT_R36_SHA) {
            throw 'NetPilot R36 checkpoint drift.'
          }

          $candidate = Resolve-Path 'candidate\ciadpi.exe'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) {
            throw 'R36 candidate hash drift.'
          }

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'R36 requires the hosted administrative Windows runner for protected staging.'
          }

          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) {
            throw 'R36 workflow client is not in an interactive Windows session.'
          }

          foreach ($service in @('NetPilot.Service', $env:R36_SERVICE_NAME)) {
            if (Get-Service -Name $service -ErrorAction SilentlyContinue) {
              throw "Refusing pre-existing Windows service: $service"
            }
          }

          $root = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $root) {
            throw "Refusing pre-existing NetPilot Program Files root: $root"
          }

          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "NETPILOT_R36_SHA=$env:NETPILOT_R36_SHA" | Set-Content evidence\r36-boundary.txt
          "BYEDPI_WINDOWS_SHA256=$actual" | Add-Content evidence\r36-boundary.txt
          "CLIENT_SESSION_ID=$sessionId" | Add-Content evidence\r36-boundary.txt
          'PRODUCTION_ADMISSION=BLOCK' | Add-Content evidence\r36-boundary.txt

      - name: Capture system proxy and WinDivert baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-ProxySnapshot {
            $internet = Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -ErrorAction SilentlyContinue
            $winHttp = ((& netsh winhttp show proxy) -join "`n").Trim()
            [ordered]@{
              ProxyEnable = if ($null -eq $internet) { $null } else { $internet.ProxyEnable }
              ProxyServer = if ($null -eq $internet) { $null } else { $internet.ProxyServer }
              AutoConfigURL = if ($null -eq $internet) { $null } else { $internet.AutoConfigURL }
              WinHttp = $winHttp
            } | ConvertTo-Json -Compress
          }
          function Get-WinDivertSnapshot {
            $drivers = @(Get-CimInstance Win32_SystemDriver | Where-Object { $_.Name -match 'WinDivert' -or $_.PathName -match 'WinDivert' } | Sort-Object Name | Select-Object Name, State, StartMode, PathName)
            $services = @(Get-Service | Where-Object { $_.Name -match 'WinDivert' } | Sort-Object Name | Select-Object Name, Status, StartType)
            [ordered]@{ Drivers = $drivers; Services = $services } | ConvertTo-Json -Compress -Depth 5
          }
          Get-ProxySnapshot | Set-Content evidence\proxy-before.txt
          Get-WinDivertSnapshot | Set-Content evidence\windivert-before.txt

      - name: Publish R36 lab service and client
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage protected service, config and exact managed engine package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $serviceDir = Join-Path $root 'Lab\R36Service'
          $engineBin = Join-Path $root "Engines\Managed\byedpi\$env:R36_PACKAGE_VERSION\x64\bin"
          $config = Join-Path $root 'Config'
          $users = Join-Path $root 'Users'
          New-Item -ItemType Directory -Force -Path $serviceDir, $engineBin, $config, $users | Out-Null
          Set-Content -LiteralPath (Join-Path $root '.r36-hosted-owned') -Value $env:NETPILOT_R36_SHA -NoNewline
          Copy-Item -Path 'publish\service\*' -Destination $serviceDir -Recurse
          Copy-Item -LiteralPath 'candidate\ciadpi.exe' -Destination (Join-Path $engineBin 'ciadpi.exe')

          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          Set-Content -LiteralPath (Join-Path $config 'enrollment.session') -Value $sessionId -NoNewline

          & icacls.exe $root /inheritance:r | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to protect R36 root inheritance.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set R36 root ACL.' }
          & icacls.exe $root /setowner '*S-1-5-32-544' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set privileged owner on R36 tree.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize R36 tree ACL.' }

          $staged = Join-Path $engineBin 'ciadpi.exe'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $staged).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'Staged R36 candidate hash drift.' }
          "STAGED_SHA256=$actual" | Add-Content evidence\r36-boundary.txt
          'PROTECTED_PROGRAM_FILES_TREE=True' | Add-Content evidence\r36-boundary.txt

      - name: Register and start isolated LocalSystem lab service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceExe = Join-Path $env:ProgramFiles 'NetPilot\Lab\R36Service\NetPilot.ByeDpiR36ServiceLab.exe'
          if (-not (Test-Path -LiteralPath $serviceExe)) { throw 'R36 service executable missing after staging.' }

          $quoted = '"' + $serviceExe + '"'
          $output = & sc.exe create $env:R36_SERVICE_NAME "binPath= $quoted" 'start= demand' 'obj= LocalSystem' 2>&1
          $output | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create R36 Windows service.' }

          $svc = Get-CimInstance Win32_Service -Filter "Name='$env:R36_SERVICE_NAME'"
          if ($null -eq $svc -or $svc.StartName -ne 'LocalSystem') {
            throw 'R36 service is not configured as LocalSystem.'
          }
          "SERVICE_START_NAME=$($svc.StartName)" | Add-Content evidence\r36-boundary.txt

          Start-Service -Name $env:R36_SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $service = Get-Service -Name $env:R36_SERVICE_NAME
            if ($service.Status -eq 'Running') { break }
          } while ((Get-Date) -lt $deadline)
          if ($service.Status -ne 'Running') { throw 'R36 LocalSystem service did not reach Running.' }
          'LOCALSYSTEM_SERVICE_RUNNING=True' | Add-Content evidence\r36-boundary.txt

      - name: Execute authenticated IPC functional cycle
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clientExe = Resolve-Path 'publish\client\NetPilot.ByeDpiR36LabClient.exe'
          & $clientExe 2>&1 | Tee-Object -FilePath evidence\r36-ipc-functional.txt
          if ($LASTEXITCODE -ne 0) { throw 'R36 authenticated IPC functional client failed.' }
          $content = Get-Content evidence\r36-ipc-functional.txt -Raw
          foreach ($marker in @('AUTHENTICATED_IPC=PASS','IPC_START=PASS','IPC_SOCKS_HTTP=PASS','IPC_STOP_CLEANUP=PASS','RESULT=BYEDPI_LOCALSYSTEM_IPC_R36_PASS')) {
            if (-not $content.Contains($marker, [StringComparison]::Ordinal)) { throw "Missing R36 functional marker: $marker" }
          }

      - name: Prove service-owned process and graceful service-stop cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clientExe = Resolve-Path 'publish\client\NetPilot.ByeDpiR36LabClient.exe'
          & $clientExe --start-for-service-stop 2>&1 | Tee-Object -FilePath evidence\r36-service-stop.txt
          if ($LASTEXITCODE -ne 0) { throw 'R36 start-for-service-stop client failed.' }

          $service = Get-CimInstance Win32_Service -Filter "Name='$env:R36_SERVICE_NAME'"
          if ($null -eq $service -or $service.State -ne 'Running' -or $service.ProcessId -le 0) {
            throw 'R36 service process identity unavailable.'
          }
          $engines = @(Get-CimInstance Win32_Process -Filter "Name='ciadpi.exe'")
          if ($engines.Count -ne 1) { throw "Expected exactly one service-owned ciadpi.exe, found $($engines.Count)." }
          $engine = $engines[0]
          if ([uint32]$engine.ParentProcessId -ne [uint32]$service.ProcessId) {
            throw 'ciadpi.exe is not a direct child of the R36 LocalSystem service process.'
          }
          $owner = Invoke-CimMethod -InputObject $engine -MethodName GetOwner
          if ($owner.User -ne 'SYSTEM') { throw "R36 engine process owner is not SYSTEM: $($owner.User)" }
          "SERVICE_PID=$($service.ProcessId)" | Add-Content evidence\r36-service-stop.txt
          "ENGINE_PID=$($engine.ProcessId)" | Add-Content evidence\r36-service-stop.txt
          'ENGINE_PARENT_IS_SERVICE=True' | Add-Content evidence\r36-service-stop.txt
          'ENGINE_OWNER_SYSTEM=True' | Add-Content evidence\r36-service-stop.txt

          Stop-Service -Name $env:R36_SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $state = (Get-Service -Name $env:R36_SERVICE_NAME).Status
            if ($state -eq 'Stopped') { break }
          } while ((Get-Date) -lt $deadline)
          if ($state -ne 'Stopped') { throw 'R36 service did not stop cleanly.' }

          $deadline = (Get-Date).AddSeconds(10)
          do {
            $residual = @(Get-Process -Name ciadpi -ErrorAction SilentlyContinue)
            $listener = @(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:R36_PROXY_PORT) -ErrorAction SilentlyContinue)
            if ($residual.Count -eq 0 -and $listener.Count -eq 0) { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          if ($residual.Count -ne 0) { throw 'R36 service stop left residual ciadpi.exe.' }
          if ($listener.Count -ne 0) { throw 'R36 service stop left residual proxy listener.' }
          'SERVICE_STOP_ENGINE_CLEANUP=PASS' | Add-Content evidence\r36-service-stop.txt

      - name: Restart service and require stopped typed state
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Service -Name $env:R36_SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $status = (Get-Service -Name $env:R36_SERVICE_NAME).Status
            if ($status -eq 'Running') { break }
          } while ((Get-Date) -lt $deadline)
          if ($status -ne 'Running') { throw 'R36 service restart failed.' }

          $clientExe = Resolve-Path 'publish\client\NetPilot.ByeDpiR36LabClient.exe'
          & $clientExe --status-only 2>&1 | Tee-Object -FilePath evidence\r36-restart-status.txt
          if ($LASTEXITCODE -ne 0) { throw 'R36 status-after-restart client failed.' }
          $content = Get-Content evidence\r36-restart-status.txt -Raw
          if (-not $content.Contains('BYEDPI_STATUS=Stopped', [StringComparison]::Ordinal)) {
            throw 'R36 service restart did not return Stopped typed engine state.'
          }
          if (-not $content.Contains('RESULT=R36_STATUS_PASS', [StringComparison]::Ordinal)) {
            throw 'R36 restart status marker missing.'
          }
          'SERVICE_RESTART_STATUS=PASS' | Add-Content evidence\r36-restart-status.txt
          Stop-Service -Name $env:R36_SERVICE_NAME

      - name: Verify no proxy or WinDivert mutation and no residue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-ProxySnapshot {
            $internet = Get-ItemProperty -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -ErrorAction SilentlyContinue
            $winHttp = ((& netsh winhttp show proxy) -join "`n").Trim()
            [ordered]@{
              ProxyEnable = if ($null -eq $internet) { $null } else { $internet.ProxyEnable }
              ProxyServer = if ($null -eq $internet) { $null } else { $internet.ProxyServer }
              AutoConfigURL = if ($null -eq $internet) { $null } else { $internet.AutoConfigURL }
              WinHttp = $winHttp
            } | ConvertTo-Json -Compress
          }
          function Get-WinDivertSnapshot {
            $drivers = @(Get-CimInstance Win32_SystemDriver | Where-Object { $_.Name -match 'WinDivert' -or $_.PathName -match 'WinDivert' } | Sort-Object Name | Select-Object Name, State, StartMode, PathName)
            $services = @(Get-Service | Where-Object { $_.Name -match 'WinDivert' } | Sort-Object Name | Select-Object Name, Status, StartType)
            [ordered]@{ Drivers = $drivers; Services = $services } | ConvertTo-Json -Compress -Depth 5
          }
          $proxyAfter = Get-ProxySnapshot
          $windivertAfter = Get-WinDivertSnapshot
          $proxyBefore = (Get-Content evidence\proxy-before.txt -Raw).Trim()
          $windivertBefore = (Get-Content evidence\windivert-before.txt -Raw).Trim()
          "PROXY_UNCHANGED=$($proxyAfter -eq $proxyBefore)" | Set-Content evidence\r36-residue.txt
          "WINDIVERT_UNCHANGED=$($windivertAfter -eq $windivertBefore)" | Add-Content evidence\r36-residue.txt
          $residual = @(Get-Process -Name ciadpi -ErrorAction SilentlyContinue)
          $listener = @(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:R36_PROXY_PORT) -ErrorAction SilentlyContinue)
          "RESIDUAL_CIADPI=$($residual.Count -ne 0)" | Add-Content evidence\r36-residue.txt
          "RESIDUAL_PROXY_LISTENER=$($listener.Count -ne 0)" | Add-Content evidence\r36-residue.txt
          if ($proxyAfter -ne $proxyBefore) { throw 'System proxy changed during R36.' }
          if ($windivertAfter -ne $windivertBefore) { throw 'WinDivert state changed during R36.' }
          if ($residual.Count -ne 0 -or $listener.Count -ne 0) { throw 'R36 left native runtime residue.' }
          'POST_RUN_ISOLATION=PASS' | Add-Content evidence\r36-residue.txt
          'RESULT=BYEDPI_INSTALLED_LOCALSYSTEM_R36_PASS' | Add-Content evidence\r36-residue.txt

      - name: Upload text-only R36 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r36-byedpi-installed-localsystem-evidence
          path: evidence/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Remove workflow-owned lab service and protected tree
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $service = Get-Service -Name $env:R36_SERVICE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') {
              Stop-Service -Name $env:R36_SERVICE_NAME -Force -ErrorAction SilentlyContinue
              Start-Sleep -Seconds 2
            }
            & sc.exe delete $env:R36_SERVICE_NAME | Out-Host
          }
          Get-Process -Name ciadpi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $marker = Join-Path $root '.r36-hosted-owned'
          if (Test-Path -LiteralPath $marker) {
            $value = (Get-Content -LiteralPath $marker -Raw).Trim()
            if ($value -eq $env:NETPILOT_R36_SHA) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host 'WORKFLOW_OWNED_TREE_CLEANUP=PASS'
            } else {
              Write-Warning 'R36 ownership marker mismatch; protected tree not removed.'
            }
          }
