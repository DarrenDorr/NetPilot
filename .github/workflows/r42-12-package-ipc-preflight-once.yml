name: R42.12 ByeDPI Package IPC Preflight Once

on:
  push:
    branches:
      - feature/byedpi-package-ipc-r42-12
    paths:
      - 'src/NetPilot.Ipc/IpcProtocol.cs'
      - 'src/NetPilot.Ipc/IpcRequestValidator.cs'
      - 'src/NetPilot.Platform.Windows/WindowsPrivilegedServiceClient.cs'
      - 'src/NetPilot.Platform.Windows/WindowsByeDpiPackageProvisioning.cs'
      - 'src/NetPilot.Service/PrivilegedIpcWorker.cs'
      - 'src/NetPilot.Service/Program.cs'
      - 'tests/NetPilot.Core.Tests/IpcProtocolTests.cs'
      - 'tests/NetPilot.Platform.Windows.Tests/WindowsByeDpiPackageProvisioningBoundaryTests.cs'
      - 'tests/NetPilot.Platform.Windows.Tests/WindowsZapretStrategyRuntimeTests.cs'
      - 'security/native-admission/byedpi-package-ipc-r42-12.yaml'
      - 'scripts/security/r42-12-byedpi-package-ipc-check.sh'
      - 'docs/BYEDPI-PACKAGE-IPC-R42-12.md'
      - '.github/workflows/r42-12-package-ipc-preflight-once.yml'
  pull_request:
    branches:
      - feature/byedpi-verified-promotion-r42-11-1
    paths:
      - 'src/NetPilot.Ipc/IpcProtocol.cs'
      - 'src/NetPilot.Ipc/IpcRequestValidator.cs'
      - 'src/NetPilot.Platform.Windows/WindowsPrivilegedServiceClient.cs'
      - 'src/NetPilot.Platform.Windows/WindowsByeDpiPackageProvisioning.cs'
      - 'src/NetPilot.Service/PrivilegedIpcWorker.cs'
      - 'src/NetPilot.Service/Program.cs'
      - 'tests/NetPilot.Core.Tests/IpcProtocolTests.cs'
      - 'tests/NetPilot.Platform.Windows.Tests/WindowsByeDpiPackageProvisioningBoundaryTests.cs'
      - 'tests/NetPilot.Platform.Windows.Tests/WindowsZapretStrategyRuntimeTests.cs'
      - 'security/native-admission/byedpi-package-ipc-r42-12.yaml'
      - 'scripts/security/r42-12-byedpi-package-ipc-check.sh'
      - 'docs/BYEDPI-PACKAGE-IPC-R42-12.md'
      - '.github/workflows/r42-12-package-ipc-preflight-once.yml'

permissions:
  contents: read

jobs:
  managed-boundary:
    name: Enforce fail-closed ByeDPI package IPC boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: R42.11.1 parent fail-closed guard
        run: bash scripts/security/r42-11-1-byedpi-verified-promotion-check.sh

      - name: R42.12 fail-closed package IPC guard
        run: bash scripts/security/r42-12-byedpi-package-ipc-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore NetPilot.sln

      - name: Build full solution
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Run focused IPC and operation-policy tests
        run: >-
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj
          --configuration Release
          --no-build
          --filter 'FullyQualifiedName~IpcProtocolTests|FullyQualifiedName~OperationPolicyTests'

      - name: Boundary marker
        run: |
          cat r42-12-package-ipc-guard-evidence.txt
          echo 'R42_12_PACKAGE_IPC=PRESENT_FAIL_CLOSED'
          echo 'R42_12_LIVE_NETWORK_ACQUISITION=NOT_ADMITTED'
          echo 'R42_12_PACKAGE_MUTATION=BLOCK'
          echo 'R42_12_NATIVE_EXECUTION=NOT_IMPLEMENTED'
          echo 'R42_12_PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R42_12_MANAGED_BOUNDARY_PASS_BLOCK'

      - name: Upload text-only R42.12 guard evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: byedpi-r42-12-package-ipc-evidence
          path: r42-12-package-ipc-guard-evidence.txt
          if-no-files-found: error
          retention-days: 14

  windows-contract-tests:
    name: Verify Windows package IPC remains non-executing and no-admit
    runs-on: windows-2022
    timeout-minutes: 20
    needs: managed-boundary

    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore NetPilot.sln

      - name: Build service and Windows tests
        shell: pwsh
        run: |
          dotnet build src/NetPilot.Service/NetPilot.Service.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj --configuration Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run focused R42.12 Windows boundary tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet test tests/NetPilot.Platform.Windows.Tests/NetPilot.Platform.Windows.Tests.csproj `
            --configuration Release `
            --no-build `
            --filter "FullyQualifiedName~WindowsByeDpiPackageProvisioningBoundaryTests|FullyQualifiedName~WindowsZapretStrategyRuntimeTests"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) {
            throw 'R42.12 unexpectedly launched ciadpi.'
          }
          Write-Host 'R42_12_WINDOWS_PACKAGE_IPC=PASS_FAIL_CLOSED'
          Write-Host 'R42_12_LIVE_NETWORK_ACQUISITION=NOT_PERFORMED'
          Write-Host 'R42_12_NATIVE_EXECUTION=NOT_PERFORMED'
          Write-Host 'R42_12_PRODUCTION_ADMISSION=BLOCK'
