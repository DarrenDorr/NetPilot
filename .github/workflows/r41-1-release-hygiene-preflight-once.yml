name: R41.1 Release Hygiene Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r41-1-release-hygiene-preflight-once.yml'

permissions:
  contents: read

env:
  NETPILOT_R41_1_SHA: fa2e2bcb055a7181c93b14e42cde2cd28457c159

jobs:
  policy-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R41.1 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R41_1_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkpoint and fail-closed release hygiene
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NETPILOT_R41_1_SHA"
          bash scripts/security/r41-1-release-metadata-hygiene-check.sh
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Restore, build and Core tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build
          echo 'R41_1_LINUX_BUILD_TEST=PASS'
          echo 'R41_1_NATIVE_EXECUTION_TESTED=False'
          echo 'PRODUCTION_ADMISSION=BLOCK'

  windows-installer:
    runs-on: windows-2025
    steps:
      - name: Checkout exact R41.1 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R41_1_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkpoint
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R41_1_SHA) { throw 'R41.1 checkpoint drift.' }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) { throw 'Unexpected ByeDPI process before R41.1 installer build.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Compile real Windows installer with pinned Inno identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -File scripts/build-installer.ps1 -Version '0.1.0-alpha-r41-1' -VersionInfoVersion '0.1.0.0'
          $setup = Get-ChildItem -LiteralPath artifacts/installer -Filter 'NetPilot-Setup-0.1.0-alpha-r41-1-x64.exe' -File | Select-Object -First 1
          if ($null -eq $setup) { throw 'R41.1 installer output missing.' }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) { throw 'R41.1 installer build unexpectedly executed ByeDPI.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash.ToLowerInvariant()
          Write-Host "R41_1_INSTALLER_SHA256=$hash"
          Write-Host 'R41_1_WINDOWS_INSTALLER_COMPILE=PASS'
          Write-Host 'R41_1_NATIVE_EXECUTION_TESTED=False'
          Write-Host 'PRODUCTION_ADMISSION=BLOCK'
          Write-Host 'RESULT=R41_1_WINDOWS_INSTALLER_PASS_BLOCK'
