name: Native Candidate DPIBreak Hardened Patchset Source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-dpibreak-windows-hardening-source.yml"
      - "security/native-admission/patches/dpibreak-r28/**"
      - "security/native-admission/dpibreak-windows-hardening-r28.4.yaml"
      - "security/native-admission/dpibreak-v0.6.2-candidate.yaml"
      - "security/native-admission/dpibreak-v0.6.2-netpilot-fork-candidate.yaml"
      - "docs/DPIBREAK-PRIVILEGED-BOUNDARY-R28.4.md"

permissions:
  contents: read

jobs:
  source-hardening:
    name: Apply reviewed lifecycle, packet and executable-selection patches without candidate execution
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact DPIBreak v0.6.2 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dilluti0n/dpibreak
          ref: 334285b60aabd5a32a83a65211ac60bce968b211
          fetch-depth: 1
          path: dpibreak
          persist-credentials: false

      - name: Materialize exact Git patches and verify source identities
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch
          test "$(git -C dpibreak rev-parse HEAD)" = "334285b60aabd5a32a83a65211ac60bce968b211"
          test "$(git -C dpibreak rev-parse 'HEAD^{tree}')" = "7e95a17933fe9fda521865b1317c4f9f75d6c58c"

          patch1='security/native-admission/patches/dpibreak-r28/0001-remove-global-windivert-service-stop.patch'
          patch2='security/native-admission/patches/dpibreak-r28/0002-always-revalidate-clienthello.patch'
          patch3='security/native-admission/patches/dpibreak-r28/0003-disable-custom-nft-executable.patch'
          test "$(git -C netpilot rev-parse "HEAD:$patch1")" = "3f731650c83e56f717a7709084fd5873e7cb99eb"
          test "$(git -C netpilot rev-parse "HEAD:$patch2")" = "46f70538b5d5ea05573f22f83fd0e071c7bed489"
          test "$(git -C netpilot rev-parse "HEAD:$patch3")" = "d27efdb337fabe15745832d00acbb6a039f7cb7c"

          git -C netpilot show "HEAD:$patch1" > scratch/0001.patch
          git -C netpilot show "HEAD:$patch2" > scratch/0002.patch
          git -C netpilot show "HEAD:$patch3" > scratch/0003.patch
          sha256sum scratch/0001.patch | awk '{print $1}' | tee evidence/patch-0001.sha256
          sha256sum scratch/0002.patch | awk '{print $1}' | tee evidence/patch-0002.sha256
          sha256sum scratch/0003.patch | awk '{print $1}' | tee evidence/patch-0003.sha256

      - name: Apply exact patchset and enforce source boundaries
        id: apply
        continue-on-error: true
        if: steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for patch in scratch/0001.patch scratch/0002.patch scratch/0003.patch; do
            git -C dpibreak apply --check "$GITHUB_WORKSPACE/$patch"
            git -C dpibreak apply "$GITHUB_WORKSPACE/$patch"
          done
          git -C dpibreak diff --check

          ! grep -R -Fq 'WinDivert::uninstall()' dpibreak/src dpibreak/crates/windivert/src
          ! grep -R -Fq 'CloseAction::Uninstall' dpibreak/src dpibreak/crates/windivert/src
          ! grep -R -Fq 'SERVICE_CONTROL_STOP' dpibreak/crates/windivert/src
          ! grep -R -Fq 'SC_MANAGER_ALL_ACCESS' dpibreak/crates/windivert/src
          ! grep -R -Fq 'OpenServiceA' dpibreak/crates/windivert/src/divert/mod.rs
          grep -Fq '_ = wd.close();' dpibreak/src/platform/windows.rs
          grep -Fq 'if let Err(e) = wd.close()' dpibreak/src/platform/windows.rs
          grep -Fq 'pub fn close(&mut self) -> WinResult<()>' dpibreak/crates/windivert/src/divert/mod.rs

          grep -Fq 'if !tls::is_client_hello(view.tcp.payload()) {' dpibreak/src/pkt.rs
          ! grep -Fq 'let is_filtered = platform::is_kernel_filtered_clienthello();' dpibreak/src/pkt.rs
          ! grep -Fq 'if !is_filtered && !tls::is_client_hello' dpibreak/src/pkt.rs

          grep -Fq 'let nft_command = String::from(DEFAULT_NFT_COMMAND);' dpibreak/src/opt.rs
          grep -Fq 'return Err(anyhow!("--nft-command is disabled in the NetPilot hardened build"));' dpibreak/src/opt.rs
          ! grep -Fq '"--nft-command" => { nft_command = take_value' dpibreak/src/opt.rs
          grep -Fq 'const DEFAULT_NFT_COMMAND: &str = "nft";' dpibreak/src/opt.rs

          grep -Fq 'TlsAlloc()' dpibreak/crates/windivert/src/divert/mod.rs
          grep -Fq 'WinDivert::network' dpibreak/src/platform/windows.rs

          git -C dpibreak diff -- \
            src/platform/windows.rs \
            crates/windivert/src/divert/mod.rs \
            src/pkt.rs \
            src/opt.rs > evidence/patched-source.diff

      - name: Produce text-only evidence
        if: always()
        shell: bash
        env:
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          patch1_sha256='not-produced'
          patch2_sha256='not-produced'
          patch3_sha256='not-produced'
          if [ -f evidence/patch-0001.sha256 ]; then patch1_sha256="$(cat evidence/patch-0001.sha256)"; fi
          if [ -f evidence/patch-0002.sha256 ]; then patch2_sha256="$(cat evidence/patch-0002.sha256)"; fi
          if [ -f evidence/patch-0003.sha256 ]; then patch3_sha256="$(cat evidence/patch-0003.sha256)"; fi
          {
            echo 'schema_version=4'
            echo 'scope=dpibreak-v0.6.2-netpilot-source-hardening-0001-0003'
            echo 'release_commit=334285b60aabd5a32a83a65211ac60bce968b211'
            echo 'release_tree=7e95a17933fe9fda521865b1317c4f9f75d6c58c'
            echo 'patch_0001_git_blob_sha1=3f731650c83e56f717a7709084fd5873e7cb99eb'
            echo 'patch_0002_git_blob_sha1=46f70538b5d5ea05573f22f83fd0e071c7bed489'
            echo 'patch_0003_git_blob_sha1=d27efdb337fabe15745832d00acbb6a039f7cb7c'
            echo "patch_0001_sha256=$patch1_sha256"
            echo "patch_0002_sha256=$patch2_sha256"
            echo "patch_0003_sha256=$patch3_sha256"
            echo "identity_outcome=$IDENTITY_OUTCOME"
            echo "apply_and_source_boundary_outcome=$APPLY_OUTCOME"
            echo 'global_windivert_service_stop_removed=true'
            echo 'win_divert_issue_406_source_mitigation_scope=true'
            echo 'clienthello_userspace_revalidation_always_enabled=true'
            echo 'nfqueue_gso_continuation_fail_safe_reject_to_normal_accept_path=true'
            echo 'linux_user_selectable_nft_executable_surface_closed=true'
            echo 'win_divert_issue_408_kernel_driver_blocker_closed=false'
            echo 'tls_slot_lifecycle_closed=false'
            echo 'candidate_built=false'
            echo 'candidate_binary_executed=false'
            echo 'windivert_driver_installed=false'
            echo 'windivert_driver_loaded=false'
            echo 'nfqueue_enabled=false'
            echo 'firewall_changed=false'
            echo 'admission_effect=NONE'
            echo 'release_gate=BLOCK'
          } > evidence/source-hardening-summary.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS-dpibreak-source-hardening.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dpibreak-r28-source-hardening-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce source-only hardening gate
        if: always()
        shell: bash
        env:
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          test "$IDENTITY_OUTCOME" = 'success'
          test "$APPLY_OUTCOME" = 'success'
