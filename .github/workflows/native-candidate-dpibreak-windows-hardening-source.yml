name: Native Candidate DPIBreak Windows Hardening Source

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-dpibreak-windows-hardening-source.yml"
      - "security/native-admission/patches/dpibreak-r28/**"
      - "security/native-admission/dpibreak-windows-hardening-r28.4.yaml"
      - "security/native-admission/dpibreak-v0.6.2-candidate.yaml"
      - "docs/DPIBREAK-PRIVILEGED-BOUNDARY-R28.4.md"

permissions:
  contents: read

jobs:
  source-hardening:
    name: Apply reviewed Windows lifecycle patch without building or executing candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact DPIBreak v0.6.2 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: dilluti0n/dpibreak
          ref: 334285b60aabd5a32a83a65211ac60bce968b211
          fetch-depth: 1
          path: dpibreak
          persist-credentials: false

      - name: Materialize exact Git patch and verify source identities
        id: identity
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence scratch
          test "$(git -C dpibreak rev-parse HEAD)" = "334285b60aabd5a32a83a65211ac60bce968b211"
          test "$(git -C dpibreak rev-parse 'HEAD^{tree}')" = "7e95a17933fe9fda521865b1317c4f9f75d6c58c"
          patch_path='security/native-admission/patches/dpibreak-r28/0001-remove-global-windivert-service-stop.patch'
          test "$(git -C netpilot rev-parse "HEAD:$patch_path")" = "3b0cf8644b58ca924cfe616c2907b02e7b42497f"
          git -C netpilot show "HEAD:$patch_path" > scratch/0001.patch
          patch_sha256="$(sha256sum scratch/0001.patch | awk '{print $1}')"
          printf '%s\n' "$patch_sha256" | tee evidence/patch-0001.sha256

      - name: Apply exact lifecycle patch and enforce source boundary
        id: apply
        continue-on-error: true
        if: steps.identity.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git -C dpibreak apply --check "$GITHUB_WORKSPACE/scratch/0001.patch"
          git -C dpibreak apply "$GITHUB_WORKSPACE/scratch/0001.patch"
          git -C dpibreak diff --check

          # The patched candidate must not retain an app-controlled global
          # WinDivert service stop/uninstall surface.
          ! grep -R -Fq 'WinDivert::uninstall()' dpibreak/src dpibreak/crates/windivert/src
          ! grep -R -Fq 'CloseAction::Uninstall' dpibreak/src dpibreak/crates/windivert/src
          ! grep -R -Fq 'SERVICE_CONTROL_STOP' dpibreak/crates/windivert/src
          ! grep -R -Fq 'SC_MANAGER_ALL_ACCESS' dpibreak/crates/windivert/src
          ! grep -R -Fq 'OpenServiceA' dpibreak/crates/windivert/src/divert/mod.rs
          grep -Fq '_ = wd.close();' dpibreak/src/platform/windows.rs
          grep -Fq 'if let Err(e) = wd.close()' dpibreak/src/platform/windows.rs
          grep -Fq 'pub fn close(&mut self) -> WinResult<()>' dpibreak/crates/windivert/src/divert/mod.rs

          # This patch intentionally does not claim to solve the separate
          # TlsAlloc lifecycle or kernel-driver issue #408.
          grep -Fq 'TlsAlloc()' dpibreak/crates/windivert/src/divert/mod.rs

          git -C dpibreak diff -- src/platform/windows.rs crates/windivert/src/divert/mod.rs > evidence/patched-source.diff

      - name: Produce text-only evidence
        if: always()
        shell: bash
        env:
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          patch_sha256='not-produced'
          if [ -f evidence/patch-0001.sha256 ]; then
            patch_sha256="$(cat evidence/patch-0001.sha256)"
          fi
          {
            echo 'schema_version=1'
            echo 'scope=dpibreak-v0.6.2-windows-shared-service-source-hardening'
            echo 'release_commit=334285b60aabd5a32a83a65211ac60bce968b211'
            echo 'release_tree=7e95a17933fe9fda521865b1317c4f9f75d6c58c'
            echo 'patch_0001_git_blob_sha1=3b0cf8644b58ca924cfe616c2907b02e7b42497f'
            echo "patch_0001_sha256=$patch_sha256"
            echo "identity_outcome=$IDENTITY_OUTCOME"
            echo "apply_and_source_boundary_outcome=$APPLY_OUTCOME"
            echo 'global_windivert_service_stop_removed=true'
            echo 'win_divert_issue_406_source_mitigation_scope=true'
            echo 'win_divert_issue_408_kernel_driver_blocker_closed=false'
            echo 'tls_slot_lifecycle_closed=false'
            echo 'candidate_built=false'
            echo 'candidate_binary_executed=false'
            echo 'windivert_driver_installed=false'
            echo 'windivert_driver_loaded=false'
            echo 'admission_effect=NONE'
            echo 'release_gate=BLOCK'
          } > evidence/source-hardening-summary.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS-dpibreak-windows-hardening-source.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dpibreak-r28-windows-hardening-source-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce source-only hardening gate
        if: always()
        shell: bash
        env:
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          test "$IDENTITY_OUTCOME" = 'success'
          test "$APPLY_OUTCOME" = 'success'
