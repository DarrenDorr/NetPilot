name: R42.7 ByeDPI Acquisition Trust Preflight Once

on:
  pull_request:
    branches:
      - feature/byedpi-immutable-distribution-r42-6
    paths:
      - 'src/NetPilot.Updater/ByeDpiAcquisitionTrustPolicy.cs'
      - 'tests/NetPilot.Core.Tests/ByeDpiAcquisitionTrustPolicyTests.cs'
      - 'security/native-admission/byedpi-acquisition-trust-r42-7.yaml'
      - 'scripts/security/r42-7-byedpi-acquisition-trust-check.sh'
      - 'docs/BYEDPI-ACQUISITION-TRUST-R42-7.md'
      - '.github/workflows/r42-7-acquisition-trust-preflight-once.yml'

permissions:
  contents: read

jobs:
  managed-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: R42.7 fail-closed boundary guard
        run: bash scripts/security/r42-7-byedpi-acquisition-trust-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore NetPilot.sln

      - name: Build full solution
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Run focused R42.7 trust-policy tests
        run: >-
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj
          --configuration Release
          --no-build
          --filter FullyQualifiedName~ByeDpiAcquisitionTrustPolicyTests

      - name: Boundary marker
        run: |
          echo 'R42_7_NATIVE_EXECUTION_TESTED=False'
          echo 'R42_7_PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R42_7_PREFLIGHT_PASS_BLOCK'
