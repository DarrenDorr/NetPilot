name: R42.8 ByeDPI Metadata Parser Preflight Once

on:
  push:
    branches:
      - feature/byedpi-metadata-parser-r42-8
    paths:
      - 'src/NetPilot.Updater/GithubByeDpiReleaseParser.cs'
      - 'src/NetPilot.Updater/ByeDpiTransportResponsePolicy.cs'
      - 'tests/NetPilot.Core.Tests/GithubByeDpiReleaseParserTests.cs'
      - 'tests/NetPilot.Core.Tests/ByeDpiTransportResponsePolicyTests.cs'
      - 'security/native-admission/byedpi-metadata-parser-r42-8.yaml'
      - 'scripts/security/r42-8-byedpi-metadata-parser-check.sh'
      - 'docs/BYEDPI-METADATA-PARSER-R42-8.md'
      - '.github/workflows/r42-8-metadata-parser-preflight-once.yml'
  pull_request:
    branches:
      - feature/byedpi-acquisition-trust-r42-7
    paths:
      - 'src/NetPilot.Updater/GithubByeDpiReleaseParser.cs'
      - 'src/NetPilot.Updater/ByeDpiTransportResponsePolicy.cs'
      - 'tests/NetPilot.Core.Tests/GithubByeDpiReleaseParserTests.cs'
      - 'tests/NetPilot.Core.Tests/ByeDpiTransportResponsePolicyTests.cs'
      - 'security/native-admission/byedpi-metadata-parser-r42-8.yaml'
      - 'scripts/security/r42-8-byedpi-metadata-parser-check.sh'
      - 'docs/BYEDPI-METADATA-PARSER-R42-8.md'
      - '.github/workflows/r42-8-metadata-parser-preflight-once.yml'

permissions:
  contents: read

jobs:
  managed-preflight:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch or PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: R42.8 fail-closed parser/response guard
        run: bash scripts/security/r42-8-byedpi-metadata-parser-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore NetPilot.sln

      - name: Build full solution
        run: dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Run focused R42.8 parser/response tests
        run: >-
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj
          --configuration Release
          --no-build
          --filter 'FullyQualifiedName~GithubByeDpiReleaseParserTests|FullyQualifiedName~ByeDpiTransportResponsePolicyTests'

      - name: Boundary marker
        run: |
          echo 'R42_8_HTTP_TRANSPORT=NOT_IMPLEMENTED'
          echo 'R42_8_NETWORK_ACQUISITION=NOT_IMPLEMENTED'
          echo 'R42_8_NATIVE_EXECUTION_TESTED=False'
          echo 'R42_8_PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R42_8_PREFLIGHT_PASS_BLOCK'
