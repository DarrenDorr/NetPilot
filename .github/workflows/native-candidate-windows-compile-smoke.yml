name: Native Candidate Windows Compile Smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-windows-compile-smoke.yml"
      - "scripts/security/install-cygwin-r28.ps1"
      - "security/native-admission/patches/zapret2-r28/**"
      - "docs/ZAPRET2-*.md"

permissions:
  contents: read

jobs:
  zapret2-windows-x64-compile-smoke:
    name: Compile patched winws2 x64 without execution
    runs-on: windows-2025
    timeout-minutes: 25

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf input

      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Checkout exact LuaJIT source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: openresty/luajit2
          ref: dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc
          fetch-depth: 1
          path: luajit2
          persist-credentials: false

      - name: Verify anchors and apply reviewed NetPilot patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C zapret2 rev-parse HEAD).Trim() -ne '4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d') { throw 'Unexpected zapret2 commit' }
          if ((git -C zapret2 rev-parse HEAD^).Trim() -ne '221d7dff24bfec0cd5ac0a5070b8acef2008af3d') { throw 'Unexpected zapret2 parent' }
          if ((git -C luajit2 rev-parse HEAD).Trim() -ne 'dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc') { throw 'Unexpected LuaJIT commit' }

          $patches = @(
            '0001-explicit-conntrack-feed-result.patch',
            '0002-bounded-conntrack-resource-result.patch',
            '0003-bounded-delayed-queue-bytes.patch'
          )
          foreach ($patch in $patches) {
            $path = Join-Path $PWD "netpilot\security\native-admission\patches\zapret2-r28\$patch"
            git -C zapret2 apply --check $path
            if ($LASTEXITCODE -ne 0) { throw "Patch check failed: $patch" }
            git -C zapret2 apply $path
            if ($LASTEXITCODE -ne 0) { throw "Patch apply failed: $patch" }
          }

      - name: Install exact hash-pinned Cygwin compiler dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & .\netpilot\scripts\security\install-cygwin-r28.ps1 | Out-File -FilePath cygwin-bootstrap.txt -Encoding ascii
          if ($LASTEXITCODE -ne 0) { throw 'Exact Cygwin bootstrap failed' }

      - name: Build exact LuaJIT to isolated staging directory
        id: luajit_build
        continue-on-error: true
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export WORK="$(pwd -P)" &&
          export PATH=/usr/bin:/bin &&
          export CYGWIN_NOWINPATH=1 &&
          export DEPS="$WORK/deps" &&
          case "$WORK" in /cygdrive/*) ;; *) echo "Unexpected Cygwin physical path: $WORK" >&2; exit 1 ;; esac &&
          test -d "$WORK/luajit2" &&
          test "$(command -v make)" = "/usr/bin/make" &&
          test "$(command -v gcc)" = "/usr/bin/gcc" &&
          mkdir -p "$WORK/evidence" "$DEPS" &&
          printf 'work=%s\nmake=%s\ngcc=%s\n' "$WORK" "$(/usr/bin/make --version | head -n1)" "$(/usr/bin/gcc --version | head -n1)" > "$WORK/evidence/cygwin-build-tools.txt" &&
          cd "$WORK/luajit2" &&
          /usr/bin/make clean 2>&1 | tee "$WORK/evidence/luajit-clean.log" &&
          /usr/bin/make BUILDMODE=static HOST_CC=/usr/bin/gcc TARGET_CC=/usr/bin/gcc XCFLAGS="-DLUAJIT_USE_SYSMALLOC -DLUAJIT_DISABLE_FFI -ffat-lto-objects" TARGET_CFLAGS="-Os -flto=auto -ffunction-sections -fdata-sections" TARGET_LDFLAGS="-Wl,--gc-sections -flto=auto" 2>&1 | tee "$WORK/evidence/luajit-build.log" &&
          /usr/bin/make install PREFIX=/usr/local DESTDIR="$DEPS" 2>&1 | tee "$WORK/evidence/luajit-install.log" &&
          test -f "$DEPS/usr/local/lib/libluajit-5.1.a"

      - name: Build patched winws2 without running it
        id: winws_build
        if: steps.luajit_build.outcome == 'success'
        continue-on-error: true
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: >-
          export WORK="$(pwd -P)" &&
          export PATH=/usr/bin:/bin &&
          export CYGWIN_NOWINPATH=1 &&
          export DEPS="$WORK/deps/usr/local" &&
          case "$WORK" in /cygdrive/*) ;; *) echo "Unexpected Cygwin physical path: $WORK" >&2; exit 1 ;; esac &&
          test -d "$WORK/zapret2" &&
          test "$(command -v make)" = "/usr/bin/make" &&
          test "$(command -v gcc)" = "/usr/bin/gcc" &&
          mkdir -p "$WORK/evidence" &&
          cd "$WORK/zapret2" &&
          export CC=/usr/bin/gcc &&
          export CFLAGS="-DZAPRET_GH_VER=netpilot-r28-windows-compile-smoke -DZAPRET_GH_HASH=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d" &&
          /usr/bin/make -C nfq2 clean 2>&1 | tee "$WORK/evidence/winws-clean.log" &&
          /usr/bin/make -C nfq2 cygwin CC=/usr/bin/gcc LUA_JIT=1 LUA_CFLAGS="-I$DEPS/include/luajit-2.1" LUA_LIB="-L$DEPS/lib -lluajit-5.1" 2>&1 | tee "$WORK/evidence/winws-build.log" &&
          test -f nfq2/winws2.exe

      - name: Inventory result and remove candidate binary
        if: always()
        shell: pwsh
        env:
          LUAJIT_BUILD_OUTCOME: ${{ steps.luajit_build.outcome }}
          WINWS_BUILD_OUTCOME: ${{ steps.winws_build.outcome }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          if (Test-Path cygwin-bootstrap.txt) { Move-Item -LiteralPath cygwin-bootstrap.txt -Destination evidence\cygwin-bootstrap.txt -Force }

          $exe = Join-Path $PWD 'zapret2\nfq2\winws2.exe'
          $exeHash = 'not-produced'
          $exeSize = 0
          $fileVersion = ''
          $productVersion = ''
          $signatureStatus = 'not-produced'
          $signer = ''
          if (Test-Path $exe) {
            $exeHash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
            $exeSize = (Get-Item $exe).Length
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
            $fileVersion = $info.FileVersion
            $productVersion = $info.ProductVersion
            $sig = Get-AuthenticodeSignature -FilePath $exe
            $signatureStatus = $sig.Status.ToString()
            if ($sig.SignerCertificate) { $signer = $sig.SignerCertificate.Subject }
          }

          $cygwinDll = 'C:\cygwin\bin\cygwin1.dll'
          $cygwinHash = if (Test-Path $cygwinDll) { (Get-FileHash -Algorithm SHA256 $cygwinDll).Hash.ToLowerInvariant() } else { 'missing' }
          $cygwinSize = if (Test-Path $cygwinDll) { (Get-Item $cygwinDll).Length } else { 0 }

          @(
            'schema_version=3'
            'scope=windows-x64-compile-smoke-only'
            'candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0003'
            "luajit_build_outcome=$env:LUAJIT_BUILD_OUTCOME"
            "winws_build_outcome=$env:WINWS_BUILD_OUTCOME"
            'zapret2_commit=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d'
            'luajit_commit=dcc9c9ee67e1a5d3d636bd7745e95ddb4a1c70bc'
            'runner=windows-2025'
            'cygwin_setup_version=2.940'
            'cygwin_setup_sha512=fc46e3ead0312ea632251c16334b23caab31c9b38db30db4e5418b43ffeec5c003cc867b4166c8222a622ad107660e2ce6e3d855499d08e695dd13010f43a396'
            'toolchain_path=/usr/bin:/bin'
            'cygwin_site=https://mirrors.kernel.org/sourceware/cygwin/'
            "winws2_sha256=$exeHash"
            "winws2_size=$exeSize"
            "winws2_file_version=$fileVersion"
            "winws2_product_version=$productVersion"
            "winws2_authenticode_status=$signatureStatus"
            "winws2_signer=$signer"
            "cygwin1_dll_sha256=$cygwinHash"
            "cygwin1_dll_size=$cygwinSize"
            'winws2_executed=false'
            'windivert_present=false'
            'windivert_driver_installed=false'
          ) | Out-File -FilePath evidence\windows-x64-compile-smoke.txt -Encoding ascii

          if (Test-Path $exe) { Remove-Item -Force $exe }
          if (Test-Path $exe) { throw 'Candidate binary was not removed' }

          $sumLines = Get-ChildItem evidence -File | Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $sumLines | Out-File -FilePath evidence\SHA256SUMS.txt -Encoding ascii

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-windows-x64-compile-smoke-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce build success after evidence upload
        if: always()
        shell: pwsh
        env:
          LUAJIT_BUILD_OUTCOME: ${{ steps.luajit_build.outcome }}
          WINWS_BUILD_OUTCOME: ${{ steps.winws_build.outcome }}
        run: |
          if ($env:LUAJIT_BUILD_OUTCOME -ne 'success') { throw 'LuaJIT build did not succeed' }
          if ($env:WINWS_BUILD_OUTCOME -ne 'success') { throw 'winws2 build did not succeed' }
