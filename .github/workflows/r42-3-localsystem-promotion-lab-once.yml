name: R42.3 LocalSystem Promotion Rollback Lab Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r42-3-localsystem-promotion-lab-once.yml'

permissions:
  contents: read

concurrency:
  group: netpilot-r42-3-localsystem-promotion-lab
  cancel-in-progress: false

env:
  NETPILOT_R42_3_SHA: ec8e6dad28c39387c632e24b05adecaaf16aa8c6

jobs:
  localsystem-promotion-rollback:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact R42.3 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R42_3_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Assert clean hosted boundary and create lab marker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R42_3_SHA) { throw 'R42.3 checkpoint drift.' }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) { throw 'Unexpected ciadpi process before R42.3 LocalSystem lab.' }

          $productRoot = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $productRoot) { throw 'R42.3 LocalSystem lab refuses a pre-existing Program Files\NetPilot tree.' }

          $token = "r42-3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $productRoot | Out-Null
          Set-Content -LiteralPath (Join-Path $productRoot '.r42-3-lab-owned') -Value $token -NoNewline
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "LAB_OWNERSHIP_TOKEN=$token" | Set-Content -LiteralPath evidence\boundary.txt
          "NETPILOT_R42_3_SHA=$env:NETPILOT_R42_3_SHA" | Add-Content -LiteralPath evidence\boundary.txt
          'PREEXISTING_PRODUCT_ROOT=False' | Add-Content -LiteralPath evidence\boundary.txt
          'NATIVE_EXECUTION_TESTED=False' | Add-Content -LiteralPath evidence\boundary.txt
          'PRODUCTION_ADMISSION=BLOCK' | Add-Content -LiteralPath evidence\boundary.txt

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Build isolated synthetic promotion lab host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish tools\NetPilot.ByeDpiR42PromotionLab\NetPilot.ByeDpiR42PromotionLab.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            --output .labpublish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $published = Resolve-Path '.labpublish\NetPilot.ByeDpiR42PromotionLab.exe'
          $tempExe = "C:\Windows\Temp\NetPilotR423Lab-$env:GITHUB_RUN_ID.exe"
          Copy-Item -LiteralPath $published -Destination $tempExe -Force
          "LAB_EXE_SHA256=$((Get-FileHash -Algorithm SHA256 -LiteralPath $tempExe).Hash.ToLowerInvariant())" | Add-Content -LiteralPath evidence\boundary.txt

      - name: Execute production staging promotion and rollback APIs as LocalSystem
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $taskName = "NetPilot-R42-3-$env:GITHUB_RUN_ID"
          $labExe = "C:\Windows\Temp\NetPilotR423Lab-$env:GITHUB_RUN_ID.exe"
          $resultPath = "C:\Windows\Temp\NetPilotR423Result-$env:GITHUB_RUN_ID.txt"
          $token = "r42-3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $start = (Get-Date).AddMinutes(5).ToString('HH:mm')
          $taskCommand = "$labExe $resultPath $token"

          & schtasks.exe /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $start /RU SYSTEM /RL HIGHEST /F | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create R42.3 LocalSystem scheduled task.' }
          & schtasks.exe /Run /TN $taskName | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to start R42.3 LocalSystem scheduled task.' }

          $content = $null
          foreach ($attempt in 1..120) {
            if (Test-Path -LiteralPath $resultPath) {
              $content = Get-Content -LiteralPath $resultPath -Raw
              if ($content -match 'RESULT=') { break }
            }
            Start-Sleep -Seconds 1
          }

          if ([string]::IsNullOrWhiteSpace($content) -or $content -notmatch 'RESULT=') {
            $info = Get-ScheduledTaskInfo -TaskName $taskName -ErrorAction SilentlyContinue
            if ($null -ne $info) { $info | Format-List * | Out-String | Write-Host }
            throw 'R42.3 LocalSystem lab did not produce terminal evidence.'
          }

          $content | Write-Host
          Copy-Item -LiteralPath $resultPath -Destination evidence\localsystem-result.txt -Force

          foreach ($marker in @(
            'IDENTITY_LOCALSYSTEM=PASS',
            'LAB_OWNERSHIP_MARKER=PASS',
            'INSTALL_ATOMIC_PROMOTION=PASS',
            'INSTALL_POST_MOVE_REVERIFY=PASS',
            'UPGRADE_ATOMIC_PROMOTION=PASS',
            'RETAINED_PREVIOUS_IMMUTABLE=PASS',
            'PROTECTED_STATE_BEFORE_ROLLBACK=PASS',
            'TARGET_FREE_ROLLBACK=PASS',
            'PROTECTED_STATE_AFTER_ROLLBACK=PASS',
            'CLEAN_RECOVERY_IDEMPOTENT=PASS',
            'CANONICAL_MANAGED_LAYOUT=PASS',
            'SYNTHETIC_PAYLOAD_NOT_PE=PASS',
            'SERVICE_IPC_WIRING=ABSENT',
            'NATIVE_EXECUTION_TESTED=False',
            'PRODUCTION_ADMISSION=BLOCK',
            'RESULT=R42_3_LOCALSYSTEM_PROMOTION_ROLLBACK_PASS_BLOCK'
          )) {
            if (-not $content.Contains($marker, [StringComparison]::Ordinal)) {
              throw "Missing required R42.3 LocalSystem evidence marker: $marker"
            }
          }

          $info = Get-ScheduledTaskInfo -TaskName $taskName
          if ($info.LastTaskResult -ne 0) { throw "R42.3 LocalSystem task exit code was $($info.LastTaskResult)." }

      - name: Verify real Program Files managed evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) { throw 'R42.3 LocalSystem lab unexpectedly launched ciadpi.' }

          $managedBase = Join-Path $env:ProgramFiles 'NetPilot\Engines\Managed\byedpi'
          $stateRoot = Join-Path $managedBase '.state'
          $v1 = Join-Path $managedBase '0.17.2\x64'
          $v2 = Join-Path $managedBase '0.17.3\x64'
          foreach ($path in @($managedBase, $stateRoot, $v1, $v2)) {
            if (-not (Test-Path -LiteralPath $path -PathType Container)) { throw "Missing R42.3 managed evidence path: $path" }
          }

          $stateFile = Join-Path $stateRoot 'package-state.json'
          if (-not (Test-Path -LiteralPath $stateFile -PathType Leaf)) { throw 'Protected package-state.json is missing.' }
          $state = Get-Content -LiteralPath $stateFile -Raw
          if ($state -notmatch '0\.17\.2' -or $state -notmatch '0\.17\.3') { throw 'Protected state does not contain rollback-swapped versions.' }

          foreach ($root in @($v1, $v2)) {
            $syntheticExe = Join-Path $root 'bin\ciadpi.exe'
            if (-not (Test-Path -LiteralPath $syntheticExe -PathType Leaf)) { throw "Synthetic ciadpi marker missing: $syntheticExe" }
            $bytes = [IO.File]::ReadAllBytes($syntheticExe)
            if ($bytes.Length -ge 2 -and $bytes[0] -eq 0x4D -and $bytes[1] -eq 0x5A) { throw 'R42.3 lab payload unexpectedly looks like PE.' }
          }

          $promotionJournals = @(Get-ChildItem -LiteralPath (Join-Path $stateRoot 'journal') -Filter '*.json' -File)
          if ($promotionJournals.Count -ne 0) { throw 'Completed R42.3 lab left promotion recovery journal residue.' }
          $stagingBase = Join-Path $env:ProgramFiles 'NetPilot\Engines\Staging\ByeDPI'
          $stagingTransactions = @(Get-ChildItem -LiteralPath $stagingBase -Directory | Where-Object { $_.Name -ne 'Journal' })
          if ($stagingTransactions.Count -ne 0) { throw 'Completed R42.3 lab left staged transaction residue.' }

          & icacls.exe $managedBase | Tee-Object -FilePath evidence\acl-managed.txt | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to capture managed ACL evidence.' }
          & icacls.exe $stateRoot | Tee-Object -FilePath evidence\acl-state.txt | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to capture state ACL evidence.' }
          & icacls.exe $v1 | Tee-Object -FilePath evidence\acl-v1.txt | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to capture v1 ACL evidence.' }
          & icacls.exe $v2 | Tee-Object -FilePath evidence\acl-v2.txt | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to capture v2 ACL evidence.' }

          'CIADPI_PROCESS_ABSENT=PASS' | Add-Content -LiteralPath evidence\boundary.txt
          'MANAGED_PROMOTION_JOURNAL_CLEAN=PASS' | Add-Content -LiteralPath evidence\boundary.txt
          'STAGING_TRANSACTION_RESIDUE=ABSENT' | Add-Content -LiteralPath evidence\boundary.txt
          'RESULT=R42_3_LOCALSYSTEM_HOSTED_EVIDENCE_PASS_BLOCK' | Add-Content -LiteralPath evidence\boundary.txt

      - name: Cleanup hosted lab state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $taskName = "NetPilot-R42-3-$env:GITHUB_RUN_ID"
          & schtasks.exe /End /TN $taskName 2>$null | Out-Null
          & schtasks.exe /Delete /TN $taskName /F 2>$null | Out-Null
          Remove-Item -LiteralPath "C:\Windows\Temp\NetPilotR423Lab-$env:GITHUB_RUN_ID.exe" -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath "C:\Windows\Temp\NetPilotR423Result-$env:GITHUB_RUN_ID.txt" -Force -ErrorAction SilentlyContinue

          $productRoot = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $productRoot) {
            $marker = Join-Path $productRoot '.r42-3-lab-owned'
            $expected = "r42-3-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
            if ((Test-Path -LiteralPath $marker) -and ((Get-Content -LiteralPath $marker -Raw).Trim() -eq $expected)) {
              Remove-Item -LiteralPath $productRoot -Recurse -Force
            } else {
              Write-Error 'Refusing to delete Program Files\NetPilot because the R42.3 ownership marker is missing or mismatched.'
            }
          }

          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) {
            Write-Error 'ciadpi process exists after R42.3 LocalSystem lab cleanup.'
          }

      - name: Upload R42.3 LocalSystem evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r42-3-localsystem-promotion-evidence
          path: evidence
          if-no-files-found: error
          retention-days: 3
