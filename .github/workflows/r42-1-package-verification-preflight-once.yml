name: R42.1 Package Verification Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r42-1-package-verification-preflight-once.yml'

permissions:
  contents: read

env:
  NETPILOT_R42_1_SHA: d3dbc2849aeb083d0280042f5d77d9146e096472

jobs:
  managed-verification:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R42.1 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R42_1_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify fail-closed boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NETPILOT_R42_1_SHA"
          bash scripts/security/r42-1-byedpi-package-verification-check.sh
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore

      - name: Run Core exact-manifest tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build
          echo 'R42_1_CORE_TESTS=PASS'
          echo 'R42_1_NATIVE_EXECUTION_TESTED=False'
          echo 'R42_1_PRODUCTION_ADMISSION=BLOCK'

  windows-protected-staging:
    runs-on: windows-2025
    steps:
      - name: Checkout exact R42.1 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R42_1_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact clean boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R42_1_SHA) { throw 'R42.1 checkpoint drift.' }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $root) { throw 'R42.1 refuses a pre-existing Program Files\NetPilot tree.' }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) { throw 'Unexpected ciadpi process before R42.1.' }

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Build synthetic staging lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools/NetPilot.ByeDpiR42_1StagingLab/NetPilot.ByeDpiR42_1StagingLab.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run protected staging and exact manifest lab
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $output = & dotnet run --project tools/NetPilot.ByeDpiR42_1StagingLab/NetPilot.ByeDpiR42_1StagingLab.csproj --configuration Release --no-build 2>&1
          $output | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'R42.1 staging lab failed.' }
          $text = $output -join "`n"
          foreach ($marker in @(
            'R42_1_EXACT_MANIFEST=PASS',
            'R42_1_PROTECTED_STAGING_ACL=PASS',
            'R42_1_HASH_DRIFT_REJECTED=PASS',
            'R42_1_EXTRA_FILE_REJECTED=PASS',
            'R42_1_USER_WRITABLE_ACL_REJECTED=PASS',
            'R42_1_NATIVE_EXECUTION_TESTED=False',
            'R42_1_PRODUCTION_ADMISSION=BLOCK',
            'RESULT=R42_1_PROTECTED_STAGING_VERIFICATION_PASS_BLOCK'
          )) {
            if (-not $text.Contains($marker, [StringComparison]::Ordinal)) { throw "Missing R42.1 marker: $marker" }
          }
          if (Get-Process -Name ciadpi -ErrorAction SilentlyContinue) { throw 'R42.1 unexpectedly launched ciadpi.' }
          if (Test-Path -LiteralPath (Join-Path $env:ProgramFiles 'NetPilot')) { throw 'R42.1 lab cleanup left Program Files\NetPilot.' }
          Write-Host 'R42_1_WINDOWS_SYNTHETIC_LAB=PASS'
          Write-Host 'RESULT=R42_1_PREFLIGHT_PASS_BLOCK'
