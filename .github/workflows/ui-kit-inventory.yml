name: UI Kit Inventory

on:
  push:
    branches: [ feature/byedpi-user-smoke-ui-r1 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: List approved UI Kit archive entries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Resolve-Path 'design/ui-kit/v1.1/NetPilot_UI_Kit_v1_1.zip'
          Add-Type -AssemblyName System.IO.Compression.FileSystem

          $bytes = [System.IO.File]::ReadAllBytes($archive)
          $offset = -1
          for ($i = 0; $i -le $bytes.Length - 4; $i++) {
            if ($bytes[$i] -eq 0x50 -and $bytes[$i + 1] -eq 0x4B -and $bytes[$i + 2] -eq 0x03 -and $bytes[$i + 3] -eq 0x04) {
              $offset = $i
              break
            }
          }
          if ($offset -lt 0) { throw 'ZIP local-header signature not found.' }

          $usableArchive = $archive
          if ($offset -gt 0) {
            Write-Host "UI_KIT_LEGACY_PREFIX_BYTES=$offset"
            $clean = Join-Path $env:RUNNER_TEMP 'NetPilot_UI_Kit_v1_1.clean.zip'
            $stream = [System.IO.File]::Create($clean)
            try { $stream.Write($bytes, $offset, $bytes.Length - $offset) }
            finally { $stream.Dispose() }
            $usableArchive = $clean
          }

          $zip = [System.IO.Compression.ZipFile]::OpenRead($usableArchive)
          try {
            $entries = $zip.Entries | ForEach-Object { $_.FullName } | Sort-Object
            $entries | Set-Content -Encoding utf8 ui-kit-inventory.txt
            $entries | Write-Host
          }
          finally { $zip.Dispose() }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ui-kit-inventory
          path: ui-kit-inventory.txt
          retention-days: 2
