name: Native Candidate Provenance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-provenance.yml"
      - "security/native-admission/**"
      - "docs/ENGINE-CANDIDATE-ADMISSION-R28.md"
      - "docs/ZAPRET2-*.md"

permissions:
  contents: read

jobs:
  zapret2-source-anchor:
    name: Verify zapret2 exact source anchor and patch series
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Verify immutable source relationship and narrow delta
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail

          expected_head="4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d"
          expected_parent="221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
          expected_tree="5c2a77786cc7089145abe2ca99bcc53a8ed7de15"

          actual_head="$(git rev-parse HEAD)"
          actual_parent="$(git rev-parse HEAD^)"
          actual_tree="$(git rev-parse 'HEAD^{tree}')"

          test "$actual_head" = "$expected_head"
          test "$actual_parent" = "$expected_parent"
          test "$actual_tree" = "$expected_tree"

          mapfile -t changed_files < <(git diff --name-only "$expected_parent" "$expected_head")
          test "${#changed_files[@]}" -eq 1
          test "${changed_files[0]}" = "nfq2/desync.c"

          grep -Fq 'goto reasm_cancel_rediscover;' nfq2/desync.c
          grep -Fq 'rdata_payload = dis->data_payload;' nfq2/desync.c
          grep -Fq 'rlen_payload = dis->len_payload;' nfq2/desync.c
          test -z "$(git status --porcelain)"

      - name: Verify and apply NetPilot patch 0001
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          patch_file="../netpilot/security/native-admission/patches/zapret2-r28/0001-explicit-conntrack-feed-result.patch"
          echo 'af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff  '"$patch_file" | sha256sum -c -
          git apply --check "$patch_file"
          mapfile -t patched_files < <(git apply --numstat "$patch_file" | awk '{print $3}' | sort)
          expected_files=("nfq2/conntrack.c" "nfq2/conntrack.h" "nfq2/desync.c" "nfq2/lua.c")
          test "${#patched_files[@]}" -eq "${#expected_files[@]}"
          for i in "${!expected_files[@]}"; do test "${patched_files[$i]}" = "${expected_files[$i]}"; done
          git apply "$patch_file"
          grep -Fq 'CTRACK_FEED_NONE = 0' nfq2/conntrack.h
          grep -Fq 'CTRACK_FEED_OK = 1' nfq2/conntrack.h

      - name: Verify and apply NetPilot patch 0002
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          patch_file="../netpilot/security/native-admission/patches/zapret2-r28/0002-bounded-conntrack-resource-result.patch"
          echo 'a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783  '"$patch_file" | sha256sum -c -
          git apply --check "$patch_file"
          mapfile -t patched_files < <(git apply --numstat "$patch_file" | awk '{print $3}' | sort)
          expected_files=("nfq2/conntrack.c" "nfq2/conntrack.h" "nfq2/desync.c")
          test "${#patched_files[@]}" -eq "${#expected_files[@]}"
          for i in "${!expected_files[@]}"; do test "${patched_files[$i]}" = "${expected_files[$i]}"; done
          git apply "$patch_file"
          grep -Fq 'CTRACK_FEED_RESOURCE_EXHAUSTED = 2' nfq2/conntrack.h
          grep -Fq 'ConntrackPoolSetMaxEntries' nfq2/conntrack.h
          grep -Fq 'HASH_COUNT(*pp) >= max_entries' nfq2/conntrack.c
          grep -Fq 'return CTRACK_FEED_RESOURCE_EXHAUSTED;' nfq2/conntrack.c
          grep -Fq 'feed_result == CTRACK_FEED_RESOURCE_EXHAUSTED' nfq2/desync.c
          grep -Fq 'ps->verdict = VERDICT_PASS;' nfq2/desync.c

      - name: Verify and apply NetPilot patch 0003
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          patch_file="../netpilot/security/native-admission/patches/zapret2-r28/0003-bounded-delayed-queue-bytes.patch"
          echo '33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68  '"$patch_file" | sha256sum -c -
          git apply --check "$patch_file"
          mapfile -t patched_files < <(git apply --numstat "$patch_file" | awk '{print $3}' | sort)
          expected_files=("nfq2/packet_queue.c" "nfq2/packet_queue.h")
          test "${#patched_files[@]}" -eq "${#expected_files[@]}"
          for i in "${!expected_files[@]}"; do test "${patched_files[$i]}" = "${expected_files[$i]}"; done
          git apply "$patch_file"
          grep -Fq 'size_t max_bytes;' nfq2/packet_queue.h
          grep -Fq 'size_t queued_bytes;' nfq2/packet_queue.h
          grep -Fq 'rawpacket_queue_set_max_bytes' nfq2/packet_queue.h
          grep -Fq 'len > SIZE_MAX - q->queued_bytes' nfq2/packet_queue.c
          grep -Fq 'new_queued_bytes > q->max_bytes' nfq2/packet_queue.c
          grep -Fq 'q->queued_bytes = new_queued_bytes;' nfq2/packet_queue.c

      - name: Verify and apply NetPilot patch 0004
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          patch_file="../netpilot/security/native-admission/patches/zapret2-r28/0004-explicit-daemon-stdio-redirection.patch"
          echo 'df4bef5487febac8c4b3a55c85e939fdd6f57fb7b481d80bcc7962498303e4d0  '"$patch_file" | sha256sum -c -
          git apply --check "$patch_file"
          mapfile -t patched_files < <(git apply --numstat "$patch_file" | awk '{print $3}' | sort)
          test "${#patched_files[@]}" -eq 1
          test "${patched_files[0]}" = "nfq2/sec.c"
          git apply "$patch_file"
          grep -Fq 'int nullfd = open("/dev/null", O_RDWR);' nfq2/sec.c
          grep -Fq 'nullfd != STDIN_FILENO' nfq2/sec.c
          grep -Fq 'dup2(STDIN_FILENO, STDOUT_FILENO)' nfq2/sec.c
          grep -Fq 'dup2(STDIN_FILENO, STDERR_FILENO)' nfq2/sec.c

      - name: Produce provenance evidence
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          mkdir -p ../evidence

          patch_0001="../netpilot/security/native-admission/patches/zapret2-r28/0001-explicit-conntrack-feed-result.patch"
          patch_0002="../netpilot/security/native-admission/patches/zapret2-r28/0002-bounded-conntrack-resource-result.patch"
          patch_0003="../netpilot/security/native-admission/patches/zapret2-r28/0003-bounded-delayed-queue-bytes.patch"
          patch_0004="../netpilot/security/native-admission/patches/zapret2-r28/0004-explicit-daemon-stdio-redirection.patch"

          {
            echo "schema_version=4"
            echo "candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0004"
            echo "repository=https://github.com/bol-van/zapret2"
            echo "head_commit=$(git rev-parse HEAD)"
            echo "parent_commit=$(git rev-parse HEAD^)"
            echo "tree=$(git rev-parse 'HEAD^{tree}')"
            echo "commit_message=$(git log -1 --pretty=%s)"
            echo "upstream_changed_files_begin"
            git diff --name-only HEAD^ HEAD
            echo "upstream_changed_files_end"
            echo "desync_c_upstream_sha256=54e3c9d03f62a844ee549e2ddc036c0253147c9aae67d937da8cc29c67a026bd"
            echo "netpilot_patch_0001_sha256=$(sha256sum "$patch_0001" | awk '{print $1}')"
            echo "netpilot_patch_0002_sha256=$(sha256sum "$patch_0002" | awk '{print $1}')"
            echo "netpilot_patch_0003_sha256=$(sha256sum "$patch_0003" | awk '{print $1}')"
            echo "netpilot_patch_0004_sha256=$(sha256sum "$patch_0004" | awk '{print $1}')"
            echo "patched_worktree_files_begin"
            git diff --name-only HEAD | sort
            echo "patched_worktree_files_end"
          } > ../evidence/zapret2-source-anchor.txt

          git diff --binary HEAD^ HEAD -- nfq2/desync.c > ../evidence/zapret2-uaf-fix.patch
          cp "$patch_0001" ../evidence/netpilot-0001-explicit-conntrack-feed-result.patch
          cp "$patch_0002" ../evidence/netpilot-0002-bounded-conntrack-resource-result.patch
          cp "$patch_0003" ../evidence/netpilot-0003-bounded-delayed-queue-bytes.patch
          cp "$patch_0004" ../evidence/netpilot-0004-explicit-daemon-stdio-redirection.patch
          git diff --binary HEAD > ../evidence/netpilot-patched-worktree.diff
          sha256sum ../evidence/* | sort > ../evidence/SHA256SUMS.txt

      - name: Upload provenance evidence only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-source-provenance
          path: evidence/
          if-no-files-found: error
          retention-days: 14
