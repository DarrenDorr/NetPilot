name: R40 Lifecycle Soak Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r40-lifecycle-soak-preflight-once.yml'

permissions:
  contents: read

concurrency:
  group: netpilot-r40-lifecycle-soak-preflight-once
  cancel-in-progress: false

env:
  NETPILOT_R40_SHA: e0bd52524f54f6963c8827d9f56da8c185331b45

jobs:
  linux-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact R40 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R40_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkpoint
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NETPILOT_R40_SHA"

      - name: Security boundaries through R40
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh
          bash scripts/security/r35-service-integration-boundary-check.sh
          bash scripts/security/r36-localsystem-lab-boundary-check.sh
          bash scripts/security/r37-crash-containment-boundary-check.sh
          bash scripts/security/r38-multiuser-lease-boundary-check.sh
          bash scripts/security/r39-restart-reconciliation-boundary-check.sh
          bash scripts/security/r40-lifecycle-soak-boundary-check.sh

  windows-parse-build-tests:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout exact R40 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R40_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify exact checkpoint
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:NETPILOT_R40_SHA) { throw 'R40 checkpoint drift.' }

      - name: Parse soak script without executing it
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tokens = $null
          $errors = $null
          [Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts\security\r40-lifecycle-soak.ps1'),
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw 'R40 PowerShell parse failed.'
          }
          Write-Host 'R40_POWERSHELL_PARSE=PASS'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Build hardened lab components and run Windows tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools\NetPilot.ByeDpiR39RestartClient\NetPilot.ByeDpiR39RestartClient.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests\NetPilot.Platform.Windows.Tests\NetPilot.Platform.Windows.Tests.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
