name: Native Candidate Static and Sanitizer Compile

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-candidate-static-sanitizer-compile.yml"
      - "security/native-admission/patches/zapret2-r28/**"
      - "security/native-admission/zapret2-v1.0.6-plus-uaf-fix-fork-candidate.yaml"
      - "docs/ZAPRET2-*.md"

permissions:
  contents: read

jobs:
  zapret2-linux-static-sanitizer-compile:
    name: Analyze and sanitizer-compile patched zapret2 without execution
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout NetPilot without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: netpilot
          persist-credentials: false

      - name: Checkout exact zapret2 UAF-fix source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: bol-van/zapret2
          ref: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
          fetch-depth: 2
          path: zapret2
          persist-credentials: false

      - name: Verify exact source and apply reviewed patch series
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C zapret2 rev-parse HEAD)" = "4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d"
          test "$(git -C zapret2 rev-parse HEAD^)" = "221d7dff24bfec0cd5ac0a5070b8acef2008af3d"
          test "$(git -C zapret2 rev-parse 'HEAD^{tree}')" = "5c2a77786cc7089145abe2ca99bcc53a8ed7de15"

          patch_dir="$PWD/netpilot/security/native-admission/patches/zapret2-r28"
          echo "af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff  $patch_dir/0001-explicit-conntrack-feed-result.patch" | sha256sum -c -
          echo "a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783  $patch_dir/0002-bounded-conntrack-resource-result.patch" | sha256sum -c -
          echo "33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68  $patch_dir/0003-bounded-delayed-queue-bytes.patch" | sha256sum -c -
          echo "f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777  $patch_dir/0004-explicit-daemon-stdio-redirection.patch" | sha256sum -c -
          echo "67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1  $patch_dir/0005-fail-closed-zero-conntrack-budget.patch" | sha256sum -c -
          echo "f5f3c01c73db3584513adc345da838bef6035c95a59762c469a386c7ad201d97  $patch_dir/0006-fail-closed-zero-delayed-queue-budget.patch" | sha256sum -c -

          for patch in \
            0001-explicit-conntrack-feed-result.patch \
            0002-bounded-conntrack-resource-result.patch \
            0003-bounded-delayed-queue-bytes.patch \
            0004-explicit-daemon-stdio-redirection.patch \
            0005-fail-closed-zero-conntrack-budget.patch \
            0006-fail-closed-zero-delayed-queue-budget.patch
          do
            git -C zapret2 apply --check "$patch_dir/$patch"
            git -C zapret2 apply "$patch_dir/$patch"
          done

          grep -Fq '!max_entries || HASH_COUNT(*pp) >= max_entries' zapret2/nfq2/conntrack.c
          grep -Fq 'if (!q->max_bytes || new_queued_bytes > q->max_bytes) return NULL;' zapret2/nfq2/packet_queue.c

      - name: Install compile-only analysis dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libcap-dev \
            libluajit-5.1-dev \
            zlib1g-dev \
            libnetfilter-queue-dev \
            libnfnetlink-dev \
            libmnl-dev

      - name: GCC static analyzer compile
        id: analyzer
        continue-on-error: true
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          make -C nfq2 clean >/dev/null
          make -C nfq2 \
            CC=gcc \
            LUA_JIT=1 \
            MINSIZE= \
            OPTIMIZE='-O1 -fanalyzer -Werror=analyzer-use-after-free -Werror=analyzer-double-free -Werror=analyzer-null-dereference -Werror=analyzer-fd-use-after-close' \
            nfqws2 2>&1 | tee ../evidence/gcc-analyzer-build.log
          test -f nfq2/nfqws2

          # daemonize() intentionally keeps descriptors 0/1/2 open on /dev/null for
          # the lifetime of the daemon. GCC -fanalyzer reports those three retained
          # standard descriptors as fd-leak warnings. Allow exactly that known set;
          # every other analyzer warning remains release-blocking.
          grep -E 'warning:.*\[-Wanalyzer-' ../evidence/gcc-analyzer-build.log > ../evidence/gcc-analyzer-warning-lines.log || true
          expected_fd_leaks="$(grep -Ec '^sec\.c:[0-9]+:[0-9]+: warning: leak of file descriptor .*\[-Wanalyzer-fd-leak\]$' ../evidence/gcc-analyzer-warning-lines.log || true)"
          test "$expected_fd_leaks" -eq 3
          grep -Fq 'sec.c: In function ‘daemonize’:' ../evidence/gcc-analyzer-build.log

          if grep -Ev '^sec\.c:[0-9]+:[0-9]+: warning: leak of file descriptor .*\[-Wanalyzer-fd-leak\]$' ../evidence/gcc-analyzer-warning-lines.log | grep -q .; then
            echo 'Unexpected GCC analyzer warning remains in candidate build.' >&2
            grep -Ev '^sec\.c:[0-9]+:[0-9]+: warning: leak of file descriptor .*\[-Wanalyzer-fd-leak\]$' ../evidence/gcc-analyzer-warning-lines.log >&2
            exit 1
          fi

          printf 'expected_daemon_stdio_fd_retention_warnings=%s\n' "$expected_fd_leaks" > ../evidence/gcc-analyzer-expected-warning-summary.txt
          sha256sum nfq2/nfqws2 | awk '{print $1}' > ../evidence/gcc-analyzer-binary.sha256
          rm -f nfq2/nfqws2
          test ! -e nfq2/nfqws2

      - name: ASan and UBSan instrumented compile
        id: sanitizer_compile
        continue-on-error: true
        shell: bash
        working-directory: zapret2
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          make -C nfq2 clean >/dev/null
          make -C nfq2 \
            CC=gcc \
            LUA_JIT=1 \
            MINSIZE= \
            CFLAGS_UBSAN='-fsanitize=address,undefined,alignment -fno-sanitize-recover=undefined,alignment -fno-omit-frame-pointer' \
            ubsan 2>&1 | tee ../evidence/asan-ubsan-compile.log
          test -f nfq2/nfqws2
          sha256sum nfq2/nfqws2 | awk '{print $1}' > ../evidence/asan-ubsan-binary.sha256
          rm -f nfq2/nfqws2
          test ! -e nfq2/nfqws2

      - name: Produce text-only evidence
        if: always()
        shell: bash
        env:
          ANALYZER_OUTCOME: ${{ steps.analyzer.outcome }}
          SANITIZER_COMPILE_OUTCOME: ${{ steps.sanitizer_compile.outcome }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          {
            echo 'schema_version=6'
            echo 'scope=static-analysis-and-sanitizer-compile-only'
            echo 'candidate=zapret2-v1.0.6-plus-uaf-fix-plus-netpilot-patches-0001-0006-proposed'
            echo 'source_commit=4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d'
            echo 'source_parent=221d7dff24bfec0cd5ac0a5070b8acef2008af3d'
            echo 'patch_0004_sha256=f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777'
            echo 'patch_0005_sha256=67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1'
            echo 'patch_0006_sha256=f5f3c01c73db3584513adc345da838bef6035c95a59762c469a386c7ad201d97'
            echo "analyzer_outcome=$ANALYZER_OUTCOME"
            echo "sanitizer_compile_outcome=$SANITIZER_COMPILE_OUTCOME"
            echo "compiler=$(gcc --version | head -n1)"
            echo 'expected_analyzer_warning_policy=exactly-three-daemon-stdio-fd-retention-warnings-only'
            echo 'candidate_binary_executed=false'
            echo 'network_interception_enabled=false'
            echo 'driver_installed=false'
            echo 'sanitizer_runtime_test_performed=false'
          } > evidence/static-sanitizer-compile.txt
          sha256sum evidence/* | sort > evidence/SHA256SUMS-static-sanitizer.txt

      - name: Upload text evidence only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zapret2-r28-static-sanitizer-compile-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Enforce analysis and compile success after evidence upload
        if: always()
        shell: bash
        env:
          ANALYZER_OUTCOME: ${{ steps.analyzer.outcome }}
          SANITIZER_COMPILE_OUTCOME: ${{ steps.sanitizer_compile.outcome }}
        run: |
          set -euo pipefail
          test "$ANALYZER_OUTCOME" = 'success'
          test "$SANITIZER_COMPILE_OUTCOME" = 'success'
