name: R38 Real Second-SID Lease Runtime Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r38-multiuser-runtime-once.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: netpilot-r38-real-second-sid-runtime-once
  cancel-in-progress: false

env:
  NETPILOT_R38_SHA: 61ebea0833ce845c174510274554ad1c67dce2b0
  SOURCE_RUN_ID: '41006065721'
  BYEDPI_WINDOWS_SHA256: 866e99c3c7690326cc6e365fe02980f06ae2b394c045555674fb95db52b0dbdd
  PACKAGE_VERSION: 0.17.3-netpilot-r34-lab
  SERVICE_NAME: NetPilot.R38.Lab
  PROXY_PORT: '39036'
  SECOND_USER_NAME: NetPilotR38B

jobs:
  real-second-sid-lease:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Checkout exact R38 checkpoint
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.NETPILOT_R38_SHA }}
          path: netpilot
          persist-credentials: false
          fetch-depth: 1

      - name: Download exact reviewed ByeDPI candidate
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: r36-byedpi-candidate-transfer
          path: candidate
          github-token: ${{ github.token }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Verify exact clean boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git -C netpilot rev-parse HEAD).Trim() -ne $env:NETPILOT_R38_SHA) {
            throw 'R38 checkpoint drift.'
          }
          $candidate = Resolve-Path 'candidate\ciadpi.exe'
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $candidate).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'R38 candidate hash drift.' }

          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw 'R38 requires an administrative hosted Windows runner.'
          }
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          if ($sessionId -le 0) { throw 'R38 primary client is not in an interactive session.' }

          foreach ($service in @('NetPilot.Service', 'NetPilot.R36.Lab', 'NetPilot.R37.Lab', $env:SERVICE_NAME)) {
            if (Get-Service -Name $service -ErrorAction SilentlyContinue) {
              throw "Refusing pre-existing Windows service: $service"
            }
          }
          if (Get-LocalUser -Name $env:SECOND_USER_NAME -ErrorAction SilentlyContinue) {
            throw 'Refusing pre-existing R38 temporary local user.'
          }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          if (Test-Path -LiteralPath $root) { throw "Refusing pre-existing NetPilot root: $root" }

          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          "NETPILOT_R38_SHA=$env:NETPILOT_R38_SHA" | Set-Content evidence\r38-multiuser.txt
          "BYEDPI_WINDOWS_SHA256=$actual" | Add-Content evidence\r38-multiuser.txt
          "PRIMARY_SESSION_ID=$sessionId" | Add-Content evidence\r38-multiuser.txt
          'PRODUCTION_ADMISSION=BLOCK' | Add-Content evidence\r38-multiuser.txt

      - name: Publish hardened service and lab clients
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36ServiceLab\NetPilot.ByeDpiR36ServiceLab.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\service
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish netpilot\tools\NetPilot.ByeDpiR36LabClient\NetPilot.ByeDpiR36LabClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\owner-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet publish netpilot\tools\NetPilot.ByeDpiR38LeaseClient\NetPilot.ByeDpiR38LeaseClient.csproj --configuration Release --runtime win-x64 --self-contained true --output publish\lease-client
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage protected service, clients and exact engine package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $serviceDir = Join-Path $root 'Lab\R38Service'
          $ownerClientDir = Join-Path $root 'Lab\R38OwnerClient'
          $leaseClientDir = Join-Path $root 'Lab\R38LeaseClient'
          $engineBin = Join-Path $root "Engines\Managed\byedpi\$env:PACKAGE_VERSION\x64\bin"
          $config = Join-Path $root 'Config'
          $users = Join-Path $root 'Users'
          New-Item -ItemType Directory -Force -Path $serviceDir, $ownerClientDir, $leaseClientDir, $engineBin, $config, $users | Out-Null
          Set-Content -LiteralPath (Join-Path $root '.r38-hosted-owned') -Value $env:NETPILOT_R38_SHA -NoNewline
          Copy-Item -Path 'publish\service\*' -Destination $serviceDir -Recurse
          Copy-Item -Path 'publish\owner-client\*' -Destination $ownerClientDir -Recurse
          Copy-Item -Path 'publish\lease-client\*' -Destination $leaseClientDir -Recurse
          Copy-Item -LiteralPath 'candidate\ciadpi.exe' -Destination (Join-Path $engineBin 'ciadpi.exe')
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId
          Set-Content -LiteralPath (Join-Path $config 'enrollment.session') -Value $sessionId -NoNewline

          & icacls.exe $root /inheritance:r | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to protect R38 root inheritance.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set R38 root ACL.' }
          & icacls.exe $root /setowner '*S-1-5-32-544' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to set privileged R38 owner.' }
          & icacls.exe $root /grant:r '*S-1-5-18:(OI)(CI)F' '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)RX' /T /C | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to normalize R38 tree ACL.' }

          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $engineBin 'ciadpi.exe')).Hash.ToLowerInvariant()
          if ($actual -ne $env:BYEDPI_WINDOWS_SHA256) { throw 'Staged R38 candidate hash drift.' }
          'PROTECTED_PROGRAM_FILES_TREE=True' | Add-Content evidence\r38-multiuser.txt

      - name: Register and start hardened LocalSystem lab service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $serviceExe = Join-Path $env:ProgramFiles 'NetPilot\Lab\R38Service\NetPilot.ByeDpiR36ServiceLab.exe'
          $binaryPathName = '"' + $serviceExe + '"'
          New-Service -Name $env:SERVICE_NAME -BinaryPathName $binaryPathName -DisplayName 'NetPilot R38 Multi-User Lab' -StartupType Manual | Out-Null
          $svc = Get-CimInstance Win32_Service -Filter "Name='$env:SERVICE_NAME'"
          if ($null -eq $svc -or $svc.StartName -ne 'LocalSystem') { throw 'R38 service is not LocalSystem.' }
          Start-Service -Name $env:SERVICE_NAME
          $deadline = (Get-Date).AddSeconds(20)
          do {
            Start-Sleep -Milliseconds 250
            $status = (Get-Service -Name $env:SERVICE_NAME).Status
            if ($status -eq 'Running') { break }
          } while ((Get-Date) -lt $deadline)
          if ($status -ne 'Running') { throw 'R38 LocalSystem service failed to start.' }
          'LOCALSYSTEM_SERVICE_RUNNING=True' | Add-Content evidence\r38-multiuser.txt

      - name: Primary user enrolls and acquires ByeDPI lease
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ownerClient = Join-Path $env:ProgramFiles 'NetPilot\Lab\R38OwnerClient\NetPilot.ByeDpiR36LabClient.exe'
          & $ownerClient --start-for-service-stop 2>&1 | Tee-Object -FilePath evidence\r38-owner-start.txt
          if ($LASTEXITCODE -ne 0) { throw 'R38 owner failed to start engine.' }
          $content = Get-Content evidence\r38-owner-start.txt -Raw
          foreach ($marker in @('AUTHENTICATED_IPC=PASS','IPC_START=PASS','START_FOR_SERVICE_STOP=PASS','RESULT=R36_START_FOR_SERVICE_STOP_PASS')) {
            if (-not $content.Contains($marker, [StringComparison]::Ordinal)) { throw "Missing owner-start marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 1) { throw 'R38 expected exactly one active ciadpi.exe.' }
          'PRIMARY_OWNER_ENGINE_RUNNING=PASS' | Add-Content evidence\r38-multiuser.txt

      - name: Create temporary second user and require lease denial
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $username = $env:SECOND_USER_NAME
          $passwordPlain = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(24)) + 'aA1!'
          $password = ConvertTo-SecureString $passwordPlain -AsPlainText -Force
          New-LocalUser -Name $username -Password $password -AccountNeverExpires -PasswordNeverExpires | Out-Null
          $usersGroup = (Get-LocalGroup -SID 'S-1-5-32-545').Name
          Add-LocalGroupMember -Group $usersGroup -Member $username

          $primarySid = [Security.Principal.WindowsIdentity]::GetCurrent().User.Value
          $secondSid = (Get-LocalUser -Name $username).SID.Value
          if ([string]::Equals($primarySid, $secondSid, [StringComparison]::OrdinalIgnoreCase)) {
            throw 'R38 temporary user SID unexpectedly matches primary SID.'
          }
          'SECOND_SID_DISTINCT=True' | Add-Content evidence\r38-multiuser.txt

          $cred = [Management.Automation.PSCredential]::new("$env:COMPUTERNAME\$username", $password)
          $clientDir = Join-Path $env:ProgramFiles 'NetPilot\Lab\R38LeaseClient'
          $clientExe = Join-Path $clientDir 'NetPilot.ByeDpiR38LeaseClient.exe'
          $scratch = Join-Path $env:ProgramData 'NetPilotR38'
          New-Item -ItemType Directory -Force -Path $scratch | Out-Null
          & icacls.exe $scratch /grant:r '*S-1-5-32-544:(OI)(CI)F' '*S-1-5-32-545:(OI)(CI)M' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Failed to prepare R38 second-user scratch ACL.' }
          $stdout = Join-Path $scratch 'second-user.out.txt'
          $stderr = Join-Path $scratch 'second-user.err.txt'

          $process = Start-Process -FilePath $clientExe -ArgumentList '--expect-nonowner-denied' -WorkingDirectory $clientDir -Credential $cred -LoadUserProfile -Wait -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $outText = if (Test-Path $stdout) { Get-Content $stdout -Raw } else { '' }
          $errText = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { '' }
          $outText | Set-Content evidence\r38-second-user.txt
          if ($errText) { $errText | Add-Content evidence\r38-second-user.txt }
          if ($process.ExitCode -ne 0) {
            Get-Content evidence\r38-second-user.txt | Out-Host
            throw "R38 second-user lease probe failed with exit code $($process.ExitCode)."
          }

          foreach ($marker in @('R38_AUTHENTICATED_IPC=PASS','R38_SESSION_NONZERO=True','R38_OBSERVED_RUNNING=PASS','R38_NONOWNER_START_DENIED=PASS','R38_NONOWNER_STOP_DENIED=PASS','R38_LEASE_PRESERVED_AFTER_DENIAL=PASS','RESULT=R38_NONOWNER_DENIAL_PASS')) {
            if (-not $outText.Contains($marker, [StringComparison]::Ordinal)) { throw "Missing second-user marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 1) { throw 'R38 non-owner operations changed engine process state.' }

          'SECOND_USER_AUTHENTICATED_IPC=PASS' | Add-Content evidence\r38-multiuser.txt
          'SECOND_USER_START_DENIED=PASS' | Add-Content evidence\r38-multiuser.txt
          'SECOND_USER_STOP_DENIED=PASS' | Add-Content evidence\r38-multiuser.txt
          'LEASE_PRESERVED=PASS' | Add-Content evidence\r38-multiuser.txt

          Remove-LocalUser -Name $username
          Remove-Item -LiteralPath $scratch -Recurse -Force
          'SECOND_USER_CLEANUP=PASS' | Add-Content evidence\r38-multiuser.txt

      - name: Original owner stops engine and proves cleanup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $leaseClient = Join-Path $env:ProgramFiles 'NetPilot\Lab\R38LeaseClient\NetPilot.ByeDpiR38LeaseClient.exe'
          & $leaseClient --owner-stop 2>&1 | Tee-Object -FilePath evidence\r38-owner-stop.txt
          if ($LASTEXITCODE -ne 0) { throw 'R38 original owner could not stop its engine.' }
          $content = Get-Content evidence\r38-owner-stop.txt -Raw
          foreach ($marker in @('R38_AUTHENTICATED_IPC=PASS','R38_OBSERVED_RUNNING=PASS','R38_OWNER_STOP=PASS','R38_OWNER_STOP_CLEANUP=PASS','RESULT=R38_OWNER_STOP_PASS')) {
            if (-not $content.Contains($marker, [StringComparison]::Ordinal)) { throw "Missing owner-stop marker: $marker" }
          }
          if (@(Get-Process -Name ciadpi -ErrorAction SilentlyContinue).Count -ne 0) { throw 'R38 owner stop left residual ciadpi.exe.' }
          if (@(Get-NetTCPConnection -State Listen -LocalPort ([int]$env:PROXY_PORT) -ErrorAction SilentlyContinue).Count -ne 0) { throw 'R38 owner stop left residual listener.' }
          'PRIMARY_OWNER_STOP_AFTER_DENIAL=PASS' | Add-Content evidence\r38-multiuser.txt
          'RESULT=R38_REAL_SECOND_SID_LEASE_PASS' | Add-Content evidence\r38-multiuser.txt
          Get-Content evidence\r38-multiuser.txt | Out-Host

      - name: Upload text-only R38 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: r38-byedpi-real-second-sid-lease-evidence
          path: evidence/*.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Force-clean only workflow-owned state
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (Get-LocalUser -Name $env:SECOND_USER_NAME -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name $env:SECOND_USER_NAME -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:ProgramData 'NetPilotR38') -Recurse -Force -ErrorAction SilentlyContinue
          Get-Process -Name ciadpi -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          $service = Get-Service -Name $env:SERVICE_NAME -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            if ($service.Status -ne 'Stopped') { Stop-Service -Name $env:SERVICE_NAME -Force -ErrorAction SilentlyContinue }
            & sc.exe delete $env:SERVICE_NAME | Out-Host
          }
          $root = Join-Path $env:ProgramFiles 'NetPilot'
          $marker = Join-Path $root '.r38-hosted-owned'
          if (Test-Path -LiteralPath $marker) {
            $value = (Get-Content -LiteralPath $marker -Raw).Trim()
            if ($value -eq $env:NETPILOT_R38_SHA) {
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host 'WORKFLOW_OWNED_STATE_CLEANUP=PASS'
            } else {
              Write-Warning 'R38 ownership marker mismatch; protected tree not removed.'
            }
          }
