name: R42.5 Provenance Package Preflight Once

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/r42-5-provenance-package-preflight-once.yml'

permissions:
  contents: read

env:
  NETPILOT_R42_5_SHA: dc28fc4f0b635c34c63bbaed99ea7658d8a9c827

jobs:
  managed-boundary:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact R42.5 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.NETPILOT_R42_5_SHA }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify fail-closed provenance package boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$NETPILOT_R42_5_SHA"
          bash scripts/security/r42-5-byedpi-provenance-package-check.sh
          bash scripts/security-policy-check.sh
          bash scripts/runtime-admission-policy-check.sh

      - name: Setup .NET 10
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build solution
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore NetPilot.sln
          dotnet build NetPilot.sln --configuration Release --no-restore
          echo 'R42_5_SOLUTION_BUILD=PASS'

      - name: Run strict manifest document tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/NetPilot.Core.Tests/NetPilot.Core.Tests.csproj --configuration Release --no-build --filter 'FullyQualifiedName~ByeDpiPackageManifestDocumentTests'
          echo 'R42_5_MANIFEST_DOCUMENT_TESTS=PASS'

      - name: Build isolated package builder
        shell: bash
        run: |
          set -euo pipefail
          dotnet build tools/NetPilot.ByeDpiR42PackageBuilder/NetPilot.ByeDpiR42PackageBuilder.csproj --configuration Release
          echo 'R42_5_PACKAGE_BUILDER_COMPILE=PASS'
          echo 'R42_5_NATIVE_EXECUTION_TESTED=False'
          echo 'R42_5_PRODUCTION_ADMISSION=BLOCK'
          echo 'RESULT=R42_5_PREFLIGHT_PASS_BLOCK'
