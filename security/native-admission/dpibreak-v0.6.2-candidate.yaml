static_review:
  document: docs/DPIBREAK-STATIC-ADMISSION-R28.1.md
  fork_strategy: UPSTREAM_FIRST_NO_FORK_UNLESS_BLOCKER
  primary_engine_candidate: false
  rationale: Active upstream and strong release provenance make an early NetPilot fork unnecessary; functional scope is narrower than zapret2, open compatibility/lifecycle issues remain, and GPL increases fork/distribution obligations.

positive_evidence:
  - id: DPIBREAK-SUPPLY-001
    status: PASS_FOR_PROVENANCE_ONLY
    finding: v0.6.2 has a GitHub-verified signed annotated tag, release asset digests, a separate checksum signature asset and buildinfo for the exact release commit/toolchain.
  - id: DPIBREAK-CLEANUP-002
    status: PASS_FOR_UPSTREAM_FIX_PRESENCE_ONLY
    finding: v0.6.2 release notes state fixes for WinDivert termination/service cleanup, a dangling pointer in the in-tree windivert crate, Linux iptables startup cleanup, and Linux memory-ordering/packet-buffer-offset stabilization.
  - id: DPIBREAK-RUST-003
    status: POSITIVE_FACTOR_ONLY
    finding: Core is written in Rust, but FFI, WinDivert driver, NFQUEUE and firewall lifecycle boundaries still require separate admission.

review_findings:
  - id: DPIBREAK-SCOPE-001
    severity: PRODUCT_LIMITATION
    title: QUIC support is not present in the current release line.
    evidence: upstream issue #32 is open as "QUIC support".
    impact: Do not treat DPIBreak as a complete replacement for zapret2 for modern QUIC/HTTP3 or Discord/UDP-heavy profiles.
  - id: DPIBREAK-NFQ-002
    severity: REVIEW
    title: Linux NFQUEUE/GSO segmentation semantics remain open.
    evidence: upstream issue #24 is open and describes NFQUEUE splitting GSO TCP packets before userspace unless GSO delivery semantics are handled.
    impact: Subsequent/fragmented TCP segments can reach processing paths under semantics that differ from the intended ClientHello-only model.
    required_action: Linux GSO/MTU/fail-safe regression matrix and a separate Windows segmentation review.
  - id: DPIBREAK-FIREWALL-003
    severity: REVIEW
    title: Linux firewall bootstrap is hard-coded into the candidate runtime.
    evidence: upstream issue #28 requests an option to disable automatic nft/iptables execution and explicitly notes maintainability/user-experience concerns.
    required_action: Before any lab execution, inventory exact rules, ownership names, rollback, crash/timeout cleanup and before/after firewall diff.
  - id: DPIBREAK-LOCAL-004
    severity: COMPATIBILITY
    title: Broad processing can break local HTTPS services.
    evidence: upstream issue #26 reports SSL_ERROR_RX_MALFORMED_SERVER_HELLO for locally hosted HTTPS under aggressive mode and requests domain exclusions.
    required_action: NetPilot must not expose a universal/broad profile until local/LAN exclusion semantics are reviewed and typed.
  - id: DPIBREAK-WIREGUARD-005
    severity: COMPATIBILITY
    title: Forwarded WireGuard client traffic is not automatically covered by the current Linux setup.
    evidence: upstream issue #31 remains open with compatibility/workaround labels.
    required_action: Treat VPN coexistence/forwarded-client handling as a separate routing/firewall test matrix.
  - id: DPIBREAK-WINDIVERT-006
    severity: REVIEW
    title: Windows runtime uses a WinDivert driver boundary through the in-tree Rust wrapper.
    required_action: Full inventory DLL/SYS/EXE, exact vendored WinDivert version/hashes/signatures, DLL search path, install/load/unload/update/crash cleanup and Defender/SmartScreen observations.
  - id: DPIBREAK-SIGNING-007
    severity: REVIEW
    title: Authenticode status of the exact Windows executable/component set is not yet confirmed by NetPilot admission.
    required_action: Inventory PE metadata and signatures; never instruct users to bypass SmartScreen/Defender protections.
  - id: DPIBREAK-LICENSE-008
    severity: INTEGRATION_CONSTRAINT
    title: DPIBreak is GPL-3.0-or-later while NetPilot Core is MIT.
    required_action: Keep DPIBreak as a separately governed component, preserve license/notices/source obligations for any distributed fork/component, and do not copy GPL implementation into MIT Core without separate legal review.
  - id: DPIBREAK-BUILD-009
    severity: SUPPLY_CHAIN_REVIEW
    title: NetPilot has not yet reproduced the exact release with its own pinned build pipeline.
    required_action: Controlled build must pin full action SHAs, exact Rust toolchain, Cargo.lock and every downloaded native dependency hash before use.

fork_rules:
  - Default decision is no fork: track exact upstream tagged release first.
  - Create a fork only for a confirmed blocker that cannot be solved at the adapter boundary or accepted upstream in time.
  - If forked, base only on exact reviewed tag/commit, not current master.
  - Fork remains GPL-3.0-or-later and publishes corresponding source/notices as required.
  - Do not copy GPL implementation into MIT NetPilot Core.
  - NetPilot arguments come only from a typed allowlist; raw CLI is not exposed to users.
  - Any upstream sync requires diff/dependency review and a new admission delta.

platform_position:
  windows: secondary HTTPS/YouTube fallback candidate
  linux: secondary HTTPS fallback candidate
  android: not selected for current Android path
  discord_udp: insufficient as primary engine based on current documented scope
  quic_http3: not assumed supported while issue #32 remains open

required_before_admit:
  - Review exact Cargo.lock/dependency tree, cargo advisories and unsafe/FFI surfaces.
  - Controlled Windows/Linux build using pinned immutable workflow actions/toolchain and --locked dependencies.
  - Pin and verify the exact WinDivert archive/component hashes before build or use.
  - Inventory Windows EXE/DLL/SYS, SHA-256, PE metadata and signatures.
  - Verify WinDivert lifecycle: start, stop, abnormal exit, update/uninstall cleanup and reboot recovery.
  - Test Linux NFQUEUE GSO/MTU semantics from issue #24 and Windows packet segmentation behavior separately.
  - Define reversible nftables/iptables ownership and rollback before Linux lab runtime.
  - Test local/LAN HTTPS exclusions and VPN/WireGuard coexistence before any broad profile.
  - Treat QUIC/HTTP3 and Discord/UDP as unsupported until separately proven.
  - Isolated HTTPS/YouTube runtime only after a candidate-specific DRAFT_NOT_APPROVED lab plan is reviewed and explicitly promoted.
  - Bounded CPU/memory/burst tests.
  - Advisory review and explicit HIGH_ASSURANCE human approval before any candidate execution or ADMIT.

notes:
  - Rust reduces some memory-safety risk but is not proof of safety across FFI/driver/firewall boundaries.
  - The release commit itself is unsigned in GitHub commit verification; the provenance anchor is the GitHub-verified signed annotated tag plus independently pinned release assets.
  - Signed tag/checksums improve provenance but do not replace security review.
  - REVIEW and BLOCK never mean PASS or ADMIT.
  - This manifest authorizes no DPIBreak binary, driver, NFQUEUE rule, nftables rule or iptables rule to execute from NetPilot.
