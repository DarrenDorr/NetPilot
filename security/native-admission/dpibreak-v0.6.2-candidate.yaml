positive_evidence:
  - id: DPIBREAK-SUPPLY-001
    status: PASS_FOR_PROVENANCE_ONLY
    finding: v0.6.2 имеет подписанный annotated tag, release checksums, отдельную подпись checksum-файла и buildinfo с exact commit/toolchain.
  - id: DPIBREAK-CLEANUP-002
    status: PASS_FOR_UPSTREAM_FIX_PRESENCE_ONLY
    finding: v0.6.2 содержит исправления завершения WinDivert, освобождения driver service и memory-related bug в in-tree windivert crate.

review_findings:
  - id: DPIBREAK-SCOPE-001
    severity: PRODUCT_LIMITATION
    title: DPIBreak ориентирован на HTTPS/TLS ClientHello.
    impact: Не является полной заменой zapret2 для профиля Discord/UDP; рассматривается как secondary/fallback для HTTPS/YouTube.
  - id: DPIBREAK-NFQ-002
    severity: REVIEW
    title: Open issue #24 описывает обработку последующих TCP segments как независимых ClientHello на Linux NFQUEUE.
    required_action: Проверить исправления/актуальность на exact release и отдельно исследовать поведение Windows WinDivert.
  - id: DPIBREAK-WINDIVERT-003
    severity: REVIEW
    title: Windows runtime использует WinDivert 2.2.2-A через in-tree Rust wrapper.
    required_action: Провести полный native inventory DLL/SYS, подпись, advisory review и failure-cleanup tests для exact release assets.
  - id: DPIBREAK-SIGNING-004
    severity: REVIEW
    title: Authenticode статус dpibreak.exe ещё не подтверждён нашим admission.
    required_action: Проверить PE metadata/signature отдельно; NetPilot не должен советовать пользователю обходить SmartScreen/Defender предупреждения.
  - id: DPIBREAK-LICENSE-005
    severity: INTEGRATION_CONSTRAINT
    title: Движок GPL-3.0-or-later, тогда как NetPilot MIT.
    required_action: При распространении держать движок отдельным компонентом/репозиторием, выполнять GPL obligations и не смешивать его исходный код с MIT Core без отдельного legal review.

fork_rules:
  - Если потребуется форк, базироваться только на exact reviewed commit/tag, а не current master.
  - Форк DPIBreak остаётся GPL-3.0-or-later и публикует соответствующий исходный код/уведомления.
  - Не переносить GPL implementation в MIT NetPilot Core.
  - Параметры NetPilot компилируются из typed allowlist; raw CLI пользователю не передаётся.
  - Любой upstream sync проходит diff review, dependency review и новый admission delta.

platform_position:
  windows: secondary HTTPS/YouTube fallback candidate
  linux: secondary HTTPS fallback candidate
  android: not selected for current Android path
  discord_udp: insufficient as primary engine based on current documented scope

required_before_admit:
  - Проверить полный source/dependency tree exact v0.6.2, включая Cargo.lock и in-tree windivert crate.
  - Выполнить cargo audit/advisory review и статический анализ exact source tree.
  - Собрать из исходников в контролируемом CI и сравнить ожидаемый состав release artifacts, где возможно.
  - Инвентаризировать Windows EXE/DLL/SYS, SHA-256 и подписи.
  - Проверить WinDivert lifecycle: start, stop, abnormal exit, uninstall/update cleanup.
  - Проверить open issue #24 и Windows packet segmentation behavior.
  - Изолированные HTTPS/YouTube runtime tests и coexistence tests с распространёнными VPN/security products.
  - Только после всех проверок exact component set может получить ADMIT.

notes:
  - Rust снижает отдельные классы memory-safety ошибок, но не является автоматическим доказательством безопасности всего продукта и FFI/driver boundary.
  - Подписанный tag и checksums повышают доверие к происхождению, но не заменяют security review.
  - REVIEW и BLOCK никогда не трактуются как PASS или ADMIT.
  - Этот manifest не разрешает запуск или интеграцию DPIBreak.
