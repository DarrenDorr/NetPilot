  resource_stress_gate_must_be_green: true
  unresolved_execution_boundary_blockers_allowed: false
  disposable_vm_required: true
  clean_snapshot_required: true
  user_data_allowed: false
  browser_sessions_allowed: false
  credentials_allowed: false
  packet_capture_allowed: false

