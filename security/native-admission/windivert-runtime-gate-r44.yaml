  - id: WD-RUNTIME-001
    upstream_issue: https://github.com/basil00/WinDivert/issues/408
    issue_number: 408
    observed_state: OPEN
    boundary: first-load concurrent open initialization race
    impact: possible kernel bugcheck 0xD1
    required_for_recheck: reviewed fixed exact component set
  - id: WD-LIFECYCLE-002
    upstream_issue: https://github.com/basil00/WinDivert/issues/406
    issue_number: 406
    observed_state: OPEN
    boundary: shared service and foreign open handle lifecycle
    impact: ERROR_SERVICE_DISABLED 1058 and unsafe global stop/remove semantics
    required_for_recheck: lifecycle model that never force-stops foreign ownership
  - id: WD-DEFENDER-003
    upstream_issue: https://github.com/basil00/WinDivert/issues/411
    issue_number: 411
    observed_state: OPEN
    boundary: official archive Defender disposition
    impact: unresolved exact-artifact trust/distribution signal
    required_for_recheck: artifact-specific disposition or reviewed replacement component set

