re_evaluation_triggers:
  - new exact tagged WinDivert release
  - reviewed closure or source-level fix for issue 408
  - reviewed shared-service lifecycle resolution for issue 406
  - artifact-specific Defender disposition or replacement for issue 411
  - explicit NetPilot HIGH_ASSURANCE decision for a different Windows backend

promotion_requirements:
  to_pre_lab_review:
    - exact fixed WinDivert component set pinned by tag commit tree archive hash DLL hash SYS hash and signature identity
    - source review demonstrates issue 408 class is closed for that exact component set
    - service lifecycle design does not assume exclusive global ownership
    - Defender remains enabled with no exclusions
    - Secure Boot remains enabled
    - compile/static driver evidence is green without loading the driver
    - disposable Windows VM lab plan is updated for the exact component set
    - explicit HIGH_ASSURANCE human approval is recorded
  to_lab_approved:
    automatic: false
    requires_all_pre_lab_review_conditions: true
  to_production_admit:
    automatic: false
    requires_separate_release_security_decision: true

invariants:
  lab_pass_never_implies_production_admit: true
  compile_pass_never_implies_driver_load_permission: true
  fork_bootstrap_never_implies_runtime_permission: true
