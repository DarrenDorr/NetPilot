verified_delta:
  - id: Z2-FORK-BASE-001
    status: PASS_FOR_RELATIONSHIP_ONLY
    finding: Исправление UAF является прямым дочерним коммитом точного релизного коммита v1.0.6.
    evidence: Коммит 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d имеет единственного родителя 221d7dff24bfec0cd5ac0a5070b8acef2008af3d и tree 5c2a77786cc7089145abe2ca99bcc53a8ed7de15.

  - id: Z2-FORK-BASE-002
    status: PASS_FOR_KNOWN_UAF_FIX_ONLY
    finding: Патч сбрасывает сохранённое представление reassembly payload после освобождения буфера перед повторным разбором.
    limitation: Это подтверждает исправление ранее найденного UAF, но не является полным security admission всего движка.

  - id: Z2-SEMANTICS-003
    status: DESIGN_VERIFIED
    finding: ConntrackPoolFeed()==false в main desync path не означает pass-through; play_prolog продолжает без conntrack и может применить stateless desync.
    effect: Простой count cap с return false отклонён. Resource saturation получил отдельный internal result и явный VERDICT_PASS до dp_find/desync processing.

  - id: Z2-PATCH-0001-004
    status: PASS_FOR_APPLICABILITY_AND_COMPILE_ONLY
    finding: Patch 0001 применим к exact source tree и входит в успешный Windows x64 compile-smoke.
    limitation: Runtime behavior не проверен.

  - id: Z2-PATCH-0002-005
    status: PASS_FOR_APPLICABILITY_AND_COMPILE_ONLY
    finding: Patch 0002 вводит отдельный RESOURCE_EXHAUSTED и aggregate entry budget; exact patch вошёл в успешный Windows x64 compile-smoke.
    limitation: Числовой production budget и runtime saturation behavior ещё не подтверждены workload-тестами.

  - id: Z2-PATCH-0003-006
    status: PASS_FOR_APPLICABILITY_AND_COMPILE_ONLY
    finding: Patch 0003 вводит overflow-safe queued-bytes accounting; exact patch вошёл в успешный Windows x64 compile-smoke.
    limitation: Числовой production byte budget и runtime queue behavior ещё не подтверждены workload-тестами.

  - id: Z2-WINDOWS-COMPILE-007
    status: PASS_FOR_COMPILE_ONLY
    finding: Exact post-UAF source + NetPilot patches 0001-0003 + exact LuaJIT commit успешно компилируются в Windows x64 winws2.exe на windows-2025/Cygwin.
    limitation: Binary не запускался; WinDivert отсутствовал; результат не является ADMIT.

