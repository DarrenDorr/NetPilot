patch_series:
  - sequence: 1
    path: security/native-admission/patches/zapret2-r28/0001-explicit-conntrack-feed-result.patch
    purpose: behavior-preserving refactor of ambiguous bool feed result before any resource cap is introduced
    sha256: af811313b37efc14f157bdc1744e9a74ea3c009b03fc1d518d9ab327a35facff
    status: CURRENT_PATCHSET_GATES_PASS
    changes_packet_policy: false
    expected_files:
      - nfq2/conntrack.c
      - nfq2/conntrack.h
      - nfq2/desync.c
      - nfq2/lua.c

  - sequence: 2
    path: security/native-admission/patches/zapret2-r28/0002-bounded-conntrack-resource-result.patch
    purpose: introduce explicit RESOURCE_EXHAUSTED state and aggregate conntrack entry budget with fail-safe VERDICT_PASS before dp_find/desync
    sha256: a3531211626ce602a3b5cab6c926a28e7a94ebdf2a475e3bcfa6829e64dea783
    git_blob_sha1: 334f917b5d50b30fca8108f05944b11a46ed235b
    status: CURRENT_PATCHSET_GATES_PASS
    changes_packet_policy: true
    limitation: production max_entries value is not admitted until empirical workload tests are completed
    expected_files:
      - nfq2/conntrack.c
      - nfq2/conntrack.h
      - nfq2/desync.c

  - sequence: 3
    path: security/native-admission/patches/zapret2-r28/0003-bounded-delayed-queue-bytes.patch
    purpose: add overflow-safe delayed raw-packet queue byte accounting without removing the existing packet-count bound
    sha256: 33fb3c7887e5e2cc0ad225d74318a9f2d5192179cf6b7671da75f75bd7335c68
    git_blob_sha1: 425614bf8f23cbe693e3ff2fb18512d052722f03
    status: CURRENT_PATCHSET_GATES_PASS
    changes_packet_policy: resource_saturation_only
    limitation: production max_bytes value is not admitted until empirical workload tests are completed
    expected_files:
      - nfq2/packet_queue.c
      - nfq2/packet_queue.h

  - sequence: 4
    path: security/native-admission/patches/zapret2-r28/0004-explicit-daemon-stdio-redirection.patch
    purpose: redirect daemon stdio deterministically through one /dev/null descriptor instead of relying on descriptor allocation order
    sha256: f32e0c27393bcdfa30aa7e8c58749bb9e70e2a870350f5c3cfa429597a887777
    status: CURRENT_PATCHSET_GATES_PASS
    changes_packet_policy: false
    limitation: runtime daemon lifecycle is not yet admitted
    expected_files:
      - nfq2/sec.c

  - sequence: 5
    path: security/native-admission/patches/zapret2-r28/0005-fail-closed-zero-conntrack-budget.patch
    purpose: make an unconfigured zero conntrack budget fail closed for new state instead of silently allowing unlimited state
    sha256: 67cbbfa656c47b7342a8c56ab178716e7890de0f05efc25eed2cc20b299c4ed1
    git_blob_sha1: 4f3582eea971885fabdd1ea6bc8423187b8e70e8
    status: CURRENT_PATCHSET_GATES_PASS
    changes_packet_policy: resource_saturation_and_unconfigured_budget_only
    expected_files:
      - nfq2/conntrack.c
    semantics:
      zero_budget_existing_flow_lookup: ALLOW
      zero_budget_new_flow: CTRACK_FEED_RESOURCE_EXHAUSTED
      main_desync_effect: VERDICT_PASS_BEFORE_DESYNC
    limitation: production numeric max_entries is still not selected or admitted

  - sequence: 6
    path: security/native-admission/patches/zapret2-r28/0006-fail-closed-zero-delayed-queue-budget.patch
    purpose: make zero or unconfigured delayed-queue byte budget fail closed for new delayed packet state instead of silently allowing an unlimited byte queue
    sha256: f5f3c01c73db3584513adc345da838bef6035c95a59762c469a386c7ad201d97
    git_blob_sha1: 2a5165f5b562635dace89ae5069bdb791b69668c
    status: CURRENT_PATCHSET_GATES_PASS
    changes_packet_policy: resource_saturation_and_unconfigured_budget_only
    expected_files:
      - nfq2/packet_queue.c
    semantics:
      zero_budget_new_delayed_packet: REJECT
      positive_budget_enqueue: ALLOW_WITHIN_BUDGET_ONLY
      packet_count_cap_preserved: true
      overflow_guard_preserved: true
    limitation: production numeric max_bytes and trusted runtime wiring are still not selected or admitted

verified_delta:
  - id: Z2-FORK-BASE-001
    status: PASS_FOR_RELATIONSHIP_ONLY
    finding: UAF fix is a direct child of the exact v1.0.6 release commit.
    limitation: This is not full engine admission.

  - id: Z2-SEMANTICS-002
    status: PASS_FOR_ISOLATED_RESOURCE_SEMANTICS
    finding: Conntrack resource exhaustion is explicit and the main path returns VERDICT_PASS before desync; zero conntrack budget rejects new state.
    limitation: Production numeric budgets are not selected.

  - id: Z2-PARSER-003
    status: PASS_FOR_BOUNDED_SANITIZER_AND_FUZZ_EVIDENCE
    finding: Current patchset passed deterministic ASan/UBSan parser regression and bounded coverage-guided fuzzing with no crash artifacts or network syscalls in checked scope.
    limitation: Bounded fuzzing does not prove absence of all parser defects.

  - id: Z2-RESOURCE-004
    status: PASS_FOR_ISOLATED_SYNTHETIC_RESOURCE_STRESS_ONLY
    finding: Conntrack caps and delayed queue packet/byte budgets remained bounded under repeated synthetic saturation/drain cycles without ASan/UBSan findings or network syscalls in checked scope.
    limitation: Synthetic stress does not select production resource budgets.

  - id: Z2-DELAYED-005
    status: PASS_FOR_ZERO_DELAYED_QUEUE_BUDGET_SEMANTICS
    finding: Zero or unconfigured delayed-queue byte budget now rejects new delayed packet state; positive budgets remain bounded and packet-count/overflow guards are preserved.
    limitation: This does not select a positive lab or production byte budget and does not authorize runtime execution.

