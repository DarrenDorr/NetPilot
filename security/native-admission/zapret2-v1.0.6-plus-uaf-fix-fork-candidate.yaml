verified_delta:
  - id: Z2-FORK-BASE-001
    status: PASS_FOR_RELATIONSHIP_ONLY
    finding: UAF fix is a direct child of the exact v1.0.6 release commit.
    limitation: This is not full engine admission.

  - id: Z2-SEMANTICS-002
    status: PASS_FOR_ISOLATED_RESOURCE_SEMANTICS
    finding: Resource exhaustion has a distinct internal result and main path returns VERDICT_PASS before dp_find/desync; zero budget is fail-closed for new state.
    limitation: Production numeric budgets are not selected.

  - id: Z2-PARSER-003
    status: PASS_FOR_BOUNDED_SANITIZER_AND_FUZZ_EVIDENCE
    finding: Current patchset passed deterministic ASan/UBSan parser regression and bounded libFuzzer/ASan/UBSan coverage-guided fuzzing with no crash artifacts or network syscalls.
    limitation: Bounded fuzzing does not prove absence of all parser defects.

  - id: Z2-RESOURCE-004
    status: PASS_FOR_ISOLATED_SYNTHETIC_RESOURCE_STRESS_ONLY
    finding: Conntrack caps and delayed queue packet/byte budgets remained bounded under repeated synthetic saturation/drain cycles without ASan/UBSan findings or network syscalls.
    limitation: Synthetic stress does not select production resource budgets.

