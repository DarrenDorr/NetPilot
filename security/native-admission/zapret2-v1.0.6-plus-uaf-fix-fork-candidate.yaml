patch_series:
  - sequence: 1
    path: security/native-admission/patches/zapret2-r28/0001-explicit-conntrack-feed-result.patch
    purpose: behavior-preserving refactor of ambiguous bool feed result before any resource cap is introduced
    status: APPLY_CHECK_REQUIRED
    changes_packet_policy: false
    expected_files:
      - nfq2/conntrack.c
      - nfq2/conntrack.h
      - nfq2/desync.c
      - nfq2/lua.c

verified_delta:
  - id: Z2-FORK-BASE-001
    status: PASS_FOR_RELATIONSHIP_ONLY
    finding: Исправление UAF является прямым дочерним коммитом точного релизного коммита v1.0.6.
    evidence: Коммит 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d имеет единственного родителя 221d7dff24bfec0cd5ac0a5070b8acef2008af3d и tree 5c2a77786cc7089145abe2ca99bcc53a8ed7de15.
  - id: Z2-FORK-BASE-002
    status: PASS_FOR_KNOWN_UAF_FIX_ONLY
    finding: Патч сбрасывает сохранённое представление reassembly payload после освобождения буфера перед повторным разбором.
    limitation: Это подтверждает исправление ранее найденного UAF, но не является полным security admission всего движка.
  - id: Z2-SEMANTICS-003
    status: DESIGN_VERIFIED
    finding: ConntrackPoolFeed()==false в main desync path не означает pass-through; play_prolog продолжает без conntrack и может применить stateless desync.
    effect: Простой count cap с return false отклонён. Resource saturation должен иметь отдельный internal result и явный VERDICT_PASS до dp_find/desync processing.

provenance_gate:
  workflow_status: REQUIRED_EVIDENCE
  execution_scope: source_checkout_and_metadata_only
  native_execution_allowed: false
  driver_install_allowed: false
  checks:
    - exact head commit
    - exact parent commit
    - exact tree
    - delta contains only nfq2/desync.c
    - expected UAF-fix source assertions
    - patch 0001 git apply check and exact touched-file allowlist
    - SHA-256 evidence artifact
  workflow_actions_pinned_by_full_sha: true
  checkout_credentials_persisted: false
  runner: ubuntu-24.04

residual_review_blockers:
  - id: Z2-STATE-001
    title: Нет продуктового агрегатного лимита conntrack/ipcache.
    required_action: Сначала ввести explicit conntrack feed result, отделяющий обычное отсутствие track от resource exhaustion; затем resource saturation main path должен завершаться с VERDICT_PASS до dp_find/desync, без вытеснения активных tracks.
  - id: Z2-DELAYED-QUEUE-002
    title: Delayed raw packet queue имеет packet-count bound, но нужен отдельный byte budget.
    required_action: Добавить overflow-safe queued-bytes accounting до allocation/copy и regression tests enqueue/dequeue/destroy/saturation, не ослабляя 64-packet cap.
  - id: Z2-HOSTNAME-003
    title: Packet-derived hostname не должен становиться доверенным постоянным содержимым auto-hostlist/log.
    required_action: Persistent auto-hostlist выключен в первом production profile; не включать без отдельной валидации/квот/recovery review.
  - id: Z2-DNSCACHE-004
    title: Экспериментальный ipcache-hostname не имеет достаточной корреляции DNS-ответов.
    required_action: Функция выключена в первом production profile и не допускается без отдельного review.
  - id: Z2-LUA-005
    title: Upstream имеет мощную Lua/CLI поверхность.
    required_action: Пользовательский Lua/raw CLI запрещены; project-owned Lua допустим только при hash pinning и отдельном admission, если вообще понадобится.
  - id: Z2-DEPS-006
    title: WinDivert, Cygwin и итоговые Windows-бинарники ещё не переинвентаризированы для patched build.
    required_action: Controlled build, полный native inventory, SHA-256, PE/signatures и provenance.
  - id: Z2-SUPPLY-007
    title: Upstream Windows build recipe не соответствует строгому immutable pinning NetPilot.
    required_action: Pin full action SHAs, exact Cygwin/toolchain, Lua/LuaJIT и WinDivert inputs with expected hashes before use; emit build manifest/SBOM.

fork_rules:
  - Ветвить только от exact v1.0.6 commit 221d7dff24bfec0cd5ac0a5070b8acef2008af3d.
  - Первым обязательным upstream-изменением применять exact UAF fix 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d.
  - Не сливать текущий upstream master автоматически.
  - Каждый дополнительный upstream commit проходит отдельный diff review и CI до включения.
  - Поддерживать минимальный NetPilot patchset и журнал происхождения каждого патча.
  - Не patch'ить необязательные опасные функции только ради их сохранения: auto-hostlist/ipcache-hostname/raw Lua могут оставаться недоступными.
  - Собственная версия не должна выдаваться за официальный zapret2; пример схемы версии: 1.0.6-np.1.
  - Release asset форка должен иметь immutable identity, SHA-256 и воспроизводимое происхождение сборки, где это возможно.
  - Runtime получает только фиксированный executable и валидированный ArgumentList из allowlist.

required_before_admit:
  - Успешное evidence от Native Candidate Provenance workflow для exact source anchor и patch 0001 applicability.
  - Реализовать behavior-preserving feed-result refactor, затем aggregate conntrack budget и delayed queue byte budget согласно docs/ZAPRET2-CONNTRACK-SATURATION-R28.2.md.
  - Controlled source build с pinned immutable actions/toolchain/dependency hashes.
  - Полный Windows x64 inventory EXE/DLL/SYS с SHA-256 и проверкой подписей.
  - Sanitizer/static-analysis tests для доступных платформ и parser fuzz regression tests.
  - Изолированные runtime tests: start, stop, crash, cleanup, HTTPS, Discord TCP/UDP, повторный запуск.
  - Измерить resource caps на browser/YouTube/Discord/combined/burst/hostile workload до фиксации production значений.
  - Повторный review WinDivert/Cygwin и актуальных advisory/CVE/KEV для exact component set.
  - Только после всех проверок новый manifest может получить admission_status: ADMIT.

notes:
  - Исходный zapret2 v1.0.6 остаётся навсегда BLOCK в отдельном manifest и не переопределяется этим кандидатом.
  - Этот record не разрешает сборку для пользователей, установку, запуск или интеграцию native engine.
  - REVIEW и BLOCK никогда не трактуются как PASS или ADMIT.
