residual_review_blockers:
  - id: Z2-STATE-001
    title: Production conntrack budget is not selected or integrated.
    required_action: Measure browser/YouTube/Discord/combined/burst/hostile workloads and select a nonzero limit from evidence.

  - id: Z2-DELAYED-QUEUE-002
    title: Production max_bytes for delayed queue is not selected from real workload evidence.
    required_action: Controlled workload measurements must choose max_bytes without weakening the packet-count cap.

  - id: Z2-HOSTNAME-003
    title: Packet-derived hostname must not become trusted persistent auto-hostlist/log content.
    required_action: Persistent auto-hostlist stays disabled in the first production profile unless separately admitted with validation, quotas and recovery review.

  - id: Z2-DNSCACHE-004
    title: Experimental ipcache-hostname lacks sufficient DNS response correlation for first production admission.
    required_action: Keep the feature disabled until a separate review.

  - id: Z2-LUA-005
    title: Upstream exposes a powerful Lua/CLI surface.
    required_action: User Lua/raw CLI remain forbidden; project-owned Lua requires hash pinning and separate admission if ever needed.

  - id: Z2-DEPS-006
    title: WinDivert provenance/inventory are known but runtime driver safety and the full Windows component set are not admitted.
    required_action: Do not load the driver before WD-RUNTIME-001/WD-LIFECYCLE-002 are closed and an isolated Windows lifecycle lab is approved.

  - id: Z2-SUPPLY-007
    title: Build chain is not fully reproducible at the level of all transitive Cygwin package identities.
    required_action: Pin or inventory exact package identities/SBOM; drift requires readmission.

  - id: Z2-RUNTIME-008
    title: Compile/sanitizer/fuzz/stress evidence does not equal real engine runtime evidence.
    required_action: Define a separate lab-execution gate before any candidate engine process or packet interception is permitted.

  - id: WD-RUNTIME-001
    title: WinDivert v2.2.2 has an open upstream driver-load initialization race report with possible BSOD 0xD1.
    upstream_issue: https://github.com/basil00/WinDivert/issues/408
    current_state: OPEN_CONFIRMED_2026-10-29
    required_action: Reviewed upstream fix/readmission, proven safe lifecycle model, or reject WinDivert as the production Windows backend.

  - id: WD-LIFECYCLE-002
    title: Stopping WinDivert service while foreign handles remain can leave ERROR_SERVICE_DISABLED 1058 and a locked driver file.
    required_action: Do not use unconditional stop/remove; design shared-driver ownership/coexistence/update/uninstall policy and verify in an isolated VM.

  - id: WD-DEFENDER-003
    title: Exact WinDivert-2.2.2-A has a fresh upstream Defender quarantine report without artifact-specific resolution.
    required_action: Never disable Defender or add exclusions; obtain reviewed disposition/replacement before admission.

fork_rules:
  - Fork only from exact v1.0.6 commit 221d7dff24bfec0cd5ac0a5070b8acef2008af3d.
  - Apply exact UAF fix 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d first.
  - Never auto-merge upstream master.
  - Every extra upstream commit requires separate diff review and CI.
  - Keep the NetPilot patchset minimal and provenance-tracked.
  - Optional risky features such as persistent auto-hostlist, ipcache-hostname and raw Lua may remain unavailable instead of being preserved.
  - Do not present our build as official zapret2; example version scheme is 1.0.6-np.1.
  - Fork release assets require immutable identity, SHA-256 and reproducible provenance where feasible.
  - Runtime may receive only a fixed executable and validated ArgumentList from an allowlist.
  - Typed production adapter must set a nonzero conntrack budget; zero is a fail-closed unconfigured state.
  - Windows driver load remains prohibited while WinDivert runtime blockers are open.

required_before_admit:
  - Choose production conntrack and delayed-queue budgets from controlled real workload evidence.
  - Define and approve a lab-execution gate before any native engine process/network interception test.
  - Close WinDivert runtime/lifecycle blockers or select a Windows backend that does not depend on the blocked component set.
  - Build a complete Windows component-set manifest/SBOM and verify provenance of every runtime dependency.
  - Perform isolated platform runtime tests: start, stop, crash, cleanup, HTTPS, Discord TCP/UDP and restart.
  - Repeat advisory/CVE/KEV review for the exact component set immediately before the admission decision.
  - Perform a separate HIGH_ASSURANCE/human review before production activation.
  - Only then may a future manifest set admission_status: ADMIT.

notes:
  - Official zapret2 v1.0.6 remains permanently BLOCK in its separate manifest.
  - Historical PASS does not transfer automatically to a changed source or patchset.
  - Provenance/compile/sanitizer/fuzz/stress PASS values are scoped evidence, not ADMIT.
  - NotSigned on controlled winws2 or WinDivert.dll is not automatically malware; production trust still requires immutable provenance/hash enforcement and a signing policy.
  - WinDivert inventory PASS does not permit loading the kernel driver.
  - Windows and Linux admission may diverge; Windows WinDivert blockers do not automatically invalidate Linux candidate research.
  - This record does not authorize installation, execution or production integration of a native engine.
  - REVIEW and BLOCK are never interpreted as PASS or ADMIT.
