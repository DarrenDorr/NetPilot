verified_delta:
  - id: Z2-FORK-BASE-001
    status: PASS_FOR_RELATIONSHIP_ONLY
    finding: Исправление UAF является прямым дочерним коммитом точного релизного коммита v1.0.6.
    limitation: Это не является полным admission движка.

  - id: Z2-SEMANTICS-002
    status: DESIGN_VERIFIED
    finding: Resource exhaustion получает отдельный internal result и в main path приводит к VERDICT_PASS до dp_find/desync.
    limitation: Числовой production budget ещё не определён.

  - id: Z2-PARSER-003
    status: PASS_FOR_ISOLATED_PROTOCOL_PARSER_SANITIZER_REGRESSION_ONLY
    finding: Exact post-UAF source плюс patches 0001-0004 прошли isolated ASan/UBSan parser corpus без network syscalls.
    limitation: После добавления patch 0005 current parser workflow обязан повторно пройти; historical PASS сам по себе не переводит текущий patchset в ADMIT.

  - id: Z2-PATCH-0005-004
    status: DESIGN_FIXED_REGRESSION_PENDING
    finding: Нулевой conntrack budget больше не означает unlimited state; новый flow должен получать RESOURCE_EXHAUSTED.
    limitation: Новый exact patchset 0001-0005 ещё должен пройти provenance/compile/sanitizer/conntrack gates.

