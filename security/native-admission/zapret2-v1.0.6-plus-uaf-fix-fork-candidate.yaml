residual_review_blockers:
  - id: Z2-STATE-001
    title: Механизм aggregate conntrack budget уже компилируется, но production value и runtime saturation behavior не доказаны.
    required_action: Измерить browser/YouTube/Discord/combined/burst/hostile workloads; подтвердить fail-safe VERDICT_PASS при saturation и выбрать лимит по evidence, а не на глаз.

  - id: Z2-DELAYED-QUEUE-002
    title: Изолированный ASan/UBSan regression packet queue PASS, но production max_bytes и реальная workload-модель ещё не доказаны.
    required_action: Controlled load tests enqueue/dequeue/destroy/saturation и выбор max_bytes по измерениям без ослабления 64-packet cap.

  - id: Z2-HOSTNAME-003
    title: Packet-derived hostname не должен становиться доверенным постоянным содержимым auto-hostlist/log.
    required_action: Persistent auto-hostlist выключен в первом production profile; не включать без отдельной валидации/квот/recovery review.

  - id: Z2-DNSCACHE-004
    title: Экспериментальный ipcache-hostname не имеет достаточной корреляции DNS-ответов.
    required_action: Функция выключена в первом production profile и не допускается без отдельного review.

  - id: Z2-LUA-005
    title: Upstream имеет мощную Lua/CLI поверхность.
    required_action: Пользовательский Lua/raw CLI запрещены; project-owned Lua допустим только при hash pinning и отдельном admission, если вообще понадобится.

  - id: Z2-DEPS-006
    title: WinDivert provenance/inventory получены, но runtime driver safety и полный Windows component set ещё не допущены.
    required_action: Не загружать driver до закрытия WD-RUNTIME-001/WD-LIFECYCLE-002, component-set SBOM и isolated Windows runtime lab.

  - id: Z2-SUPPLY-007
    title: Build chain ещё не полностью воспроизводима на уровне всех транзитивных Cygwin packages.
    required_action: Зафиксировать/проверить exact package identities или воспроизводимый build environment; сохранить SBOM/build manifest; любое drift требует readmission.

  - id: Z2-RUNTIME-008
    title: Static compile и изолированный queue harness не дают полного runtime evidence.
    required_action: Завершить parser sanitizer/fuzz, resource/load и затем изолированный runtime lab без production activation.

  - id: WD-RUNTIME-001
    title: WinDivert v2.2.2 имеет открытый upstream report о driver-load initialization race с возможным BSOD 0xD1.
    required_action: Reviewed upstream fix + readmission, либо доказанная безопасная lifecycle-модель с concurrent-open stress, либо отказ от WinDivert production backend.

  - id: WD-LIFECYCLE-002
    title: Остановка WinDivert service при чужих открытых handles может оставить ERROR_SERVICE_DISABLED 1058 и заблокированный driver file.
    required_action: Не применять безусловный stop/remove; разработать shared-driver ownership/lifecycle policy и проверить coexistence/update/uninstall в изолированной VM.

  - id: WD-DEFENDER-003
    title: Для exact официального WinDivert-2.2.2-A.zip существует текущий upstream report Defender Misleading:Win32/Malgent!AMTB без artifact-specific resolution.
    required_action: Не отключать Defender/не добавлять exclusions; до admission получить reviewed disposition/replacement либо использовать другой component set.

fork_rules:
  - Ветвить только от exact v1.0.6 commit 221d7dff24bfec0cd5ac0a5070b8acef2008af3d.
  - Первым обязательным upstream-изменением применять exact UAF fix 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d.
  - Не сливать текущий upstream master автоматически.
  - Каждый дополнительный upstream commit проходит отдельный diff review и CI до включения.
  - Поддерживать минимальный NetPilot patchset и журнал происхождения каждого патча.
  - Не patch'ить необязательные опасные функции только ради их сохранения: auto-hostlist/ipcache-hostname/raw Lua могут оставаться недоступными.
  - Собственная версия не должна выдаваться за официальный zapret2; пример схемы версии: 1.0.6-np.1.
  - Release asset форка должен иметь immutable identity, SHA-256 и воспроизводимое происхождение сборки, где это возможно.
  - Runtime получает только фиксированный executable и валидированный ArgumentList из allowlist.

required_before_admit:
  - Завершить protocol parser sanitizer/fuzz regression на exact patched source и устранить/зафиксировать все findings.
  - Провести controlled resource/load tests и выбрать production conntrack/max_bytes значения по измерениям.
  - Закрыть WinDivert runtime/lifecycle blockers либо выбрать Windows backend без WinDivert.
  - Сформировать полный Windows component-set manifest/SBOM и проверить provenance всех runtime dependencies.
  - Выполнить изолированные runtime tests: start, stop, crash, cleanup, HTTPS, Discord TCP/UDP, повторный запуск.
  - Повторить advisory/CVE/KEV review для exact component set непосредственно перед admission decision.
  - Выполнить отдельный HIGH_ASSURANCE/human review перед production activation.
  - Только после всех проверок новый manifest может получить admission_status: ADMIT.

notes:
  - Исходный zapret2 v1.0.6 остаётся навсегда BLOCK в отдельном manifest и не переопределяется этим кандидатом.
  - Успешные provenance/compile/sanitizer gates не являются ADMIT и не разрешают native execution.
  - NotSigned у controlled winws2 и WinDivert.dll не трактуется автоматически как вредоносность; production trust требует immutable provenance/hash enforcement и отдельной signing policy.
  - WinDivert inventory PASS не разрешает загрузку kernel driver.
  - Windows и Linux admission могут расходиться: WinDivert blockers не должны блокировать Linux-кандидат автоматически.
  - Этот record не разрешает установку, запуск или production-интеграцию native engine.
  - REVIEW и BLOCK никогда не трактуются как PASS или ADMIT.
