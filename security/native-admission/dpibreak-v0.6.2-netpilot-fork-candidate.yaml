active_patch_series:
  - sequence: 1
    path: security/native-admission/patches/dpibreak-r28/0001-remove-global-windivert-service-stop.patch
    git_blob_sha1: 3f731650c83e56f717a7709084fd5873e7cb99eb
    sha256: aa3e7681be056dfc5f1a1c83872b2ae5ea7058744261a0c3040cd1a092d55bce
    purpose: remove app-controlled global WinDivert service stop/uninstall API from the NetPilot candidate path and leave only candidate-owned handle close
    security_scope:
      - mitigates WinDivert issue 406 shared-service lifecycle risk at the DPIBreak source boundary
      - removes CloseAction::Uninstall from the in-tree wrapper surface
      - removes SC_MANAGER_ALL_ACCESS/SERVICE_CONTROL_STOP code from the hardened candidate wrapper
    does_not_fix:
      - WinDivert issue 408 kernel driver initialization race
      - unused TLS/event cache lifecycle
      - all abnormal process termination paths
    status: PASS_FOR_EXACT_SOURCE_APPLICABILITY_ONLY

  - sequence: 2
    path: security/native-admission/patches/dpibreak-r28/0002-always-revalidate-clienthello.patch
    git_blob_sha1: 733a8c989e22790b5518468af61a5041e65c1238
    sha256: 2620c5823e8b0f527048bd0e112b00565e5517d9923a537a9a947b4c5774d8ef
    purpose: always revalidate TLS ClientHello in userspace instead of trusting kernel prefilter classification after NFQUEUE/GSO segmentation
    security_scope:
      - continuation/non-ClientHello packets fail safe to the normal unhandled/accept path
      - reduces issue 24 misclassification risk without adding new interception capability
    does_not_fix:
      - full GSO delivery semantics
      - MTU/EMSGSIZE behavior
      - effectiveness when a ClientHello prefix itself is too short for recognition
    status: PASS_FOR_EXACT_SOURCE_APPLICABILITY_ONLY

  - sequence: 3
    path: security/native-admission/patches/dpibreak-r28/0003-disable-custom-nft-executable.patch
    git_blob_sha1: d27efdb337fabe15745832d00acbb6a039f7cb7c
    sha256: 1a0cbde6714c05e35da0004b36dd3e5c25f32f3d4086195dd64015f8fdc2acb1
    purpose: reject --nft-command in the hardened build so a root candidate cannot be pointed at a user-selected executable
    security_scope:
      - closes privileged executable-selection surface as defense in depth
      - default nft executable remains fixed by source
      - removes unused mutability introduced by disabling the runtime override
    does_not_fix:
      - nftables/iptables lifecycle ownership and rollback
      - queue-number policy
      - all Linux firewall compatibility concerns
    status: PASS_FOR_EXACT_SOURCE_APPLICABILITY_ONLY

prepared_inactive_patches:
  - sequence: 4
    path: security/native-admission/patches/dpibreak-r28/0004-remove-unused-windivert-tls-event-cache.patch
    git_blob_sha1: 19ecb3b22202a6d5f25ec3ab5c45d0f8f3773647
    status: REVIEW_ONLY_NOT_IN_ACTIVE_PATCHSET
    purpose: remove the unused per-handle TLS/event cache instead of trying to add cleanup around an unreachable helper path
    activation_rule: do not add until active patchset 0001-0003 passes exact source gate and 0004 independently applies/compiles
  - sequence: 5
    path: security/native-admission/patches/dpibreak-r28/0005-idempotent-windivert-handle-drop.patch
    git_blob_sha1: 656563a27f44e8aa0e25702865bfa8e1802745e1
    status: REVIEW_ONLY_NOT_IN_ACTIVE_PATCHSET
    purpose: make close idempotent and add Drop so candidate-owned WinDivert handles close on early-return paths without global service stop
    depends_on: patch 0004 source shape
    activation_rule: do not add until 0004 passes independent source/compile review

