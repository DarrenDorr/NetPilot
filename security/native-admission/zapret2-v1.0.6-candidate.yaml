blocking_findings:
  - id: ZAPRET2-1.0.6-UAF-001
    severity: BLOCK
    title: Heap use-after-free in cancelled TLS reassembly path
    affected_release_commit: 221d7dff24bfec0cd5ac0a5070b8acef2008af3d
    upstream_issue: https://github.com/bol-van/zapret2/issues/335
    evidence: The issue reproduces a heap-use-after-free read against the exact v1.0.6 tag commit using the real nfqws2 under ASan. The path is reachable with default reassembly and conntrack plus a matching Lua desync profile.
    upstream_fix_commit: 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d
    fix_commit_date: 2026-10-22T08:06:42Z
    release_contains_fix: false
    decision: BLOCK
    rationale: A post-release master fix cannot retroactively make the immutable identity of the reviewed v1.0.6 archive safe. NetPilot must not execute or integrate this release.

  - id: ZAPRET2-1.0.6-STATE-002
    severity: REVIEW_BLOCKING_FOR_HOSTILE_ENVIRONMENT
    title: No aggregate bound on conntrack and ipcache state
    upstream_issue: https://github.com/bol-van/zapret2/issues/335
    evidence: Reporter demonstrated growth by large numbers of distinct flows/addresses; upstream maintainer explicitly chose not to add the proposed aggregate limits and recommends reduced conntrack timeouts for high-load or potentially hostile environments.
    decision: BLOCK_FOR_THIS_CANDIDATE
    rationale: NetPilot cannot assume all future deployments are trusted single-device environments; failure-safe resource bounds need a product-level decision before admission.

  - id: ZAPRET2-1.0.6-HOSTNAME-003
    severity: REVIEW
    title: Packet-derived hostname data can reach line-oriented auto-hostlist and log sinks
    upstream_issue: https://github.com/bol-van/zapret2/issues/335
    evidence: Issue reports line injection and a persistent availability failure through crafted auto-hostlist content on the exact release commit.
    decision: BLOCK_FOR_THIS_CANDIDATE
    rationale: NetPilot must not rely on untrusted packet bytes becoming trusted persistent configuration without a separately reviewed containment boundary.

  - id: ZAPRET2-1.0.6-DNSCACHE-004
    severity: REVIEW
    title: DNS responses may seed global ipcache without query correlation when experimental hostname caching is enabled
    upstream_issue: https://github.com/bol-van/zapret2/issues/335
    evidence: The reported feature is off by default, but the exact release commit lacks transaction and flow correlation for this path.
    decision: DO_NOT_ENABLE
    rationale: Even a future admitted engine adapter must keep this capability disabled unless separately reviewed and justified.

