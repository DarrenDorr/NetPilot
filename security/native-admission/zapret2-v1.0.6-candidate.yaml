future_candidate_requirements:
  - Do not reconsider v1.0.6; open a new admission record for a newer exact tagged release.
  - Require the new tag to contain the UAF fix or an equivalent audited correction.
  - Re-run exact archive identity, complete native inventory and hashes; never inherit identities from v1.0.6.
  - Re-run current upstream issue/security report and CVE/NVD/OSV/CISA KEV applicability review.
  - Re-review resource exhaustion exposure and decide product-level conntrack/ipcache limits or safe deployment assumptions.
  - Keep packet-derived auto-hostlist persistence disabled unless separately contained and reviewed.
  - Keep experimental ipcache-hostname behavior disabled unless separately reviewed.
  - Re-review Cygwin and WinDivert identities/advisories for the exact new release.
  - Define and review exact project-owned Lua modules with immutable SHA-256 before any integration.
  - Keep typed allowlisted profile compilation and no raw args.
  - Review crash, stop, service-failure and uninstall cleanup behavior.
  - Only a new candidate that completes all applicable checks may become ADMIT.

evidence:
  - Official GitHub release API identifies v1.0.6 as published 2026-10-21 and reports zapret2-v1.0.6.zip SHA-256 e141b51b60c895fe9548f4d644365461dcad8155e068d284a9aae1724504237d.
  - Zapret2 Candidate Evidence run 40659130327 completed successfully and recorded 14 native components across x64/x86 without executing downloaded code.
  - Source/docs show --lua-init file/code support and luaexec code expressions; this is treated as an upstream capability that NetPilot must deny to untrusted configuration.
  - Upstream issue 335 explicitly tests commit 221d7dff24bfec0cd5ac0a5070b8acef2008af3d and reports a reproducible heap-use-after-free plus three additional state/input-handling findings.
  - Upstream maintainer states finding 1 is fixed and declines the other proposed complexity/resource-limit changes for the project's normal single-device/home-router usage model.
  - Commit 4a33055448ce5f4e7acc704e1fbe0d8a8a6aa08d dated 2026-10-22 is titled 'nfqws2: fix UAF' and resets the reassembly data view after cancellation before rediscovery.

notes:
  - Identity/provenance evidence does not override a demonstrated memory-safety defect in the exact release artifact.
  - The v1.0.6 ZIP remains permanently BLOCKED for NetPilot; a later master commit does not modify its reviewed bytes.
  - Nothing in this record authorizes installation, execution, bundling or activation of zapret2.
  - A future fixed release starts a new admission from zero; UNKNOWN/REVIEW/BLOCK are never treated as PASS.
