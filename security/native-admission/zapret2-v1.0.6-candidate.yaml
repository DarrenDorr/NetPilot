security_boundaries:
  - id: NETP-Z2-BOUNDARY-001
    title: Arbitrary Lua must not cross the NetPilot strategy boundary
    status: REQUIRED
    rationale: zapret2 intentionally supports Lua files and Lua code through command-line options, including --lua-init and luaexec code paths. This upstream capability must not become a user/config/remote execution surface in NetPilot.
    requirements:
      - NetPilot strategy/config contains only a typed versioned schema and predefined profile IDs.
      - User input may never become a raw zapret2 argument string.
      - User/config/network/LLM input may never populate --lua-init, Lua file paths, or luaexec:code.
      - Only project-owned Lua modules pinned by exact SHA-256 and shipped in a non-user-writable privileged runtime directory may be referenced.
      - The service constructs a fixed executable path and validated argument array from allowlisted enums/ranges.
      - Unknown flags, unknown profile fields and path-bearing values fail closed.

  - id: NETP-Z2-BOUNDARY-002
    title: Do not ship the full upstream utility set by default
    status: REQUIRED
    rationale: NetPilot should minimize privileged attack surface and install only runtime components proven necessary for the selected engine path.
    requirements:
      - ip2net.exe, mdig.exe and killall.exe are excluded unless separately justified and admitted.
      - 32-bit binaries are excluded on the x64 NetPilot Windows target unless a documented requirement is approved.

