required_before_admit:
  - Patch 0001 must apply cleanly to exact release tree and compile on Linux and Windows x64.
  - Runtime loopback-only regression must prove no listener appears on wildcard or LAN interfaces.
  - Connection and UDP state resource budgets must be measured and fixed as internal typed policy.
  - File/path/raw-data CLI surfaces must remain unreachable from NetPilot UI, IPC and config.
  - Android VpnService and TUN-to-SOCKS components require separate provenance, lifecycle and DNS/UDP review.
  - Windows system-wide transparent routing requires a separately admitted routing component.
  - Selected reliability backports must be reviewed independently with regression tests.
  - Exact build toolchains and output hashes must be recorded before any runtime admission.
  - Advisory review and HIGH_ASSURANCE human review are required before ADMIT.

notes:
  - ByeDPI itself is a local SOCKS proxy and does not make Windows applications transparently use it.
  - The upstream default listener is 0.0.0.0:1080; NetPilot must never inherit that exposure.
  - Patch identity is anchored by both Git blob SHA-1 and SHA-256 of canonical Git-object bytes; working-tree newline conversion is not a trust input.
  - No native binary from this candidate is currently allowed to execute from NetPilot.
