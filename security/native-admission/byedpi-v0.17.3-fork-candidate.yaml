patch_series:
  - sequence: 1
    path: security/native-admission/patches/byedpi-r28/0001-loopback-only-listener.patch
    purpose: make loopback the default listener and reject non-loopback --ip values as defense in depth
    git_blob_sha1: fa9ba3349792d66f40d925bc612310e8d18aae8a
    sha256: 3e9a744830082d224592d730a816c4afcf9df15a2a6ab93870409ccf5c94c068
    status: PASS_FOR_FULL_PATCHSET_COMPILE_ONLY
    expected_files: [main.c]
    limitation: runtime loopback enforcement is not yet tested

  - sequence: 2
    path: security/native-admission/patches/byedpi-r28/0002-kavl-iterator-no-before-array-sentinel.patch
    purpose: remove one-before-array iterator sentinel UB and represent empty iterator with null top
    git_blob_sha1: 6f51d66597847ee49e373922e4905c80b8ee2f47
    sha256: 6701c48ef00f81ca7fa95f98a1e6406f657fbdfc028371f568c7918106cd5fb7
    status: PASS_WITH_KAVL_SANITIZER_AND_FULL_PATCHSET_COMPILE
    expected_files: [kavl.h]
    limitation: runtime candidate remains blocked

  - sequence: 3
    path: security/native-admission/patches/byedpi-r28/0003-pid-file-fail-safe-write.patch
    purpose: make PID-file locking/truncation/write handling fail safe and cleanup descriptor state deterministically
    git_blob_sha1: d56d0f8659a49c48c923b6af85a523a952e77e0c
    sha256: 5d10702499581eeba2f632aa506b5d6c51ceb3e8e093bff25b8dcbc821bb3738
    status: PASS_TARGETED_STATIC_AND_FULL_PATCHSET_COMPILE_ONLY
    expected_files: [main.c]
    limitation: runtime PID-file lifecycle is not admitted

  - sequence: 4
    path: security/native-admission/patches/byedpi-r28/0004-kavl-empty-erase-guard.patch
    purpose: return safely when KAVL erase/erase-first is called on an empty tree instead of indexing path[-1]
    git_blob_sha1: 9b196b289efd9a2ea1118c5504f4a811aa0becd2
    sha256: fdc13219be9cb9d654ce7995df825decb6ee0f05e63d72481560977bbf3b3c4a
    status: PASS_FOR_ISOLATED_ASAN_UBSAN_KAVL_REGRESSION_AND_FULL_PATCHSET_COMPILE
    expected_files: [kavl.h]
    finding: upstream empty-tree erase path produced UBSan index -1 out of bounds after final erase loop check
    limitation: candidate runtime remains blocked

  - sequence: 5
    path: security/native-admission/patches/byedpi-r28/0005-windows-socket-handle-narrowing-guard.patch
    purpose: validate pointer-sized Windows SOCKET values before narrowing them into the upstream int-based event-pool representation
    git_blob_sha1: d5cde98057a0ded600468b1f1c69d2e55c3b4d6e
    sha256: 7c8f4eee9ff2624346cb886027df66378773d0af04f5f84f54c30815104b4356
    status: PASS_FOR_FULL_PATCHSET_COMPILE_AND_TARGETED_WARNING_GATE
    expected_files: [proxy.c, conev.c]
    finding: upstream v0.17.3 stores socket()/accept() results in int while Win64 SOCKET is pointer-sized unsigned
    patch_format_note: previous hunk metadata had invalid unified-diff line counts and was rejected fail-closed before compilation; logic was unchanged while hunk metadata was repaired
    semantics:
      invalid_socket: reject
      socket_above_INT_MAX: close_and_reject
      representable_socket: narrow_only_after_explicit_check
    limitation: runtime handle lifecycle is not yet tested

  - sequence: 6
    path: security/native-admission/patches/byedpi-r28/0006-windows-wait-result-range.patch
    purpose: classify WaitForMultipleObjects result without a redundant unsigned lower-bound test and only index successful object results
    git_blob_sha1: 0815be26534c291848a8b16bdedb07a6ab1e485f
    sha256: 136b9fdf34b68a55f0f1a6ebf16e8b61c9b88e6d15eeb923594bdd7bf0fa2a3e
    status: PASS_FOR_FULL_PATCHSET_COMPILE_AND_TARGETED_WARNING_GATE
    expected_files: [desync.c]
    finding: upstream comparison ret >= WAIT_OBJECT_0 is always true for DWORD because WAIT_OBJECT_0 is zero
    semantics:
      indexed_results: WAIT_OBJECT_0_through_WAIT_OBJECT_0_plus_MAX_TF_minus_one
      timeout_failed_abandoned_results: not_indexed
    limitation: runtime wait/cleanup behavior is not yet tested

  - sequence: 7
    path: security/native-admission/patches/byedpi-r28/0007-windows-aux-socket-probes.patch
    purpose: preserve pointer-sized SOCKET values in get_default_ttl and ipv6_support auxiliary probes instead of narrowing them to int on Win64
    git_blob_sha1: e7b590a7d0594be0629bac221cb120c165dab8cd
    sha256: 778f47d3ecf2d0f6c8ce0152766c0eb51e2d6e460923227bed49844ba18c0d25
    status: PASS_FOR_FULL_PATCHSET_COMPILE_AND_TARGETED_SOURCE_BOUNDARY_GATE
    expected_files: [main.c]
    finding: exact v0.17.3 also narrows socket(AF_INET/AF_INET6) results to int in two helper probes outside the event-pool ingress covered by patch 0005
    patch_history:
      - initial patch identity was superseded after rebasing onto the main.c state produced by patches 0001-0006
      - canonical Git blob identity and SHA-256 are pinned above
      - first source validator falsely matched the legitimate Unix #else int fd branch; validator was corrected without weakening Windows branch requirements
    semantics:
      windows_socket_type: SOCKET
      windows_failure_check: INVALID_SOCKET
      linux_socket_type: int
      linux_failure_check: fd_less_than_zero
    limitation: runtime auxiliary socket lifecycle is not yet tested

