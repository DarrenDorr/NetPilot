compile_warning_review:
  status: TARGETED_FIXES_COMPILE_PASS_REMAINING_UPSTREAM_DEBT_REVIEW_REQUIRED
  findings:
    - ignored write() result in init_pid_file on Linux: patched by 0003; targeted static PASS
    - KAVL one-before-array iterator sentinel: patched by 0002
    - KAVL empty-tree erase index -1 UB: patched by 0004 and isolated sanitizer PASS
    - Windows event descriptor signed/unsigned warning exposed a wider representation boundary: socket()/accept() return SOCKET but upstream event pool stores int; patched fail-closed at ingress by 0005 and targeted compile gate PASS
    - Windows WaitForMultipleObjects lower-bound comparison was always true for DWORD; patched by 0006 with explicit successful-object range and targeted compile gate PASS
    - Windows get_default_ttl/ipv6_support auxiliary probes also stored SOCKET in int; patched by 0007 with exact source-boundary gate PASS
    - broad -Wconversion on whole upstream main.c reports unrelated historical numeric conversions and remains separate review debt
  required_action: review remaining unrelated upstream warnings separately and complete pre-lab lifecycle/resource boundary design before any runtime approval

