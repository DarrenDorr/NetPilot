required_before_admit:
  - Compile-only PASS does not authorize execution; runtime loopback-only regression must prove no listener appears on wildcard or LAN interfaces.
  - Supervised start/stop/crash/timeout and residual listener/process cleanup require separate scoped lab evidence.
  - Connection and UDP state resource budgets must be measured and fixed as internal typed policy.
  - Unrelated upstream conversion warnings remain separate review debt and must not be silently suppressed in release review.
  - File/path/raw-data CLI surfaces must remain unreachable from NetPilot UI, IPC and config.
  - Android VpnService and TUN-to-SOCKS components require separate provenance, lifecycle and DNS/UDP review.
  - Windows system-wide transparent routing requires a separately admitted routing component.
  - Selected reliability backports must be reviewed independently with regression tests.
  - Exact runtime build hashes must be pinned in a candidate-specific lab approval before any candidate execution.
  - Advisory review and HIGH_ASSURANCE human review are required before ADMIT.

notes:
  - ByeDPI itself is a local SOCKS proxy and does not make Windows applications transparently use it.
  - Upstream v0.17.3 defaults to 0.0.0.0:1080; NetPilot patch 0001 changes this to loopback-only policy.
  - No native binary from this candidate is currently allowed to execute from NetPilot.
  - Patch 0005 preserves upstream int-based event-pool ABI but makes non-representable Win64 SOCKET fail closed before narrowing.
  - Patch 0007 covers the two auxiliary Windows socket probes that do not enter the event pool but still must retain pointer-sized SOCKET handles.
