boundaries:
  public_raw_path_input: FORBIDDEN
  public_url_input: FORBIDDEN
  arbitrary_command_or_argv: FORBIDDEN
  service_or_ipc_wiring: NOT_IMPLEMENTED
  runtime_network_acquisition: NOT_IMPLEMENTED
  installer_integration: NOT_IMPLEMENTED
  native_execution: NOT_IMPLEMENTED
  production_admission: BLOCK

evidence_required:
  - full_solution_build
  - windows_synthetic_repair_uninstall_tests
  - crash_point_recovery_tests
  - security_guard
  - localsystem_program_files_lab_before_next_gate
