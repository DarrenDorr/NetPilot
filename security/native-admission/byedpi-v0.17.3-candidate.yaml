static_review:
  document: docs/BYEDPI-STATIC-ADMISSION-R28.1.md
  baseline_decision: exact-v0.17.3
  full_post_release_head_as_fork_base: REJECT
  reason: 38 post-release commits include substantial feature and architecture expansion in addition to fixes; first NetPilot candidate must keep a minimal reviewed delta.

architecture_findings:
  - id: BYEDPI-LISTENER-001
    severity: BLOCK_FOR_UNCHANGED_INTEGRATION
    title: Upstream SOCKS listener по умолчанию привязан к 0.0.0.0:1080.
    evidence: Exact v0.17.3 main.c documents --ip default 0.0.0.0 and --port default 1080.
    required_action: NetPilot должен принудительно использовать только loopback и не предоставлять UI/API для открытия прокси в LAN/WAN.
  - id: BYEDPI-PROXY-002
    severity: ARCHITECTURE_REVIEW
    title: ByeDPI является локальным SOCKS proxy, а не прозрачным системным Windows packet engine.
    impact: Для system-wide Windows и Discord UDP потребуется отдельно проверенный TUN/WFP/tun2socks routing layer; сам ByeDPI не должен незаметно расширять привилегированную поверхность.
  - id: BYEDPI-FILES-003
    severity: REVIEW
    title: Upstream CLI принимает пути и произвольные данные.
    evidence: В v0.17.3 есть pidfile, cache-dump, hosts, ipset, fake-data и другие file/string параметры.
    required_action: NetPilot не передаёт пользовательские пути/файлы/raw CLI; только внутренние typed values и project-owned immutable data.
  - id: BYEDPI-RESOURCES-004
    severity: REVIEW
    title: Upstream connection count уже bounded: default max_open=512; parser требует >0 и <0xffff/2.
    required_action: Выбрать и проверить собственный product resource budget; пользователь не управляет raw --max-conn.

post_release_delta:
  status: CURATED_BACKPORT_REVIEW
  summary: Полный диапазон v0.17.3..ba532298 содержит 38 commits и не принимается целиком как fork base.
  architecture_expansion_observed:
    - External socks
    - cache file loading and per-group cache changes
    - Shadowsocks plugin
    - reconnect/group behavior changes
    - raw proxy mode
  backport_candidates:
    - commit: 57f9606feba6e06f9974e8502a21ce6672251548
      title: Fix fatal UDP tunnel closures caused by ICMP errors
      relevance: UDP reliability
      decision: HIGH_PRIORITY_REVIEW
      note: Exact v0.17.3 has the older on_udp_tunnel failure path; backport or minimal equivalent requires platform regression tests.
    - commit: 4ce80972fafe055cd64b857a6a48333179636ae9
      title: Dont ignore write result, check that the split position is a number
      relevance: input validation and error handling
      decision: REVIEW_FOR_MINIMAL_BACKPORT
    - commit: a5df2608ab99cac9d5b21d57d08e674af7852726
      title: Handle send error
      relevance: TCP error handling
      decision: REVIEW_OR_REIMPLEMENT
      note: Patch is based on later architecture and must not be blindly cherry-picked onto v0.17.3.
    - commit: ba532298de7b28cfe854aea83d061369d13ca290
      title: Save pointer to free before exit
      relevance: memory/resource cleanup for later post-release path
      decision: REVIEW_ONLY_IF_RELEVANT_PATH_INCLUDED
  decision: Exact v0.17.3 remains baseline; only individually reviewed fixes may be backported or minimally reimplemented. Full post-release head is not accepted.

fork_rules:
  - Baseline only on exact v0.17.3 release commit unless a separately admitted tagged successor is selected.
  - Do not merge latest/master automatically.
  - Do not cherry-pick post-release commits blindly; review patch dependencies and reimplement minimal equivalent when needed.
  - Force loopback-only listener; reject 0.0.0.0, :: and external interface bind in production NetPilot.
  - Do not expose listener bind address to GUI/IPC/config.
  - Prohibit user file/path/raw-data arguments.
  - Keep connection/buffer/timeout/UDP state bounded by an internal typed product policy.
  - Treat Windows transparent routing and Android VpnService/TUN as separate admission components.
  - Every upstream sync is a reviewed delta with new exact identity and tests.
  - Preserve MIT notice and use a distinct NetPilot fork version; never present the build as official ByeDPI.

platform_position:
  windows: secondary; requires separately reviewed transparent-routing layer for system-wide use
  linux: secondary/proxy candidate
  android: strong candidate through platform VpnService/TUN architecture, subject to separate Android admission

required_before_admit:
  - Finalize curated backport set against exact v0.17.3 and review every resulting patch.
  - Controlled source build with pinned toolchain and dependency/build inventory.
  - Native inventory and SHA-256 of final Windows/Linux/Android artifacts as applicable.
  - Loopback-only regression test and proof no external listener opens.
  - Fuzz/sanitizer tests for parser/strategy input, UDP and SOCKS state where feasible.
  - Load tests for connection/UDP state and product resource limits.
  - Shutdown/crash/cleanup tests.
  - Separate admission for Windows transparent routing and Android VpnService/TUN.
  - Only a new exact component set after all evidence can receive ADMIT.

notes:
  - Отсутствие опубликованных security advisories не считается доказательством безопасности.
  - REVIEW и BLOCK никогда не трактуются как PASS или ADMIT.
  - Этот manifest не разрешает запуск или интеграцию ByeDPI.
