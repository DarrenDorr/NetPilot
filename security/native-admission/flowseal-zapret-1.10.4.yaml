security_findings:
  - id: NETP-NATIVE-2026-001
    severity: HIGH
    status: CONFIRMED_IN_V72_9_SOURCE
    component: bin/winws.exe
    title: zapret1 TLS short-input length underflow / out-of-bounds read path
    evidence:
      - Upstream issue bol-van/zapret#2147 reports ASan heap-buffer-overflow on v72.12 through fake TLS template/config input.
      - v72.9 nfq/protocol.c contains TLSFindExtLenOffsetInHandshake(data+5,len-5,off) with no prior len >= 5 guard.
    release_effect: BLOCK

  - id: NETP-NATIVE-2026-002
    severity: HIGH
    status: CONFIRMED_IN_V72_9_SOURCE
    component: bin/winws.exe
    title: zapret1 QUIC unaligned 32-bit read
    evidence:
      - Upstream issue bol-van/zapret#2147 reports UBSan unaligned read on v72.12.
      - v72.9 nfq/protocol.c contains ntohl(*(uint32_t*)(data + 1)) in QUICExtractVersion().
    release_effect: BLOCK

required_before_admit:
  - Do not activate or release this exact Flowseal 1.10.4 / zapret v72.9 component set.
  - Select a maintained engine/component line or produce a separately reviewed patched build from authoritative source.
  - Any patched or replacement winws binary must receive a new immutable version identity, SHA-256, source revision, reproducible provenance where possible, and a fresh native admission review.
  - Re-run WinDivert and Cygwin admission if their bytes or versions change.
  - Add activation/install hash enforcement only for a component set whose admission_status is ADMIT.
  - Perform live UAC/SID/cross-user IPC integration tests before release independently of native admission.

evidence:
  - Official Flowseal GitHub release 1.10.4 is immutable and points to commit 176f56dc3f11ce5915c26abcdde903f93d835b64.
  - Official Flowseal release API reports ZIP SHA-256 291af673bd0238506f9548e0e94ca0abf244000f4c9a06960544fb01c5f97b34.
  - Native Admission Evidence run 40657705812 confirmed archive identity, safe-path checks, four-file native inventory, SHA-256 values, PE metadata and Authenticode status without executing downloaded components.
  - Native Admission Evidence run 40657903933 byte-matched Flowseal WinDivert.dll and WinDivert64.sys to official basil00/WinDivert v2.2.2 x64.
  - Native Admission Evidence run 40658718831 verified official zapret v72.9 ZIP SHA-256 2d8eef31e4966f32cd25b1ca361b0faa8f3c10cbaa514b8d0b6d82986784dfe7 and byte-matched Flowseal winws.exe and cygwin1.dll to its windows-x86_64 binaries.
  - Flowseal history identifies the current winws blob as winws v72.9, introduced by commit 41d2bca4d70f62adce42fc0e8d845797e59da757.
  - Upstream issue bol-van/zapret#2147 documents the parser findings on v72.12; upstream maintainer states zapret1 is EOL and closes without a zapret1 fix.
  - Direct source review of bol-van/zapret tag v72.9 confirms both reported vulnerable constructions are present.
  - Official Cygwin site reports current DLL 3.6.x and identifies 3.4.10 as the final release for Windows 7/8-era systems.
  - WinDivert official release list still identifies v2.2.2 as the latest release as of 2026-10-28.

notes:
  - Git blob SHA-1 is repository identity evidence, not a substitute for component SHA-256.
  - NotSigned is not automatically REJECT; it requires stronger immutable provenance and exact hash enforcement.
  - A release blocker in one privileged/native component blocks admission of the complete component set.
  - UNKNOWN/REVIEW/BLOCK must never be treated as PASS.
