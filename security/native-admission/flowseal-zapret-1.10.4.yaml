required_before_admit:
  - Map bin/winws.exe to an authoritative exact upstream zapret/winws release or source revision and record immutable provenance.
  - Complete current vendor/CVE/OSV/NVD/CISA KEV review for WinDivert 2.2.2 and the exact winws/Cygwin components.
  - Resolve Cygwin 3.4.10: either document a defensible compatibility requirement with risk acceptance, or update upstream/component while preserving byte-level admission.
  - Review the WinDivert64.sys signer-chain identity and document why it is acceptable for the official v2.2.2 artifact.
  - Enforce the approved component inventory and SHA-256 values in the activation/install path only after admission_status becomes ADMIT.
  - Change admission_status to ADMIT only after independent evidence is attached; do not infer PASS from provenance alone.

evidence:
  - Official Flowseal GitHub release 1.10.4 is immutable and points to commit 176f56dc3f11ce5915c26abcdde903f93d835b64.
  - Official Flowseal release API reports ZIP SHA-256 291af673bd0238506f9548e0e94ca0abf244000f4c9a06960544fb01c5f97b34.
  - GitHub Actions Native Admission Evidence run 40657705812 confirmed archive identity, safe path checks, four-file executable/native inventory, component SHA-256 values, PE metadata and Authenticode status without executing downloaded components.
  - GitHub Actions Native Admission Evidence run 40657903933 byte-compared Flowseal WinDivert.dll and WinDivert64.sys with official basil00/WinDivert v2.2.2 x64 and both matched exactly.
  - Official Cygwin site reports 3.4.10 as the last compatibility release for Windows 7/8-era systems and a newer supported DLL for current Windows.

notes:
  - Git blob SHA-1 is repository identity evidence, not a substitute for component SHA-256.
  - NotSigned is not automatically REJECT, but it requires stronger immutable provenance and exact hash enforcement.
  - UNKNOWN/REVIEW/BLOCK fields must never be treated as PASS.
