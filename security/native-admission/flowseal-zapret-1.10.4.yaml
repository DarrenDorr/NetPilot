    role: packet-processing executable
    size_bytes: 203776
    git_blob_sha1: bc2cc0ff325fd92da4130b9d781992ff49355ccc
    sha256: affb4f69d2ea302a7abccd5325d81826e140ddae014f1e070bc4a6c0dd555188
    exact_version: zapret-v72.9-windows-x86_64
    signature_status: NotSigned
    signer: null
    publisher: bol-van/zapret
    provenance: BYTE_MATCH_OFFICIAL_ZAPRET_V72_9_WINDOWS_X86_64
    decision: BLOCK
    blockers:
      - zapret1 is EOL according to the upstream maintainer.
      - A reproducible TLS short-input out-of-bounds read was reported against zapret1 v72.12, and the v72.9 source contains the same TLSFindExtLen(data+5,len-5,...) construction without a prior len >= 5 guard.
      - A reproducible QUIC unaligned 32-bit read was reported against v72.12, and the v72.9 source contains the same ntohl(*(uint32_t*)(data + 1)) construction.
      - Upstream closed the report without a zapret1 fix because zapret1 is EOL; therefore upgrading only from v72.9 to v72.12 does not resolve the finding.

